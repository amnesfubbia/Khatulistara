<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Versi Stabil</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #080808; color: #ffffff; font-family: sans-serif; margin: 0; }
        .glass-nav { background: rgba(10, 10, 10, 0.98); border-bottom: 1px solid #333; z-index: 1000; }
        .movie-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #222; }
        .type-badge { position: absolute; top: 5px; left: 5px; background: #ef4444; color: #fff; font-size: 8px; padding: 2px 5px; border-radius: 4px; z-index: 10; font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.9); padding: 10px; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full glass-nav p-3">
        <div class="container mx-auto flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div onclick="location.reload()" class="cursor-pointer">
                    <span class="text-xl font-black italic">AMNES</span><span class="text-xl font-black italic text-red-600">FILM</span>
                </div>
                <button onclick="loadMovies()" class="bg-blue-600 px-3 py-1 rounded text-[10px] font-bold">RELOAD DATA</button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="Cari film..." class="flex-grow bg-black border border-gray-700 p-2 rounded text-xs outline-none focus:border-red-600">
                <button onclick="searchIndo()" class="bg-red-600 px-4 py-2 rounded font-bold text-xs">CARI</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-32 pb-10">
        <div id="statusMessage" class="text-center py-10 text-gray-500 text-sm">Menghubungkan ke server...</div>
        
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>
        
        <div id="loader" class="text-center py-5 hidden">
            <div class="inline-block w-6 h-6 border-2 border-red-600 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="movieModal" class="modal" onclick="if(event.target==this) closeModal()">
        <div class="bg-black border border-gray-800 w-full max-w-2xl mx-auto mt-10 rounded-xl overflow-hidden shadow-2xl">
            <div id="modalContent"></div>
            <button onclick="closeModal()" class="w-full bg-gray-900 py-3 text-sm font-bold border-t border-gray-800">TUTUP</button>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';

        // Pastikan skrip jalan saat halaman siap
        window.onload = function() {
            console.log("Aplikasi dimulai...");
            loadMovies();
        };

        async function loadMovies() {
            const grid = document.getElementById('movieGrid');
            const status = document.getElementById('statusMessage');
            const loader = document.getElementById('loader');

            loader.classList.remove('hidden');
            status.innerText = "Sedang memuat film Indonesia...";

            const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&sort_by=popularity.desc`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Gagal mengambil data dari server.");
                
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    status.classList.add('hidden');
                    renderMovies(data.results);
                } else {
                    status.innerText = "Tidak ada film ditemukan.";
                }
            } catch (error) {
                console.error(error);
                status.innerHTML = `<div class="text-red-500">Koneksi Error: ${error.message}<br><small>Pastikan internet lancar atau coba matikan AdBlock.</small></div>`;
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            movies.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showDetail(m.id);
                card.innerHTML = `
                    <div class="type-badge">FILM</div>
                    <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" loading="lazy">
                    <div class="p-2 text-[9px] font-bold truncate">${m.title}</div>
                `;
                grid.appendChild(card);
            });
        }

        async function showDetail(id) {
            const content = document.getElementById('modalContent');
            content.innerHTML = '<div class="p-10 text-center">Memuat detail...</div>';
            document.getElementById('movieModal').style.display = 'block';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=id-ID`);
                const m = await res.json();
                
                content.innerHTML = `
                    <img src="${IMG + (m.backdrop_path || m.poster_path)}" class="w-full">
                    <div class="p-5">
                        <h2 class="text-xl font-bold mb-2">${m.title}</h2>
                        <p class="text-red-500 text-xs font-bold mb-4">Rating: ⭐ ${m.vote_average.toFixed(1)}</p>
                        <p class="text-gray-400 text-xs leading-relaxed mb-6">${m.overview || 'Sinopsis tidak tersedia.'}</p>
                        <a href="https://vidsrc.to/embed/movie/${m.id}" target="_blank" class="block w-full bg-red-600 text-center py-3 rounded-lg font-bold text-sm">NONTON SEKARANG</a>
                    </div>
                `;
            } catch (err) {
                content.innerHTML = '<div class="p-10 text-center text-red-500">Gagal memuat detail film.</div>';
            }
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; }

        async function searchIndo() {
            const q = document.getElementById('searchInput').value;
            if (!q) return;
            const grid = document.getElementById('movieGrid');
            const status = document.getElementById('statusMessage');
            
            grid.innerHTML = '';
            status.classList.remove('hidden');
            status.innerText = "Mencari...";

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
                const data = await res.json();
                if (data.results.length > 0) {
                    status.classList.add('hidden');
                    renderMovies(data.results);
                } else {
                    status.innerText = "Film tidak ditemukan.";
                }
            } catch (e) { status.innerText = "Pencarian gagal."; }
        }
    </script>
</body>
</html>
