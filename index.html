<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film - Streaming Indonesia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        .glass-nav { 
            background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .movie-card { transition: 0.3s; border-radius: 8px; overflow: hidden; background: #121212; height: 100%; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .movie-card:active { transform: scale(0.95); }
        
        .type-badge { position: absolute; top: 5px; left: 5px; background: #ef4444; color: white; font-size: 7px; font-weight: 900; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; z-index: 20; }
        
        .fav-btn { position: absolute; bottom: 35px; right: 8px; color: rgba(255,255,255,0.6); font-size: 16px; z-index: 30; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); transition: 0.3s; }
        .fav-btn.active { color: #ef4444; }

        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.98); overflow-y: auto; backdrop-filter: blur(25px); }
        #modalBackdrop { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(80px) brightness(0.2); opacity: 0.8; z-index: -1; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initApp()">

    <nav class="fixed top-0 w-full glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 cursor-pointer shrink-0" onclick="window.location.reload()">
                    <span class="text-lg font-black text-white italic tracking-tighter">AMNES</span>
                    <span class="text-lg font-black text-red-600 italic">FILM</span>
                </div>
                
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Cari film Indonesia..." class="w-full bg-[#000]/60 p-2 rounded-xl border border-white/10 outline-none focus:border-red-600 text-white text-[11px]">
                </div>
                <button onclick="searchIndo()" class="bg-red-600 px-3 py-2 rounded-xl font-black text-[10px] uppercase">Cari</button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-[#1a1a1a] p-2 rounded-lg outline-none text-white text-[10px] min-w-[90px]">
                    <option value="">Semua Genre</option>
                    <option value="27">Horor</option>
                    <option value="35">Komedi</option>
                    <option value="18">Drama</option>
                    <option value="28">Aksi</option>
                    <option value="10749">Romantis</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-[#1a1a1a] p-2 rounded-lg outline-none text-red-500 font-bold text-[10px] uppercase">
                    <option value="movie">Film</option>
                    <option value="tv">Series</option>
                </select>
                <button onclick="showFavorites()" class="bg-white/10 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase whitespace-nowrap border border-white/10">❤ My List</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-32 pb-10 min-h-screen">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
        <div id="scrollLoader" class="flex justify-center p-10 hidden">
            <div class="w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="movieModal" class="modal flex items-center justify-center p-2">
        <div class="bg-[#0a0a0a] w-full max-w-5xl rounded-3xl overflow-hidden relative border border-white/10 shadow-2xl">
            <div id="modalBackdrop"></div>
            <button onclick="closeModal()" class="absolute top-5 right-5 text-white bg-black/40 hover:bg-red-600 w-10 h-10 rounded-full z-50 flex items-center justify-center">✕</button>
            <div id="modalContent" class="flex flex-col md:flex-row relative z-10 max-h-[90vh] overflow-y-auto scrollbar-hide"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const ORI_IMG = 'https://image.tmdb.org/t/p/original';
        let currentPage = 1;
        let isLoading = false;
        let isSearchMode = false;
        let favorites = JSON.parse(localStorage.getItem('amnesIndoFavs')) || [];

        function initApp() {
            loadMovies();
            window.addEventListener('scroll', () => {
                if (!isLoading && !isSearchMode && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                    loadMovies(true);
                }
            });
        }

        async function loadMovies(isNextPage = false) {
            if (isLoading) return;
            isLoading = true;
            if (isNextPage) currentPage++;
            document.getElementById('scrollLoader').classList.remove('hidden');
            
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${currentPage}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.results) displayMovies(data.results, isNextPage);
            } catch (err) {
                console.error("Gagal memuat data", err);
            } finally {
                isLoading = false;
                document.getElementById('scrollLoader').classList.add('hidden');
            }
        }

        function displayMovies(movies, append = false) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            movies.forEach(item => {
                if(!item.poster_path) return;
                const isTV = item.name !== undefined;
                const isFav = favorites.some(f => f.id === item.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="type-badge">${isTV?'SERIES':'FILM'}</div>
                    <div class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <i class="fas fa-heart"></i>
                    </div>
                    <img src="${IMG_URL + item.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${item.id}, '${isTV?'tv':'movie'}')">
                    <div class="p-2" onclick="showDetail(${item.id}, '${isTV?'tv':'movie'}')">
                        <h3 class="text-[8px] font-bold truncate text-gray-200 uppercase">${item.title || item.name}</h3>
                    </div>`;
                grid.appendChild(card);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos&language=id-ID`);
            const movie = await res.json();
            const isFav = favorites.some(f => f.id === movie.id);
            
            document.getElementById('modalBackdrop').style.backgroundImage = `url(${ORI_IMG + (movie.backdrop_path || movie.poster_path)})`;
            const video = movie.videos.results.find(v => v.type === 'Trailer') || movie.videos.results[0];
            const videoSrc = video ? `https://www.youtube.com/embed/${video.key}?autoplay=1` : '';

            document.getElementById('modalContent').innerHTML = `
                <div class="md:w-1/3 p-6 border-r border-white/5">
                    <img src="${IMG_URL + movie.poster_path}" class="w-full rounded-2xl border border-white/10 mb-4">
                    <button onclick='toggleFavFromModal(${JSON.stringify(movie).replace(/'/g, "\\'")})' id="modalFavBtn" 
                        class="w-full ${isFav?'bg-red-600':'bg-white/10'} py-3 rounded-xl text-[10px] font-black mb-4">
                        <i class="fas fa-heart mr-2"></i> ${isFav?'DI FAVORIT':'TAMBAH FAVORIT'}
                    </button>
                    <a href="https://vidsrc.to/embed/${type}/${movie.id}" target="_blank" class="block w-full bg-red-600 text-center py-4 rounded-xl text-xs font-black uppercase italic shadow-lg">NONTON SEKARANG</a>
                </div>
                <div class="md:w-2/3 p-8">
                    <h2 class="text-3xl font-black text-white uppercase italic mb-2 leading-none">${movie.title || movie.name}</h2>
                    <p class="text-[10px] text-red-500 font-black mb-4 uppercase">⭐ ${movie.vote_average.toFixed(1)} | ${movie.genres.map(g => g.name).join(', ')}</p>
                    <div class="mb-6 rounded-xl overflow-hidden aspect-video bg-black shadow-2xl border border-white/5">
                        <iframe class="w-full h-full" src="${videoSrc}" frameborder="0" allowfullscreen allow="autoplay"></iframe>
                    </div>
                    <p class="text-[11px] font-black text-gray-500 uppercase mb-2">Sinopsis</p>
                    <p class="text-[13px] text-gray-300 italic leading-relaxed">"${movie.overview || 'Sinopsis belum tersedia.'}"</p>
                </div>`;
            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function toggleFav(e, item) {
            e.stopPropagation();
            const idx = favorites.findIndex(f => f.id === item.id);
            if(idx === -1) { favorites.push(item); e.currentTarget.classList.add('active'); }
            else { favorites.splice(idx, 1); e.currentTarget.classList.remove('active'); }
            localStorage.setItem('amnesIndoFavs', JSON.stringify(favorites));
        }

        function toggleFavFromModal(item) {
            const idx = favorites.findIndex(f => f.id === item.id);
            const btn = document.getElementById('modalFavBtn');
            if(idx === -1) { 
                favorites.push(item); 
                btn.classList.replace('bg-white/10', 'bg-red-600');
                btn.innerHTML = '<i class="fas fa-heart mr-2"></i> DI FAVORIT';
            } else { 
                favorites.splice(idx, 1); 
                btn.classList.replace('bg-red-600', 'bg-white/10');
                btn.innerHTML = '<i class="fas fa-heart mr-2"></i> TAMBAH FAVORIT';
            }
            localStorage.setItem('amnesIndoFavs', JSON.stringify(favorites));
            resetAndLoad(); // Refresh grid di belakang modal
        }

        function resetAndLoad() { 
            currentPage = 1; 
            isSearchMode = false; 
            document.getElementById('movieGrid').innerHTML = ''; 
            loadMovies(); 
        }

        async function searchIndo() {
            const q = document.getElementById('searchInput').value; 
            if (!q) return;
            isSearchMode = true; 
            document.getElementById('movieGrid').innerHTML = '';
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            displayMovies(data.results.filter(m => (m.origin_country && m.origin_country.includes('ID')) || m.original_language === 'id'), false);
        }

        function showFavorites() { 
            isSearchMode = true; 
            displayMovies(favorites, false); 
            if(favorites.length === 0) document.getElementById('movieGrid').innerHTML = '<p class="col-span-3 text-center text-gray-500 py-20 text-xs uppercase font-black">Belum ada film yang disukai</p>';
        }

        function closeModal() { 
            document.getElementById('movieModal').style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
            document.getElementById('modalContent').innerHTML = '';
        }

        window.onclick = (e) => { if (e.target.id == 'movieModal') closeModal(); }
    </script>
</body>
</html>
