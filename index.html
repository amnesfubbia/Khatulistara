<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* PROFESSIONAl SPLASH SCREEN */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s; }
        .splash-main { display: flex; flex-direction: column; align-items: center; animation: zoomIn 1s ease-out; }
        .splash-logo { width: 70px; height: 70px; margin-bottom: 15px; object-fit: contain; }
        .splash-title { color: #ffffff; font-size: 14px; font-weight: 500; letter-spacing: 4px; text-transform: uppercase; }
        .splash-footer { position: absolute; bottom: 60px; text-align: center; }
        .from-text { font-size: 11px; color: #737373; letter-spacing: 1.5px; margin-bottom: 4px; text-transform: lowercase; }
        .brand-text { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .splash-hidden { opacity: 0; visibility: hidden; }

        /* PROFILE HEADER & STATS */
        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo-wrapper { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .ig-logo { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 58px; height: 58px; }
        .profile-pic-logo { width: 55px; height: 55px; border-radius: 50%; border: 1px solid #262626; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .profile-pic-logo img { width: 100%; height: 100%; object-fit: cover; }
        .add-story-btn { position: absolute; bottom: 0; right: 0; width: 18px; height: 18px; background: #0095f6; border: 2px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #fff; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 15px; display: block; }
        .stat-label { font-size: 11px; color: #a8a8a8; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; }
        .bio-name { font-weight: 700; font-size: 14px; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* FILTER & HIGHLIGHTS */
        #filterBar { display: none; margin-bottom: 15px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; }
        .hl-logo { font-size: 10px; font-weight: 900; color: #fff; }

        /* GRID SYSTEM */
        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; background: rgba(255,255,255,0.9); color: #000; }

        /* MODAL & SEARCH */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        #searchOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; }
        .search-header { position: sticky; top: 0; background: #000; display: flex; items-center; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #1c1c1c; }
        .search-input-box { flex-grow: 1; background: #262626; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; position: relative; }
        .search-input-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; width: 100%; margin-left: 8px; }
        
        /* SERVER & DOWNLOAD */
        .server-btn { width: 100%; padding: 12px 5px; border-radius: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; background: #0a0a0a; color: #fff; }
        .dl-link-btn { width: 100%; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-main">
            <img src="amnesfubbia.png" class="splash-logo" alt="Logo">
            <div class="splash-title">amnesfubbia</div>
        </div>
        <div class="splash-footer">
            <div class="from-text">from</div>
            <div class="brand-text">ANASTEAS</div>
        </div>
    </div>

    <div id="mainApp" style="opacity: 0;">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="location.reload()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5">
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><img src="amnesfubbia.png" alt="Logo"></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('movie')"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('tv')"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('short')"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="flex items-center gap-1"><span class="bio-name">amnesfubbia</span><i class="fa-solid fa-circle-check text-blue-500 text-[13px]"></i></div>
                <span class="text-zinc-300">dari indonesia untuk dunia</span><br><span class="text-zinc-500 text-xs">By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" onclick="loadTrending()">Populer</div>
                <div class="btn-ig" onclick="toggleFilterBar()">Filter</div>
                <div class="btn-icon-sq" onclick="openSearch()"><i class="fa-solid fa-magnifying-glass text-sm"></i></div>
            </div>

            <div id="filterBar" class="grid grid-cols-3 gap-2 mt-2">
                <button class="pill" onclick="setGenre(28)">Action</button>
                <button class="pill" onclick="setGenre(27)">Horror</button>
                <button class="pill" onclick="setGenre(16)">Anime</button>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar"><div class="highlights-container no-scrollbar" id="highlightList"></div></div>

        <div class="tab-nav">
            <div class="tab-item active" id="tabGrid" onclick="switchTab('grid')"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" onclick="switchTab('likes')"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" onclick="switchTab('bookmarks')"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="searchOverlay">
        <div class="search-header">
            <i class="fa-solid fa-arrow-left text-xl" onclick="closeSearch()"></i>
            <div class="search-input-box">
                <input type="text" id="searchInp" placeholder="Cari film atau series..." onkeydown="if(event.key==='Enter') searchAction()">
            </div>
        </div>
        <div id="searchGrid" class="movie-grid"></div>
    </div>

    <div id="movieModal" class="modal-player">
        <div class="p-4 border-b border-zinc-900 sticky top-0 bg-black flex items-center">
            <i class="fa-solid fa-chevron-left text-xl" onclick="closeModal()"></i>
            <div class="flex-grow text-center font-bold text-sm" id="mTitle"></div>
        </div>
        <div id="playerArea" class="aspect-video bg-zinc-900"></div>
        <div class="p-4">
            <div id="mDesc" class="text-sm text-zinc-300 mb-4"></div>
            <div id="serverList" class="grid grid-cols-3 gap-2 mb-6"></div>
            <div class="grid grid-cols-2 gap-2">
                <button id="btnLike" class="pill" onclick="toggleLib('likes')">Sukai</button>
                <button id="btnBook" class="pill" onclick="toggleLib('bookmarks')">Simpan</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer" onclick="location.reload()"></i>
        <i class="fa-solid fa-magnifying-glass" onclick="openSearch()"></i>
        <i class="fa-regular fa-bookmark" onclick="switchTab('bookmarks')"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let currentType = 'movie', page = 1, currentId = null;

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('splash-hidden');
                document.getElementById('mainApp').style.opacity = "1";
                document.getElementById('mainApp').style.transition = "opacity 0.8s";
            }, 2500);
            loadTrending();
            initHighlights();
        };

        async function loadTrending() {
            const res = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&language=id-ID`);
            const data = await res.json();
            renderGrid(data.results, document.getElementById('feedGrid'));
        }

        function renderGrid(items, grid) {
            grid.innerHTML = '';
            items.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.media_type || currentType);
                card.innerHTML = `<div class="badge-rating">★ ${m.vote_average.toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            currentId = id;
            document.getElementById('movieModal').style.display = 'block';
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID`);
            const d = await res.json();
            document.getElementById('mTitle').innerText = d.title || d.name;
            document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia.";
            document.getElementById('playerArea').innerHTML = `<iframe src="https://vidrock.net/embed/${type}/${id}" class="w-full h-full" allowfullscreen></iframe>`;
            document.getElementById('serverList').innerHTML = `<button class="server-btn" onclick="playS('${type}',${id},1)">Server 1</button><button class="server-btn" onclick="playS('${type}',${id},2)">Server 2</button><button class="server-btn" onclick="window.open('https://dl.vidsrc.vip/${type}/${id}')">Download</button>`;
        }

        function playS(t,i,s) {
            const url = s === 1 ? `https://vidrock.net/embed/${t}/${i}` : `https://vidsrc.me/embed/${t}?tmdb=${i}`;
            document.getElementById('playerArea').innerHTML = `<iframe src="${url}" class="w-full h-full" allowfullscreen></iframe>`;
        }

        function toggleFilterBar() { const b = document.getElementById('filterBar'); b.style.display = b.style.display === 'grid' ? 'none' : 'grid'; }
        function openSearch() { document.getElementById('searchOverlay').style.display = 'block'; }
        function closeSearch() { document.getElementById('searchOverlay').style.display = 'none'; }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('playerArea').innerHTML = ''; }

        async function searchAction() {
            const q = document.getElementById('searchInp').value;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?query=${q}&api_key=${API_KEY}&language=id-ID`);
            const data = await res.json();
            renderGrid(data.results, document.getElementById('searchGrid'));
        }

        function initHighlights() {
            const hls = [{n:'Ghibli',l:'GHB'},{n:'Anime',l:'ANI'},{n:'Korea',l:'KOR'}];
            const cont = document.getElementById('highlightList');
            hls.forEach(h => {
                cont.innerHTML += `<div class="highlight-item"><div class="highlight-circle"><span class="hl-logo">${h.l}</span></div><div class="highlight-text">${h.n}</div></div>`;
            });
        }

        function toggleLib(k) {
            let items = JSON.parse(localStorage.getItem(k) || '[]');
            const idx = items.indexOf(currentId);
            idx > -1 ? items.splice(idx, 1) : items.push(currentId);
            localStorage.setItem(k, JSON.stringify(items));
            alert(idx > -1 ? 'Dihapus' : 'Disimpan');
        }

        async function switchTab(mode) {
            if(mode === 'grid') loadTrending();
            else {
                const items = JSON.parse(localStorage.getItem(mode) || '[]');
                const grid = document.getElementById('feedGrid'); grid.innerHTML = '';
                for(const id of items) {
                    const r = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=id-ID`);
                    const m = await r.json();
                    if(m.poster_path) renderGrid([m], grid);
                }
            }
        }
    </script>
</body>
</html>
