<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { background-color: #050505; color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }

        .nav-fixed {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 50; padding: 12px 0;
        }

        .search-input {
            width: 100%; background: #151515; border: 1px solid #333;
            padding: 10px 40px 10px 15px; border-radius: 10px;
            color: white; font-size: 13px; outline: none;
        }

        .movie-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; padding: 160px 12px 100px 12px;
        }
        @media (min-width: 768px) {
            .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; padding: 170px 40px 100px 40px; }
        }

        .card { 
            position: relative; aspect-ratio: 2/3; background: #111; 
            border-radius: 12px; overflow: hidden; cursor: pointer;
            transition: 0.2s; border: 1px solid #222;
        }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* BADGE COLORS */
        .badge {
            position: absolute; top: 8px; right: 8px;
            padding: 3px 7px; border-radius: 5px;
            font-size: 8px; font-weight: 900; z-index: 10;
            text-transform: uppercase;
        }
        .badge-movie { background: #e11d48; }
        .badge-tv { background: #2563eb; }
        .badge-short { background: #f59e0b; color: #000; } /* Warna Kuning untuk Short */

        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: black; overflow-y: auto; }
        .modal-box { min-height: 100vh; background: #080808; padding: 20px; padding-top: 60px; }
        @media (min-width: 768px) { .modal-box { max-width: 1000px; margin: 0 auto; } }

        .btn-red {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 14px; margin-bottom: 10px;
            background: #e11d48; color: white; border-radius: 10px;
            font-size: 11px; font-weight: 800; cursor: pointer; border: none;
        }

        .menu-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .menu-scroll::-webkit-scrollbar { display: none; }
        
        select { 
            background: #151515; color: white; border: 1px solid #333; 
            padding: 8px 12px; border-radius: 8px; font-size: 10px; font-weight: bold;
        }

        #btnTop {
            display: none; position: fixed; bottom: 25px; right: 20px;
            width: 45px; height: 45px; background: #e11d48; color: white;
            border-radius: 50%; border: none; z-index: 90;
        }
    </style>
</head>
<body>

    <nav class="nav-fixed">
        <div class="container mx-auto px-4">
            <div class="flex items-center gap-3 mb-4">
                <div onclick="location.reload()" class="cursor-pointer shrink-0">
                    <span class="text-xl font-black italic">AMNESFUBBIA<span class="text-red-600">FILM</span></span>
                </div>
                <div class="relative w-full">
                    <input type="text" id="inputCari" class="search-input" placeholder="Cari Film..." onkeypress="if(event.key==='Enter') cariFilm()">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                </div>
            </div>

            <div class="menu-scroll">
                <select id="pilihTipe" onchange="resetLoad()">
                    <option value="multi">SEMUA</option>
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                    <option value="short">FILM PENDEK</option>
                </select>
                <select id="pilihGenre" onchange="resetLoad()">
                    <option value="">GENRE (SEMUA)</option>
                    <option value="28">Aksi</option><option value="27">Horor</option>
                    <option value="35">Komedi</option><option value="18">Drama</option>
                </select>
                <select id="pilihTahun" onchange="resetLoad()">
                    <option value="">TAHUN</option>
                    <script>for(let t=2026;t>=2010;t--) document.write(`<option value="${t}">${t}</option>`);</script>
                </select>
                <select id="pilihSort" onchange="resetLoad()" class="flex-grow">
                    <option value="popularity.desc">TERPOPULER</option>
                    <option value="primary_release_date.desc">TERBARU</option>
                </select>
            </div>
        </div>
    </nav>

    <div id="gridFilm" class="movie-grid"></div>
    <div id="loader" class="text-center py-10 font-bold text-gray-600">MEMUAT DATA INDONESIA...</div>

    <button id="btnTop" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>

    <div id="modalFilm" class="modal">
        <div class="modal-box">
            <button onclick="tutupModal()" class="fixed top-5 right-5 bg-red-600 text-white w-10 h-10 rounded-full z-[110] font-bold">✕</button>
            <div class="flex flex-col lg:flex-row gap-8">
                <div class="lg:w-2/3">
                    <h1 id="jdl" class="text-2xl font-black mb-2">JUDUL</h1>
                    <p id="inf" class="text-[10px] text-gray-500 font-black mb-5 tracking-widest uppercase"></p>
                    <div class="aspect-video bg-black rounded-2xl overflow-hidden mb-6 border border-white/5">
                        <iframe id="layar" class="w-full h-full" allowfullscreen></iframe>
                    </div>
                    <h3 class="text-red-600 text-[10px] font-black tracking-[3px] mb-2 uppercase">Sinopsis</h3>
                    <p id="sinop" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>
                <div class="lg:w-1/3">
                    <p class="text-gray-500 text-[10px] font-bold mb-4 uppercase tracking-widest">Streaming</p>
                    <div id="btnStream"></div>
                    <div class="my-6 border-t border-white/5"></div>
                    <p class="text-gray-500 text-[10px] font-bold mb-4 uppercase tracking-widest">Download</p>
                    <div id="btnDown"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'bfa7df5310c9974f62f26c6789a8c00d';
        let hal = 1;
        let sedangMemuat = false;

        window.onload = memuatFilm;
        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (!sedangMemuat) loadLagi();
            }
        };

        async function memuatFilm() {
            if (sedangMemuat) return;
            sedangMemuat = true;
            document.getElementById('loader').style.display = 'block';

            const tipeInput = document.getElementById('pilihTipe').value;
            const genre = document.getElementById('pilihGenre').value;
            const tahun = document.getElementById('pilihTahun').value;
            const sort = document.getElementById('pilihSort').value;

            let tipeQuery = (tipeInput === 'short' || tipeInput === 'multi') ? 'movie' : tipeInput;
            
            // Base URL Discover
            let url = `https://api.themoviedb.org/3/discover/${tipeQuery}?api_key=${API}&with_origin_country=ID&language=id-ID&page=${hal}&sort_by=${sort}`;
            
            // Jika pilih Film Pendek, kita filter durasi < 45 menit
            if(tipeInput === 'short') url += `&with_runtime.lte=45`;
            if(genre) url += `&with_genres=${genre}`;
            if(tahun) url += `&primary_release_year=${tahun}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                // Ambil detail tambahan untuk mengecek durasi (badge short)
                const detailedResults = await Promise.all(data.results.map(async (m) => {
                    const detailRes = await fetch(`https://api.themoviedb.org/3/${tipeQuery}/${m.id}?api_key=${API}`);
                    const detailData = await detailRes.json();
                    return { ...m, runtime: detailData.runtime, type: tipeQuery };
                }));

                tampilkan(detailedResults);
            } catch (e) { console.error(e); }
            finally {
                sedangMemuat = false;
                document.getElementById('loader').style.display = 'none';
            }
        }

        function tampilkan(data) {
            const grid = document.getElementById('gridFilm');
            if(hal === 1) grid.innerHTML = '';
            
            data.forEach(film => {
                if(!film.poster_path) return;
                const kartu = document.createElement('div');
                kartu.className = 'card';
                
                // Logika Badge
                let badgeHTML = '';
                if(film.runtime > 0 && film.runtime <= 45) {
                    badgeHTML = `<div class="badge badge-short">SHORT</div>`;
                } else if(film.type === 'tv' || film.first_air_date) {
                    badgeHTML = `<div class="badge badge-tv">SERIES</div>`;
                } else {
                    badgeHTML = `<div class="badge badge-movie">FILM</div>`;
                }
                
                kartu.onclick = () => bukaModal(film.id, film.type || 'movie');
                kartu.innerHTML = `
                    ${badgeHTML}
                    <img src="https://image.tmdb.org/t/p/w500${film.poster_path}" loading="lazy">
                `;
                grid.appendChild(kartu);
            });
        }

        async function bukaModal(id, tipe) {
            document.getElementById('modalFilm').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const [resID, resEN] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${tipe}/${id}?api_key=${API}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${tipe}/${id}?api_key=${API}&language=en-US`)
            ]);
            const dI = await resID.json();
            const dE = await resEN.json();

            document.getElementById('jdl').innerText = dI.title || dI.name;
            document.getElementById('inf').innerText = `${dI.release_date || dI.first_air_date || ''} • ⭐ ${dI.vote_average.toFixed(1)} • ${dI.runtime ? dI.runtime+'m' : 'TV'}`;
            document.getElementById('sinop').innerText = dI.overview || dE.overview || "Sinopsis belum tersedia.";
            
            const v = dI.videos?.results.find(x => x.type === 'Trailer');
            document.getElementById('layar').src = v ? `https://www.youtube.com/embed/${v.key}` : '';

            const btn = (n, l) => `<button onclick="document.getElementById('layar').src='${l}'" class="btn-red"><span>${n}</span> <i class="fa-solid fa-play"></i></button>`;
            document.getElementById('btnStream').innerHTML = btn('SERVER UTAMA', `https://vidsrc.xyz/embed/${tipe}/${id}`) + btn('SERVER CADANGAN', `https://vidsrc.to/embed/${tipe}/${id}`);
            document.getElementById('btnDown').innerHTML = `<a href="https://dl.vidsrc.vip/${tipe}/${id}" target="_blank" class="btn-red" style="text-decoration:none"><span>DOWNLOAD</span> <i class="fa-solid fa-download"></i></a>`;
        }

        function tutupModal() {
            document.getElementById('modalFilm').style.display = 'none';
            document.getElementById('layar').src = '';
            document.body.style.overflow = 'auto';
        }

        async function cariFilm() {
            const q = document.getElementById('inputCari').value;
            if(!q) return resetLoad();
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            hal = 1;
            tampilkan(data.results.map(m => ({...m, type: m.media_type})));
        }

        function loadLagi() { hal++; memuatFilm(); }
        function resetLoad() { hal = 1; window.scrollTo(0,0); memuatFilm(); }
    </script>
</body>
</html>
