<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - Premium Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }
        
        .category-wrapper { padding: 5px 15px 10px 15px; }
        .pill-grid { display: grid; gap: 6px; margin-bottom: 8px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; transition: 0.2s; }
        .pill.active { border-color: #fff; background: rgba(255,255,255,0.1); }
        
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 360px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        
        .modal-player { display: none; position: fixed; inset: 0; z-index: 400; background: #000; overflow-y: auto; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
        
        /* Dropdowns for new menus */
        .filter-dropdown { display: none; position: fixed; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 200; width: 150px; max-height: 250px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .filter-item { padding: 12px; font-size: 11px; text-align: center; border-bottom: 1px solid #1c1c1c; color: #bbb; cursor: pointer; }
        .filter-item:hover { color: #fff; background: #1a1a1a; }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:2px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-4 text-xl">
                    <i class="fa-regular fa-bookmark cursor-pointer" onclick="showLibrary('bookmarks')"></i>
                </div>
            </div>
            <div class="search-area mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari judul film, series, anime..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
            </div>
        </header>

        <div class="category-wrapper">
            <div class="pill-grid grid-cols-5">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
                <button class="pill" onclick="setFilter('anime', '16', this)">Anime</button>
            </div>
            
            <div class="pill-grid grid-cols-4">
                <button class="pill active" onclick="setSchedule('trending', this)">Trending</button>
                <button class="pill" onclick="setSchedule('popular', this)">Populer</button>
                <button class="pill" onclick="setSchedule('now_playing', this)">Sedang Tayang</button>
                <button class="pill" onclick="setSchedule('upcoming', this)">Segera</button>
            </div>

            <div class="pill-grid grid-cols-3">
                <button class="pill" onclick="toggleFilter('countryDropdown', this)">Negara <i class="fa-solid fa-caret-down ml-1"></i></button>
                <button class="pill" onclick="toggleFilter('genreDropdown', this)">Genre <i class="fa-solid fa-caret-down ml-1"></i></button>
                <button class="pill" id="yearBtn" onclick="toggleFilter('yearDropdown', this)">Tahun <i class="fa-solid fa-caret-down ml-1"></i></button>
            </div>
        </div>
    </div>

    <div id="countryDropdown" class="filter-dropdown left-[15px] top-[265px]">
        <div class="filter-item" onclick="setCountry('', 'Negara')">Semua</div>
        <div class="filter-item" onclick="setCountry('US', 'USA')">USA</div>
        <div class="filter-item" onclick="setCountry('ID', 'Indonesia')">Indonesia</div>
        <div class="filter-item" onclick="setCountry('KR', 'Korea')">Korea</div>
        <div class="filter-item" onclick="setCountry('JP', 'Jepang')">Jepang</div>
        <div class="filter-item" onclick="setCountry('CN', 'China')">China</div>
    </div>

    <div id="genreDropdown" class="filter-dropdown left-[35%] top-[265px]">
        <div class="filter-item" onclick="setGenre('', 'Genre')">Semua</div>
        <div class="filter-item" onclick="setGenre('28', 'Aksi')">Aksi</div>
        <div class="filter-item" onclick="setGenre('27', 'Horor')">Horor</div>
        <div class="filter-item" onclick="setGenre('35', 'Komedi')">Komedi</div>
        <div class="filter-item" onclick="setGenre('10749', 'Romantis')">Romantis</div>
        <div class="filter-item" onclick="setGenre('878', 'Sci-Fi')">Sci-Fi</div>
    </div>

    <div id="yearDropdown" class="filter-dropdown right-[15px] top-[265px] no-scrollbar"></div>

    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="location.reload()"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="document.getElementById('searchInp').focus()"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="showLibrary('likes')"><i class="fa-regular fa-heart"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-sm font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div class="aspect-video bg-zinc-900 w-full">
                <iframe id="videoPlayer" class="w-full h-full" allowfullscreen></iframe>
            </div>
            <div class="px-4 py-6">
                <div class="flex gap-6 mb-4">
                    <i id="btnLikeModal" class="text-2xl cursor-pointer"></i>
                    <i id="btnBookModal" class="text-2xl cursor-pointer"></i>
                </div>
                <p id="mDesc" class="text-sm leading-relaxed text-zinc-300"></p>
                <div id="serverList" class="grid grid-cols-2 gap-2 mt-6"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', searchQuery = '';

        window.onload = () => { initYears(); loadFeed(); };

        function initYears() {
            const d = document.getElementById('yearDropdown');
            let h = '<div class="filter-item" onclick="setYear(\'\')">Semua</div>';
            for(let y=2026; y>=1970; y--) h += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            d.innerHTML = h;
        }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            const params = `api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false`;
            let url = '';

            if(searchQuery) {
                url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&${params}`;
            } else if (currentSchedule !== 'trending') {
                url = `https://api.themoviedb.org/3/movie/${currentSchedule}?${params}`;
            } else {
                let t = (currentType === 'tv' || currentType === 'anime') ? 'tv' : 'movie';
                url = `https://api.themoviedb.org/3/discover/${t}?${params}`;
                if(currentGenre) url += `&with_genres=${currentGenre}`;
                if(currentYear) url += (t === 'movie' ? `&primary_release_year=${currentYear}` : `&first_air_date_year=${currentYear}`);
                if(currentCountry) url += `&with_origin_country=${currentCountry}`;
                if(currentType === 'short') url += `&with_runtime.lte=40`;
                url += `&sort_by=popularity.desc`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderItems(data.results);
            } catch(e) {}
            loading = false;
        }

        function renderItems(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openModal(m.id, m.media_type || (currentType === 'tv' || currentType === 'anime' ? 'tv' : 'movie'));
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star"></i> ${m.vote_average.toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        function toggleFilter(id, el) {
            const d = document.getElementById(id);
            const isVisible = d.style.display === 'block';
            document.querySelectorAll('.filter-dropdown').forEach(dropdown => dropdown.style.display = 'none');
            d.style.display = isVisible ? 'none' : 'block';
        }

        function setFilter(t, v, el) {
            searchQuery = ''; currentSchedule = 'trending';
            if(t === 'anime') { currentType = 'tv'; currentGenre = '16'; } 
            else { currentType = v; if(t === 'type') currentGenre = ''; }
            
            updatePills(el);
            loadFeed(true);
        }

        function setSchedule(v, el) {
            currentSchedule = v; searchQuery = '';
            updatePills(el);
            loadFeed(true);
        }

        function setCountry(v, label) { currentCountry = v; closeDropdowns(); loadFeed(true); }
        function setGenre(v, label) { currentGenre = v; closeDropdowns(); loadFeed(true); }
        function setYear(v) { currentYear = v; document.getElementById('yearBtn').innerHTML = (v || 'Tahun') + ' <i class="fa-solid fa-caret-down ml-1"></i>'; closeDropdowns(); loadFeed(true); }

        function closeDropdowns() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none'); }
        function updatePills(el) { el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active')); el.classList.add('active'); }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            const [resId, resEn] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`)
            ]);
            const dId = await resId.json();
            const dEn = await resEn.json();

            document.getElementById('mTitle').innerText = dId.title || dId.name;
            document.getElementById('mDesc').innerText = dId.overview || dEn.overview || "Sinopsis tidak tersedia.";
            
            const vids = [...(dId.videos?.results || []), ...(dEn.videos?.results || [])];
            const tr = vids.find(v => v.type === 'Trailer') || vids[0];
            document.getElementById('videoPlayer').src = tr ? `https://www.youtube.com/embed/${tr.key}?autoplay=1` : (type==='tv' ? `https://vidrock.net/embed/tv/${id}/1/1` : `https://vidrock.net/embed/movie/${id}`);

            document.getElementById('serverList').innerHTML = type === 'movie' ? 
                `<button class="server-btn bg-white text-black" onclick="document.getElementById('videoPlayer').src='https://vidrock.net/embed/movie/${id}'">Server Utama</button>` : '';
            
            updateLibButtons(id);
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        
        function toggleLib(k) {
            let items = JSON.parse(localStorage.getItem(k) || '[]');
            const idx = items.findIndex(x => x.id == window.currentMediaId);
            idx > -1 ? items.splice(idx,1) : items.push({id: window.currentMediaId, type: window.currentMediaType});
            localStorage.setItem(k, JSON.stringify(items)); updateLibButtons(window.currentMediaId);
        }

        function updateLibButtons(id) {
            const isL = JSON.parse(localStorage.getItem('likes') || '[]').some(x=>x.id==id);
            const isB = JSON.parse(localStorage.getItem('bookmarks') || '[]').some(x=>x.id==id);
            document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart';
            document.getElementById('btnLikeModal').onclick = () => toggleLib('likes');
            document.getElementById('btnBookModal').className = isB ? 'fa-solid fa-bookmark text-white' : 'fa-regular fa-bookmark';
            document.getElementById('btnBookModal').onclick = () => toggleLib('bookmarks');
        }

        function showLibrary(k) {
            const items = JSON.parse(localStorage.getItem(k) || '[]');
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = items.length ? '' : '<div class="col-span-3 text-center py-20 opacity-50 text-xs">Belum ada daftar</div>';
            items.forEach(async item => {
                const res = await fetch(`https://api.themoviedb.org/3/${item.type}/${item.id}?api_key=${API_KEY}`);
                const m = await res.json();
                renderItems([m]);
            });
        }

        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
