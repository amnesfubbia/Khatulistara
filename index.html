<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHATULISTARA — Ensiklopedia Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep: #0f3d2c;
    --green-dark: #0a2e21;
    --green-mid: #14523c;
    --gold: #c9a24b;
    --gold-soft: #ddbd77;
    --clay: #b5502f;
    --cream: #f7f1e3;
    --cream-2: #efe6d2;
    --card: #ffffff;
    --ink: #1c2420;
    --ink-soft: #4a5650;
    --muted: #8a9089;
    --line: #e8dfc9;
    --font-display: "Fraunces", serif;
    --font-body: "Work Sans", sans-serif;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ===== App shell / header ===== */
  .appheader{
    position:sticky; top:0; z-index:60;
    background:linear-gradient(160deg, var(--green-mid), var(--green-deep) 55%, var(--green-dark));
    border-radius:0 0 26px 26px;
    padding:18px 20px 26px;
    color:#fff;
    box-shadow:0 8px 24px rgba(10,46,33,0.25);
  }
  .appheader-row{display:flex; align-items:center; gap:12px;}
  .appheader-back{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.12); cursor:pointer; flex-shrink:0;
    font-size:16px; color:#fff; user-select:none;
  }
  .appheader-back:hover{background:rgba(255,255,255,0.2);}
  .brand{
    display:flex; align-items:center; gap:12px; cursor:pointer; flex:1; min-width:0;
  }
  .brand .logo-badge{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 70%);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 3px 10px rgba(0,0,0,0.25);
  }
  .brand .brand-text{min-width:0;}
  .brand .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:17px;
    letter-spacing:0.06em; color:#fff; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand .brand-sub{
    font-size:10.5px; color:var(--gold-soft); letter-spacing:0.03em; margin-top:1px;
  }
  .header-title{
    font-family:var(--font-body); font-weight:600; font-size:17px; color:#fff;
    flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-icon{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#fff; cursor:pointer;
  }
  .header-icon:hover{background:rgba(255,255,255,0.2);}
  .header-icon.active{background:var(--gold); color:var(--green-dark);}

  .searchwrap{
    position:relative; margin-top:16px;
  }
  .searchwrap input{
    width:100%;
    background:#fff;
    border:none;
    color:var(--ink);
    padding:13px 16px 13px 42px;
    border-radius:14px;
    font-family:var(--font-body);
    font-size:14px;
    outline:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
  }
  .searchwrap input::placeholder{color:var(--muted);}
  .searchwrap-icon{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    font-size:15px; color:var(--muted); pointer-events:none;
  }
  .searchresults{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    max-height:420px; overflow-y:auto;
    box-shadow:0 20px 40px rgba(0,0,0,0.18);
    display:none;
    z-index:70;
  }
  .searchresults.show{display:block;}
  .sr-item{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
  }
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:var(--cream);}
  .sr-item .sr-name{font-weight:600; font-size:14px; color:var(--ink);}
  .sr-item .sr-meta{font-size:12px; color:var(--muted);}

  /* ===== Page container ===== */
  .page{padding:18px 18px 24px; max-width:640px; margin:0 auto;}

  /* ===== Info card (home "Info Nusantara Hari Ini") ===== */
  .infocard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:0 4px 14px rgba(20,40,30,0.06);
  }
  .infocard .infocard-text{flex:1; min-width:0;}
  .infocard .infocard-date{font-size:11.5px; color:var(--clay); font-weight:600; margin-bottom:4px;}
  .infocard .infocard-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:0 0 6px; color:var(--ink);}
  .infocard .infocard-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 6px;}
  .infocard .infocard-link{font-size:12px; color:var(--green-deep); font-weight:600; cursor:pointer;}
  .infocard .infocard-icon{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(160deg, var(--cream-2), var(--gold-soft));
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }

  /* ===== Section headers ===== */
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin:26px 0 12px;
  }
  .section-head h3{
    font-family:var(--font-display); font-size:16.5px; font-weight:700; margin:0; color:var(--ink);
  }
  .section-head .see-all{font-size:12px; color:var(--green-deep); font-weight:600; cursor:pointer;}

  /* ===== Icon grid (home main menu) ===== */
  .icongrid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px 10px;
  }
  .icongrid-item{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    cursor:pointer; text-align:center;
  }
  .icongrid-item .icb{
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(160deg, var(--cream-2), var(--gold-soft));
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    box-shadow:0 4px 10px rgba(20,40,30,0.08);
    transition:transform .15s;
  }
  .icongrid-item:hover .icb{transform:translateY(-2px);}
  .icongrid-item .icb-label{font-size:11px; color:var(--ink-soft); font-weight:600; line-height:1.2;}

  /* ===== Bottom promo card ===== */
  .promocard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px 18px; display:flex; align-items:center; gap:14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(20,40,30,0.06);
  }
  .promocard .promocard-text{flex:1; min-width:0;}
  .promocard .promocard-title{font-family:var(--font-display); font-weight:700; font-size:14.5px; margin:0 0 4px; color:var(--ink);}
  .promocard .promocard-desc{font-size:12px; color:var(--ink-soft); line-height:1.45; margin:0;}
  .promocard .promocard-img{
    width:64px; height:56px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(160deg, var(--green-mid), var(--green-deep));
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }

  /* ===== Bottom nav bar ===== */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    background:#fff; border-top:1px solid var(--line);
    display:flex; padding:8px 6px 12px;
    box-shadow:0 -6px 18px rgba(0,0,0,0.06);
  }
  .bottomnav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; padding:4px 0; color:var(--muted);
  }
  .bottomnav-item .bn-icon{font-size:19px; line-height:1;}
  .bottomnav-item .bn-label{font-size:10.5px; font-weight:600;}
  .bottomnav-item.active{color:var(--green-deep);}

  /* ===== List view (Daftar Provinsi, Menu Utama, entry lists) ===== */
  .listwrap{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    overflow:hidden;
  }
  .listrow{
    display:flex; align-items:center; gap:13px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .listrow:last-child{border-bottom:none;}
  .listrow:hover{background:var(--cream);}
  .listrow .lr-icon{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    background:var(--cream-2);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .listrow .lr-text{flex:1; min-width:0;}
  .listrow .lr-title{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .listrow .lr-sub{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.3;}
  .listrow .lr-chev{color:var(--muted); font-size:16px; flex-shrink:0;}

  .searchbar-standalone{position:relative; margin-bottom:14px; display:flex; gap:10px;}
  .searchbar-standalone input{
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--ink);
    padding:12px 16px 12px 40px; border-radius:14px; font-family:var(--font-body); font-size:14px; outline:none;
  }
  .searchbar-standalone input:focus{border-color:var(--gold);}
  .searchbar-standalone .sbs-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted);}
  .filterbtn{
    width:44px; height:44px; border-radius:14px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-soft); cursor:pointer; flex-shrink:0;
  }

  .filterbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .pill{
    padding:7px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:500;
  }
  .pill.active{border-color:var(--green-deep); color:#fff; background:var(--green-deep);}

  .empty{color:var(--muted); font-size:13px; padding:30px 0; text-align:center;}

  /* ===== Detail hero (province / entry) ===== */
  .detailhero{
    position:relative; height:190px; border-radius:var(--radius-md); overflow:hidden;
    background:linear-gradient(150deg, #7c9c8a, var(--green-mid) 60%, var(--green-dark));
    display:flex; align-items:flex-end; padding:16px;
    margin-bottom:0;
  }
  .detailhero .dh-loc{
    color:#fff; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; font-weight:600;
    position:absolute; top:14px; left:18px;
  }
  .detailhero .dh-icon{font-size:70px; opacity:.9; margin:0 auto;}

  .detailcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    margin-top:-30px; position:relative; z-index:5; padding:18px 18px 6px;
    box-shadow:0 8px 24px rgba(20,40,30,0.1);
  }
  .detailcard-top{display:flex; align-items:flex-start; gap:14px; margin-bottom:14px;}
  .detailcard-badge{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(160deg, var(--cream-2), var(--gold-soft));
    display:flex; align-items:center; justify-content:center; font-size:26px;
    box-shadow:0 4px 10px rgba(20,40,30,0.1);
  }
  .detailcard-name{font-family:var(--font-display); font-size:21px; font-weight:700; margin:0 0 4px; color:var(--ink);}
  .detailcard-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

  .tabbar{display:flex; gap:8px; margin:14px 0 16px; flex-wrap:wrap;}
  .tabbtn{
    padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
    background:var(--cream); color:var(--ink-soft); border:1px solid var(--line);
  }
  .tabbtn.active{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}

  .statrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0;}
  .statcell{
    background:var(--cream); border-radius:var(--radius-sm); padding:12px 8px; text-align:center;
  }
  .statcell .sc-val{font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--ink);}
  .statcell .sc-lbl{font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.3;}

  .fieldrow{
    border-top:1px solid var(--line);
    padding:14px 0;
  }
  .fieldrow:first-child{border-top:none;}
  .fieldrow .flabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:5px;}
  .fieldrow .fval{font-size:14px; line-height:1.65; color:var(--ink);}
  .fieldrow .fval ul{margin:0; padding-left:18px;}

  .related{margin:18px 0 20px;}
  .related .flabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:8px;}
  .tag{
    display:inline-block; background:var(--cream); border:1px solid var(--line);
    color:var(--ink-soft); font-size:12px; padding:6px 12px; border-radius:16px; margin:0 6px 6px 0; cursor:pointer;
  }
  .tag:hover{border-color:var(--gold); color:var(--clay);}

  .iconlabel-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 18px;}
  .iconlabel-card{background:var(--cream); border-radius:var(--radius-sm); overflow:hidden; cursor:pointer;}
  .iconlabel-card .ilc-img{
    height:64px; background:linear-gradient(150deg, var(--green-mid), var(--gold-soft));
    display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff;
  }
  .iconlabel-card .ilc-cap{padding:7px 8px; font-size:10.5px; font-weight:600; color:var(--ink); line-height:1.3;}

  /* ===== Views (screen switching, kept from original architecture) ===== */
  .view{display:none;}
  .view.active{display:block;}
  .crumb{display:none;} /* replaced by header back-button pattern */

  footer{
    text-align:center; padding:20px 18px 10px; color:var(--muted); font-size:11.5px;
  }
  footer .motto{font-family:var(--font-display); font-style:italic; color:var(--clay); font-size:13px; margin-bottom:5px;}
  /* ===== SVG icon sizing/coloring ===== */
  svg{display:block;}
  .logo-badge{color:var(--green-deep);} .logo-badge svg{width:22px; height:22px;}
  .header-icon{color:#fff;} .header-icon svg{width:17px; height:17px;}
  .appheader-back svg{width:19px; height:19px;}
  .searchwrap-icon svg{width:16px; height:16px;}
  .sbs-icon svg{width:15px; height:15px;}
  .infocard-icon{color:var(--green-deep);} .infocard-icon svg{width:26px; height:26px;}
  .icb{color:var(--green-deep);} .icb svg{width:25px; height:25px;}
  .promocard-img{color:#fff;} .promocard-img svg{width:26px; height:26px;}
  .bn-icon svg{width:20px; height:20px; margin:0 auto;}
  .lr-icon{color:var(--green-deep);} .lr-icon svg{width:20px; height:20px;}
  .lr-chev{color:var(--muted); display:flex; align-items:center;} .lr-chev svg{width:16px; height:16px;}
  .detailcard-badge{color:var(--green-deep);} .detailcard-badge svg{width:27px; height:27px;}
  .dh-icon{color:rgba(255,255,255,0.92);} .dh-icon svg{width:60px; height:60px;}
  .ilc-img{color:#fff;} .ilc-img svg{width:22px; height:22px;}

  /* ===== Settings page ===== */
  .toggle{width:44px; height:26px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0; transition:background .2s;}
  .toggle.on{background:var(--green-deep);}
  .toggle .knob{width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .knob{left:21px;}
  .settings-version{text-align:center; font-size:11.5px; color:var(--muted); padding:16px 0 4px;}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--cream); padding:10px 20px; border-radius:24px;
    font-size:12.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:200; box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== Dark mode ===== */
  body.dark{
    --cream:#161d18; --cream-2:#202b23; --card:#1c2620; --ink:#ece7d8; --ink-soft:#b9c2ba; --muted:#7c8880; --line:#2c382f;
  }
  body.dark .searchwrap input{background:#1c2620; color:var(--ink);}
  body.dark .searchwrap input::placeholder{color:var(--muted);}
  body.dark .bottomnav{background:var(--card); border-color:var(--line);}
  body.dark .toast{background:#ece7d8; color:#161d18;}

  /* ===== Kalender Interaktif ===== */
  .calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .calnav .calnav-btn{width:38px; height:38px; border-radius:12px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  .calnav .calnav-btn svg{width:17px; height:17px;}
  .calnav .calnav-title{font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--ink); text-align:center;}
  .caltabs{display:flex; gap:8px; margin-bottom:14px;}
  .caltab{flex:1; text-align:center; padding:9px 6px; border-radius:12px; font-size:12.5px; font-weight:600; background:var(--cream); color:var(--ink-soft); border:1px solid var(--line); cursor:pointer;}
  .caltab.active{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .calgrid .calhead{text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding:4px 0;}
  .calcell{aspect-ratio:1; border-radius:10px; background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; padding:2px;}
  .calcell.empty{background:transparent; border:none; cursor:default;}
  .calcell.today{border-color:var(--gold); border-width:2px;}
  .calcell.selected{background:var(--green-deep); border-color:var(--green-deep);}
  .calcell.selected .cal-num, .calcell.selected .cal-sub{color:#fff;}
  .calcell .cal-num{font-size:13px; font-weight:700; color:var(--ink); line-height:1.1;}
  .calcell .cal-sub{font-size:8.5px; color:var(--muted); line-height:1.1; margin-top:1px;}
  .calcell.hasevent::after{content:''; width:4px; height:4px; border-radius:50%; background:var(--clay); margin-top:2px;}
  .calinfo{margin-top:16px;}
  .calinfo .calinfo-date{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); margin-bottom:8px;}
  .calinfo .calinfo-item{background:var(--cream); border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .calinfo .calinfo-empty{font-size:12.5px; color:var(--muted); padding:8px 0;}
  .caldisclaimer{background:var(--cream-2); border-radius:12px; padding:10px 14px; font-size:11.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:14px;}
</style>
</head>
<body>

<!-- ===================== HEADER (dynamic: home vs sub-page) ===================== -->
<div class="appheader" id="appHeader">
  <div class="appheader-row" id="appHeaderRow">
    <div class="brand" onclick="goHome()" id="brandBlock">
      <div class="logo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6M12 4v3"/></svg></div>
      <div class="brand-text">
        <div class="brand-title">KHATULISTARA</div>
        <div class="brand-sub">Ensiklopedia Nusantara</div>
      </div>
    </div>
    <div class="header-icon" title="Notifikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>

    {id:'prasasti_nalanda', nama:'Prasasti Nalanda', lokasi:'Sumatra Utara', periode:'860 M', aksara:'Pallawa, bahasa Sanskerta',
     ringkasan:'Prasasti Raja Devapala dari Kerajaan Pala India yang mencatat tentang pemberian tanah untuk membangun biara di Sumatra Utara, bukti koneksi spiritual dan budaya antara Sriwijaya dan Kerajaan Pala di India.',
     fakta:['Menjadi bukti keterhubungan Sriwijaya dengan kerajaan Buddha besar di India','Menunjukkan jaringan perdagangan dan pertukaran budaya yang luas di Asia pada abad ke-9']},
    {id:'prasasti_siwagrha', nama:'Prasasti Siwagrha', lokasi:'Sulawesi Selatan', periode:'Abad ke-13 M', aksara:'Jawa Kuno',
     ringkasan:'Prasasti dari Kerajaan Luwu yang mencatat tentang upacara keagamaan dan struktur pemerintahan kerajaan, bukti peradaban Hindu-Buddha yang pernah berkembang di Sulawesi Selatan sebelum datangnya Islam.',
     fakta:['Merupakan salah satu prasasti tertua ditemukan di Sulawesi','Menjadi bukti bahwa kerajaan di Sulawesi juga menganut Hindu-Buddha sebelum konversi ke Islam']},
    {id:'prasasti_singasari', nama:'Prasasti Singasari', lokasi:'Jawa Timur', periode:'1256 M', aksara:'Jawa Kuno',
     ringkasan:'Prasasti pembinai Raja Ken Arok, tokoh pendiri Kerajaan Singasari, mencatat tentang kelahiran dan perjalanan hidup tokoh legendaris yang menjadi cikal bakal Kerajaan Majapahit.',
     fakta:['Menjadi rujukan utama cerita-cerita rakyat tentang Ken Arok di Jawa Timur','Dipercaya menjadi inspirasi untuk karya sastra seperti Pax Romana Ken Arok']},
    {id:'prasasti_padang_roco', nama:'Prasasti Padang Roco', lokasi:'Sumatra Barat', periode:'Abad ke-13 M', aksara:'Pallawa, bahasa Melayu Kuno',
     ringkasan:'Prasasti dari Kerajaan Melayu yang mencatat tentang pendewaan dan upacara persembahan, menjadi bukti koneksi Minangkabau dengan peradaban Melayu yang lebih luas di kawasan Kepulauan Melayu.',
     fakta:['Ditemukan di daerah pegunungan Sumatra Barat, jauh dari pusat perdagangan utama','Menjadi bukti bahwa peradaban Hindu-Buddha berkembang juga di daerah pedalaman']},
    {id:'prasasti_tugu', nama:'Prasasti Tugu', lokasi:'Jakarta Utara (Tarumanegara)', periode:'Abad ke-5 M', aksara:'Pallawa, bahasa Sanskerta',
     ringkasan:'Prasasti terpanjang dari Kerajaan Tarumanegara peninggalan Raja Purnawarman, mencatat penggalian dua saluran air (Sungai Gomati dan Candrabhaga) untuk irigasi dan pencegahan banjir, bukti awal kemajuan teknik pengairan di Nusantara.',
     fakta:['Menjadi salah satu bukti tertulis tertua tentang proyek irigasi di Nusantara','Selalu dipasangkan dengan Prasasti Ciaruteun sebagai materi wajib sejarah Kerajaan Tarumanegara di sekolah']},
    {id:'prasasti_kotakapur', nama:'Prasasti Kota Kapur', lokasi:'Pulau Bangka', periode:'686 M', aksara:'Pallawa, bahasa Melayu Kuno',
     ringkasan:'Prasasti peninggalan Kerajaan Sriwijaya yang berisi kutukan bagi siapa pun yang tidak tunduk pada perintah kerajaan, menjadi bukti kekuasaan Sriwijaya yang meluas hingga ke Pulau Bangka dan usaha penaklukan Pulau Jawa.',
     fakta:['Berisi kutukan keras (sumpah serapah) terhadap pihak yang menentang kekuasaan Sriwijaya','Menjadi bukti penting ekspansi kekuasaan Sriwijaya ke wilayah Jawa pada akhir abad ke-7']},
    {id:'prasasti_telagabatu', nama:'Prasasti Telaga Batu', lokasi:'Palembang, Sumatra Selatan', periode:'Akhir abad ke-7 M', aksara:'Pallawa, bahasa Melayu Kuno',
     ringkasan:'Prasasti Sriwijaya yang berisi kutukan terhadap para pejabat kerajaan yang berkhianat, memberikan gambaran penting tentang struktur birokrasi dan jabatan-jabatan resmi dalam pemerintahan Kerajaan Sriwijaya.',
     fakta:['Mencantumkan berbagai jabatan resmi kerajaan, menjadi sumber penting struktur birokrasi Sriwijaya','Ditemukan lengkap dengan lubang di bagian atas prasasti, diduga digunakan dalam upacara sumpah setia pejabat']},
    {id:'prasasti_kebonkopi', nama:'Prasasti Kebon Kopi', lokasi:'Bogor, Jawa Barat (Tarumanegara)', periode:'Abad ke-5 M', aksara:'Pallawa, bahasa Sanskerta',
     ringkasan:'Prasasti Tarumanegara yang unik karena memuat pahatan sepasang telapak kaki gajah, dipercaya sebagai gambaran telapak kaki gajah tunggangan Raja Purnawarman yang disamakan dengan gajah tunggangan Dewa Wisnu (Airawata).',
     fakta:['Menjadi satu-satunya prasasti Tarumanegara yang memuat pahatan telapak kaki gajah, bukan telapak kaki manusia','Selalu diajarkan berpasangan dengan Prasasti Ciaruteun sebagai bukti utama keberadaan Kerajaan Tarumanegara di sekolah']},

  agama:[
    {id:'hindubuddha', nama:'Masuknya Hindu-Buddha', periode:'Sekitar abad ke-4 M',
     ringkasan:'Dibawa lewat jalur perdagangan India-Nusantara, membentuk kerajaan-kerajaan awal seperti Kutai dan Tarumanegara serta meninggalkan warisan arsitektur besar seperti Candi Borobudur dan Prambanan yang masih berdiri hingga kini.',
     fakta:['Berkembang lewat kontak dagang dan pernikahan politik dengan pedagang serta pendeta dari India','Meninggalkan warisan arsitektur besar seperti Candi Borobudur dan Candi Prambanan']},
    {id:'islam_sejarah', nama:'Masuknya Islam', periode:'Sekitar abad ke-13 M',
     ringkasan:'Disebarkan pedagang Arab, Persia, dan Gujarat, diperkuat jaringan Wali Songo di Jawa yang menyebarkan Islam secara damai lewat pendekatan budaya; Samudra Pasai menjadi kesultanan Islam pertama di Nusantara.',
     fakta:['Kesultanan Islam pertama, Samudra Pasai, berdiri di ujung utara Sumatra pada akhir abad ke-13','Wali Songo memainkan peran penting menyebarkan Islam secara damai lewat pendekatan budaya di Jawa']},
    {id:'kristenkatolik', nama:'Masuknya Kristen & Katolik', periode:'Abad ke-16 M',
     ringkasan:'Dibawa misionaris Portugis dan Spanyol terutama ke wilayah timur Nusantara seperti Maluku dan Flores, berkembang lebih pesat di kawasan timur dibanding wilayah barat yang mayoritas telah menganut Islam.',
     fakta:['Misionaris Fransiskus Xaverius tercatat aktif menyebarkan agama Katolik di Maluku pada abad ke-16','Kekristenan berkembang lebih pesat di wilayah timur Nusantara dibanding wilayah barat yang mayoritas Islam']},
    {id:'kepercayaanlokal', nama:'Kepercayaan Lokal & Animisme', periode:'Masa Prasejarah – Sekarang',
     ringkasan:'Kepercayaan spiritual lokal yang masih hidup di berbagai masyarakat Indonesia sebelum datangnya agama besar, meliputi kepercayaan pada roh leluhur, roh alam, dan kekuatan gaib yang masih tertanam dalam tradisi lokal hingga kini.',
     fakta:['Kepercayaan animisme pada penghuni gunung, laut, dan hutan masih berkembang di masyarakat tradisional Indonesia','Banyak upacara adat dan tradisi lokal yang mempertahankan unsur-unsur kepercayaan pra-agama besar']},
    {id:'bahaibaha', nama:'Aliran Baha\'i', periode:'Masuk ke Indonesia awal abad ke-20',
     ringkasan:'Aliran keagamaan yang berasal dari Persia yang mengajarkan persatuan agama dan toleransi antar umat, berkembang di Indonesia dengan pengikut yang tersebar di berbagai kota besar.',
     fakta:['Aliran ini menekankan persatuan semua agama besar (Kristen, Islam, Judais, Hindu, Buddha)','Pengikut Baha\'i di Indonesia tergabung dalam Badan Koordinasi Baha\'i Indonesia']},
    {id:'sikisme', nama:'Kepercayaan Sikh', periode:'Masuk ke Indonesia era modern',
     ringkasan:'Kepercayaan yang berasal dari Punjab, India, dengan prinsip monoteisme dan kesetaraan sosial, berkembang di Indonesia terutama di Jakarta melalui imigran dari Punjab dan India.',
     fakta:['Gurdwara (tempat ibadah Sikh) terbesar di Asia Tenggara terletak di Jakarta','Komunitas Sikh di Indonesia mempertahankan tradisi-tradisi keagamaan mereka sambil berintegrasi dengan masyarakat lokal']},
    {id:'konghucu', nama:'Agama Konghucu di Indonesia', periode:'Masuk bersama migrasi Tionghoa sejak berabad lalu; diakui resmi 2000',
     ringkasan:'Salah satu dari enam agama resmi yang diakui negara Indonesia, dianut terutama komunitas Tionghoa-Indonesia, berlandaskan ajaran moral dan etika Konfusius, sempat tidak diakui secara administratif pada era Orde Baru sebelum dipulihkan haknya di era Reformasi.',
     fakta:['Sempat tidak diakui sebagai agama resmi selama era Orde Baru dan baru dipulihkan kembali haknya pada 2000 di era Presiden Abdurrahman Wahid','Klenteng menjadi tempat ibadah utama umat Konghucu, banyak ditemukan di kawasan pecinan seperti Semarang dan Jakarta']},
    {id:'buddha_modern', nama:'Agama Buddha di Indonesia', periode:'Berkembang sejak abad ke-4 M hingga kini',
     ringkasan:'Salah satu dari enam agama resmi Indonesia, warisan sejarahnya tercermin dari kejayaan Kerajaan Sriwijaya dan monumen besar Candi Borobudur, kini dianut komunitas tersebar terutama di kalangan Tionghoa-Indonesia dan sebagian masyarakat Jawa.',
     fakta:['Candi Borobudur menjadi monumen Buddha terbesar di dunia dan tetap menjadi pusat ibadah umat Buddha saat perayaan Waisak','Perayaan Hari Raya Waisak di Borobudur menjadi acara keagamaan sekaligus budaya berskala nasional setiap tahun']},

  prasejarah:[
    {id:'zamanbatu', nama:'Zaman Batu', ringkasan:'Periode awal peradaban manusia di Nusantara yang dicirikan penggunaan alat-alat dari batu, mencakup era Paleolitikum (batu tua), Mesolitikum (batu tengah), dan Neolitikum (batu muda) yang masing-masing menandai kemajuan teknologi dan pola hidup manusia purba.',
     fakta:['Manusia purba pada masa ini hidup berpindah-pindah (nomaden) sebelum mulai menetap di era Neolitikum','Alat serpih dan kapak genggam dari era Paleolitikum ditemukan di berbagai situs seperti Pacitan dan Ngandong, Jawa']},
    {id:'megalitikum', nama:'Megalitikum', ringkasan:'Zaman batu besar, periode akhir prasejarah Nusantara yang ditandai pembangunan monumen batu besar untuk pemujaan roh leluhur, menjadi cikal bakal berbagai tradisi kepercayaan lokal yang masih bertahan hingga kini.',
     fakta:['Menghasilkan peninggalan seperti menhir, dolmen, dan sarkofagus di berbagai wilayah Nusantara','Konsep punden berundak pada masa ini diyakini memengaruhi arsitektur candi di kemudian hari']},
    {id:'manusiapurba', nama:'Manusia Purba Indonesia', ringkasan:'Indonesia menjadi salah satu situs penemuan fosil manusia purba paling penting di dunia, dengan temuan seperti Pithecanthropus erectus (Manusia Jawa) yang mengubah pemahaman ilmiah tentang evolusi manusia.',
     fakta:['Fosil Pithecanthropus erectus ditemukan Eugène Dubois di Trinil, Jawa Timur pada 1891','Situs Sangiran di Jawa Tengah ditetapkan UNESCO sebagai Situs Warisan Dunia karena kekayaan fosil manusia purbanya']},
    {id:'meganthropus', nama:'Meganthropus Paleojavanicus', ringkasan:'Jenis manusia purba tertua yang ditemukan di Indonesia, fosilnya ditemukan oleh G.H.R. von Koenigswald di Sangiran, Jawa Tengah, dicirikan tubuh besar dan rahang kuat, diperkirakan hidup sekitar 1-2 juta tahun lalu pada masa Pleistosen Bawah.',
     fakta:['Namanya berarti "manusia besar dari Jawa" (mega=besar, anthropus=manusia, paleo=purba, javanicus=Jawa)','Dianggap sebagai salah satu manusia purba paling primitif yang pernah ditemukan di Indonesia']},
    {id:'pithecanthropus_detail', nama:'Pithecanthropus (Manusia Kera Berjalan Tegak)', ringkasan:'Kelompok fosil manusia purba dengan ciri peralihan antara kera dan manusia, terdiri dari beberapa jenis seperti Pithecanthropus erectus, Pithecanthropus mojokertensis, dan Pithecanthropus soloensis, banyak ditemukan di sepanjang aliran Bengawan Solo.',
     fakta:['Pithecanthropus mojokertensis ditemukan di Mojokerto, Jawa Timur, diperkirakan sebagai fosil anak-anak','Kini secara ilmiah digolongkan sebagai spesies Homo erectus dalam klasifikasi evolusi manusia modern']},
    {id:'homosapiens_purba', nama:'Homo Soloensis & Homo Wajakensis', ringkasan:'Jenis manusia purba yang lebih maju dibanding Pithecanthropus, dengan volume otak lebih besar dan ciri lebih mendekati manusia modern, ditemukan di Ngandong (Solo) dan Wajak (Tulungagung), Jawa Timur.',
     fakta:['Homo Wajakensis dianggap sebagai fosil manusia purba paling maju yang ditemukan di Indonesia','Ditemukan oleh B.D. van Rietschoten pada 1889 di Wajak, sebelum penemuan-penemuan Eugène Dubois di Trinil']},
    {id:'situssangiran', nama:'Situs Sangiran', ringkasan:'Kompleks situs purbakala di Jawa Tengah yang menjadi salah satu lokasi penemuan fosil manusia purba terlengkap dan terpenting di dunia, ditetapkan UNESCO sebagai Situs Warisan Dunia pada 1996.',
     fakta:['Ditemukan lebih dari 100 fosil manusia purba di kawasan ini, sekitar 50% dari seluruh temuan fosil manusia purba dunia','Kini dikelola sebagai Museum Purbakala Sangiran yang menjadi sarana edukasi sejarah manusia purba bagi pelajar']},
    {id:'zamanlogam', nama:'Zaman Logam (Perundagian)', ringkasan:'Periode akhir prasejarah ketika manusia mulai mengenal teknologi pengolahan logam seperti perunggu dan besi untuk membuat peralatan dan senjata, menandai munculnya keahlian khusus (undagi) dalam masyarakat.',
     fakta:['Nekara perunggu peninggalan zaman ini banyak ditemukan di berbagai daerah seperti Bali, Alor, dan Sumatra','Menjadi era transisi penting menuju masyarakat yang lebih terorganisir dengan pembagian kerja dan keahlian khusus']},
  ],
  kolonialisme:[
    {id:'kedatanganeropa', nama:'Kedatangan Bangsa Eropa', ringkasan:'Diawali kedatangan Portugis pada 1512 yang mencari sumber rempah langsung ke Maluku, disusul Spanyol, lalu Belanda yang membentuk VOC (Vereenigde Oost-Indische Compagnie) pada 1602 untuk memonopoli perdagangan rempah Nusantara.',
     fakta:['VOC sempat menjadi salah satu perusahaan dagang terbesar dan terkaya dalam sejarah dunia','VOC dibubarkan pada 1799 akibat korupsi dan utang besar, wilayahnya diambil alih pemerintah Hindia Belanda']},
    {id:'vocopium', nama:'Monopoli VOC & Sistem Opium', ringkasan:'VOC menerapkan monopoli perdagangan rempah yang ketat, memaksa petani menanam komoditas tertentu dan melarang penjualan ke pedagang lain, sambil juga mengontrol penjualan opium sebagai sumber penghasilan besar kolonial.',
     fakta:['Monopoli VOC menyebabkan petani tidak bisa menjual hasil pertanian ke siapa pun selain VOC dengan harga yang ditetapkan VOC sendiri','Pajak opium menjadi salah satu sumber keuangan terbesar Hindia Belanda']},
    {id:'tanampaksa', nama:'Sistem Tanam Paksa (Cultuurstelsel)', ringkasan:'Kebijakan kolonial Belanda yang dicetuskan Gubernur Jenderal Johannes van den Bosch sejak 1830, mewajibkan petani menyisihkan sebagian lahan (idealnya seperlima) untuk menanam komoditas ekspor seperti tebu, nila, kopi, dan tembakau demi mengisi kas Belanda yang kosong akibat Perang Diponegoro.',
     fakta:['Dalam praktiknya sering melebihi aturan resmi, memaksa petani menanam lebih dari seperlima lahan bahkan hingga sepanjang tahun','Kritik keras terhadap sistem ini disuarakan lewat novel Max Havelaar (1860) karya Multatuli (nama pena Eduard Douwes Dekker), yang ikut membuka mata publik Belanda dan mendorong penghapusan sistem ini secara bertahap']},
    {id:'politiketis', nama:'Politik Etis (Politik Balas Budi)', ringkasan:'Kebijakan kolonial Belanda awal abad ke-20 sebagai respons atas kritik terhadap eksploitasi Tanam Paksa, menekankan tiga program utama: irigasi (pengairan), edukasi (pendidikan), dan emigrasi (transmigrasi), meski dalam praktiknya lebih menguntungkan kepentingan Belanda.',
     fakta:['Dicetuskan oleh Conrad Theodoor van Deventer lewat tulisannya "Een Eereschuld" (Utang Kehormatan) pada 1899','Program edukasi dalam Politik Etis secara tak terduga melahirkan kaum terpelajar pribumi yang kelak memimpin pergerakan nasional Indonesia']},
    {id:'hindiabelanda', nama:'Periode Hindia Belanda (1800–1942)', ringkasan:'Setelah pembubaran VOC, Pemerintah Kerajaan Belanda secara langsung menguasai Nusantara sebagai Hindia Belanda, ditandai dengan ekspansi militer, pembentukan birokrasi modern, dan ekstraksi sumber daya alam secara masif untuk kepentingan Belanda.',
     fakta:['Pemerintah Hindia Belanda mendirikan berbagai infrastruktur seperti jalan raya, rel kereta api, dan jaringan telegrafi','Ekspansi ini memerlukan kampanye militer besar seperti Perang Jawa, Perang Aceh, dan penaklukan wilayah-wilayah lainnya']},
    {id:'japonisme', nama:'Pendudukan Jepang (1942–1945)', ringkasan:'Jepang menggantikan Belanda sebagai kekuatan penjajah setelah Perang Pasifik Dunia II dimulai, dengan sistem pemerintahan militer yang lebih represif, namun paradoksnya membuka peluang bagi gerakan kemerdekaan Indonesia untuk persiapan final menjelang proklamasi 1945.',
     fakta:['Pendudukan Jepang berlangsung selama 3,5 tahun dan menyebabkan penderitaan besar bagi rakyat Indonesia','Jepang membentuk organisasi semi-militer seperti PETA (Pembela Tanah Air) dan mengizinkan tokoh-tokoh nasionalis seperti Soekarno menjadi kepala pemerintahan bayang-bayang']},
  ],
  perlawanan:[
    {id:'perangdiponegoro_sej', nama:'Perang Diponegoro (Perang Jawa)', periode:'1825–1830', ringkasan:'Perlawanan besar Pangeran Diponegoro terhadap pemerintah kolonial Belanda di Jawa, dipicu ketidakpuasan atas campur tangan Belanda dalam urusan Keraton Yogyakarta dan pemasangan patok jalan yang melintasi makam leluhurnya.',
     fakta:['Menjadi salah satu perang termahal bagi Belanda dalam sejarah kolonial Hindia Timur','Diponegoro ditangkap lewat siasat perundingan di Magelang, kemudian diasingkan hingga wafat di Makassar']},
    {id:'perangaceh_sej', nama:'Perang Aceh', periode:'1873–1904 (perlawanan sporadis berlanjut lebih lama)', ringkasan:'Perang berkepanjangan antara Kesultanan Aceh dan Belanda, salah satu perang kolonial terlama dan terberat yang dihadapi Belanda di Nusantara karena perlawanan gigih rakyat Aceh, termasuk lewat perang gerilya.',
     fakta:['Tokoh perlawanan penting termasuk Teuku Umar dan Cut Nyak Dhien','Belanda baru mengklaim menguasai Aceh sepenuhnya pada awal abad ke-20, meski perlawanan terus berlanjut']},
    {id:'perangpadri_sej', nama:'Perang Padri', periode:'1821–1837', ringkasan:'Gerakan keagamaan di Sumatera Barat yang bermula dari upaya pemurnian agama Islam kemudian berkembang menjadi perlawanan terhadap Belanda, dipimpin tokoh-tokoh religius seperti Tuanku Imam Bonjol yang menggabungkan reformasi Islam dengan nasionalisme.',
     fakta:['Awalnya merupakan gerakan pemurnian ajaran Islam melawan adat lokal, kemudian menjadi perlawanan anti-Belanda','Perang ini menewaskan ribuan jiwa dan menjadi salah satu perlawanan paling panjang terhadap Belanda']},
    {id:'perangsaminun', nama:'Perang Saminun', periode:'1890–1920', ringkasan:'Perlawanan pasif kerajaan Samin (Saminisme) di Jawa Tengah yang menolak membayar pajak dan melayani Belanda, mewakili bentuk perlawanan spiritual dan budaya berbeda dari perang bersenjata tradisional.',
     fakta:['Anggota Saminun menolak membayar pajak, tidak melakukan upacara Belanda, dan menolak melayani militer','Perlawanan ini menunjukkan bentuk resistensi cultural yang unik di dalam sejarah perlawanan Indonesia']},
    {id:'perangbanten', nama:'Pemberontakan Banten (Perang Banten)', periode:'1888–1895', ringkasan:'Pemberontakan rakyat Banten yang dipimpin oleh pemimpin-pemimpin lokal melawan kekuasaan Belanda, menggabungkan semangat agama Islam dengan perlawanan ekonomi terhadap sistem kolonial yang merampas hasil pertanian.',
     fakta:['Dipimpin oleh tokoh-tokoh lokal seperti Raden Qosim dan Haji Muhammad Djatikusuma','Pemberontakan ini menunjukkan ketidakpuasan rakyat terhadap sistem ekonomi kolonial yang ekstraktif']},
    {id:'perangbugis', nama:'Perang Makassar (Perang Bugis)', periode:'1667–1669', ringkasan:'Perlawanan Sultan Hasanuddin dari Makassar melawan kekuatan gabungan Belanda dan Bugis rival, mencerminkan kompleksitas politik regional di mana perlawanan lokal diperumit oleh rivalitas internal kerajaan-kerajaan lokal.',
     fakta:['Sultan Hasanuddin dianggap sebagai tokoh perlawanan paling tangguh di kawasan timur','Kekalahan Makassar membuka pintu bagi Belanda untuk memperluas kontrol ke seluruh kawasan Sulawesi dan timur']},
    {id:'pemberontakan1926', nama:'Pemberontakan PKI 1926–1927', periode:'1926–1927', ringkasan:'Pemberontakan komunis yang diprakarsai oleh Partai Komunis Indonesia di Jawa Barat dan Sumatera Barat, merupakan salah satu perlawanan besar-besaran terhadap Belanda yang direspons Belanda dengan represif dan eksil ribuan aktivis ke Digul.',
     fakta:['Belanda merespons dengan menangkap lebih dari 1.000 aktivis komunis dan mengeksilnya ke Digul, Papua','Peristiwa ini menjadi momentum pengalihan fokus perjuangan nasional dari sosialisme-komunisme ke nasionalisme']},
    {id:'perlawananpattimura', nama:'Perlawanan Pattimura', periode:'1817', ringkasan:'Perlawanan rakyat Maluku terhadap kembalinya kekuasaan Belanda pasca era Inggris, dipimpin Thomas Matulessy (Pattimura) yang berhasil merebut Benteng Duurstede di Saparua sebelum akhirnya ditangkap dan dihukum mati di Ambon.',
     fakta:['Berhasil merebut Benteng Duurstede di Saparua sebagai puncak perlawanan sebelum akhirnya dipadamkan Belanda','Pattimura dieksekusi di Ambon pada usia muda, kini namanya diabadikan sebagai bandara dan universitas di Maluku']},
    {id:'perlawananbali', nama:'Perlawanan Bali (Perang Puputan)', periode:'1846–1908', ringkasan:'Rangkaian perlawanan habis-habisan (puputan) kerajaan-kerajaan Bali terhadap agresi militer Belanda, termasuk Puputan Badung (1906) dan Puputan Klungkung (1908), di mana raja beserta rakyatnya memilih gugur bertempur daripada menyerah.',
     fakta:['"Puputan" berarti perang habis-habisan sampai titik darah penghabisan, mencerminkan prinsip kehormatan masyarakat Bali','Ribuan rakyat Bali termasuk raja, keluarga kerajaan, dan pengikutnya gugur dalam perlawanan Puputan Badung dan Klungkung']},
    {id:'perlawananbanjar', nama:'Perlawanan Banjar (Perang Banjar)', periode:'1859–1905', ringkasan:'Perang panjang Kesultanan Banjar melawan Belanda yang berusaha menghapus kesultanan dan menguasai sumber daya alam Kalimantan Selatan, dipimpin Pangeran Antasari yang menjadi simbol perlawanan rakyat Banjar hingga ditetapkan sebagai Pahlawan Nasional.',
     fakta:['Dipimpin Pangeran Antasari yang menolak tunduk meski Kesultanan Banjar telah dihapuskan Belanda secara sepihak','Perang ini menjadi salah satu perlawanan terpanjang terhadap kolonial Belanda, berlangsung hampir setengah abad']},
  ],
  pergerakan:[
    {id:'budiutomo', nama:'Budi Utomo', periode:'Didirikan 20 Mei 1908', ringkasan:'Organisasi pergerakan modern pertama di Hindia Belanda, didirikan para pelajar STOVIA di Batavia, menandai awal kebangkitan nasional Indonesia dengan pendekatan perjuangan lewat pendidikan dan organisasi modern, bukan lagi perlawanan bersenjata semata.',
     fakta:['Tanggal berdirinya, 20 Mei, diperingati sebagai Hari Kebangkitan Nasional','Diprakarsai oleh dr. Sutomo bersama pelajar-pelajar sekolah kedokteran pribumi']},
    {id:'sumpahpemuda_sej', nama:'Sumpah Pemuda', periode:'28 Oktober 1928', ringkasan:'Ikrar para pemuda dari berbagai daerah dan organisasi dalam Kongres Pemuda II di Batavia, mendeklarasikan satu tanah air, satu bangsa, dan satu bahasa Indonesia, menjadi tonggak penting persatuan nasional menjelang kemerdekaan.',
     fakta:['Lagu "Indonesia Raya" ciptaan W.R. Supratman pertama kali diperdengarkan pada kongres ini','Tanggal 28 Oktober diperingati setiap tahun sebagai Hari Sumpah Pemuda']},
    {id:'indischpartij', nama:'Indische Partij (Partai Hindia)', periode:'Didirikan 1912', ringkasan:'Partai pertama yang secara eksplisit menuntut kemerdekaan Indonesia, diketuai oleh E.F.E. Douwes Dekker, menandai perubahan perjuangan dari aspriasi moderatisme menjadi tuntutan kemerdekan yang jelas.',
     fakta:['Partai ini dilarang oleh Belanda pada tahun yang sama karena dianggap berbahaya bagi kestabilan kolonial','Tokoh-tokohnya diasingkan ke Timor Timur, menunjukkan ketatnya represif Belanda terhadap gerakan kemerdekaan']},
    {id:'muhammadiyah', nama:'Muhammadiyah', periode:'Didirikan 28 November 1912', ringkasan:'Organisasi Islam modernis yang didirikan Ahmad Dahlan di Yogyakarta, fokus pada pembaruan ajaran Islam dan pendidikan, berkembang menjadi organisasi sosial keagamaan terbesar kedua di Indonesia yang tetap eksis hingga kini.',
     fakta:['Memberikan pendidikan modern kepada rakyat melalui berbagai sekolah yang didirikan','Kini Muhammadiyah menjalankan ratusan sekolah, universitas, dan institusi sosial di seluruh Indonesia']},
    {id:'nadhlatul', nama:'Nahdlatul Ulama', periode:'Didirikan 31 Januari 1926', ringkasan:'Organisasi Islam tradisionalis yang didirikan oleh K.H. Hasyim Asy\'ari di Surabaya, fokus pada pelestarian tradisi Islam dan pendidikan pesantren, menjadi organisasi Islam terbesar di Indonesia dengan jutaan anggota.',
     fakta:['Mempertahankan tradisi Islamic pesantren dan adat lokal sambil melakukan modernisasi dalam pendidikan','Menjadi organisasi Islam terbesar di Indonesia dengan jaringan pesantren di seluruh negeri']},
    {id:'sarekatislam', nama:'Sarekat Islam', periode:'Didirikan 1912 (awalnya Sarekat Dagang Islam, 1911)', ringkasan:'Organisasi pergerakan nasional berbasis massa terbesar pada masanya, awalnya didirikan sebagai serikat dagang untuk melindungi pedagang pribumi dari persaingan dagang Tionghoa, berkembang menjadi gerakan nasionalis dan keagamaan berskala luas di bawah kepemimpinan H.O.S. Tjokroaminoto.',
     fakta:['Awalnya bernama Sarekat Dagang Islam, didirikan Haji Samanhudi di Surakarta pada 1911 untuk melindungi pedagang batik pribumi','Di bawah H.O.S. Tjokroaminoto berkembang menjadi organisasi massa nasionalis terbesar pada masanya dengan jutaan anggota']},
    {id:'perhimpunanindonesia', nama:'Perhimpunan Indonesia', periode:'Didirikan 1908 (awalnya Indische Vereeniging), radikal sejak 1920-an', ringkasan:'Organisasi pelajar Indonesia di Belanda yang menjadi corong penting perjuangan kemerdekaan dari luar negeri, melahirkan tokoh-tokoh penting seperti Mohammad Hatta dan Sutan Sjahrir yang kelak menjadi pemimpin nasional Indonesia.',
     fakta:['Awalnya bernama Indische Vereeniging sebelum berganti nama menjadi Perhimpunan Indonesia dan mengusung tuntutan kemerdekaan penuh','Menerbitkan majalah "Indonesia Merdeka" yang menyebarkan gagasan nasionalisme Indonesia ke kalangan internasional']},
    {id:'pni_sej', nama:'Partai Nasional Indonesia (PNI)', periode:'Didirikan 4 Juli 1927', ringkasan:'Partai politik nasionalis nonkooperatif yang didirikan Soekarno bersama tokoh-tokoh pergerakan lain di Bandung, secara tegas menuntut kemerdekaan penuh Indonesia dan menolak segala bentuk kerja sama dengan pemerintah kolonial Belanda.',
     fakta:['Didirikan Soekarno bersama Cipto Mangunkusumo dan tokoh pergerakan lainnya di Bandung','Sikap nonkooperatifnya yang tegas menyebabkan Soekarno beberapa kali ditangkap dan diasingkan Belanda']},
    {id:'tamansiswa', nama:'Taman Siswa', periode:'Didirikan 3 Juli 1922', ringkasan:'Lembaga pendidikan nasional yang didirikan Ki Hajar Dewantara di Yogyakarta, menekankan pendidikan berbasis kebudayaan dan nasionalisme sebagai bentuk perlawanan terhadap sistem pendidikan kolonial yang diskriminatif.',
     fakta:['Ki Hajar Dewantara mencetuskan semboyan pendidikan "Ing Ngarso Sung Tulodo, Ing Madyo Mangun Karso, Tut Wuri Handayani" yang masih dipakai dunia pendidikan Indonesia hingga kini','Menjadi salah satu pelopor pendidikan nasional yang terbuka bagi pribumi tanpa membedakan status sosial']},
  ],
  kemerdekaan:[
    {id:'proklamasi_sej', nama:'Proklamasi Kemerdekaan Indonesia', periode:'17 Agustus 1945', ringkasan:'Pembacaan naskah proklamasi oleh Soekarno didampingi Mohammad Hatta di kediaman Soekarno, Jalan Pegangsaan Timur 56 Jakarta, menandai lahirnya Republik Indonesia setelah melalui proses perumusan yang melibatkan golongan tua dan muda, termasuk peristiwa Rengasdengklok.',
     fakta:['Naskah proklamasi dirumuskan di rumah Laksamana Maeda dan diketik oleh Sayuti Melik','Bendera Merah Putih yang dikibarkan saat proklamasi dijahit oleh Fatmawati, istri Soekarno']},
    {id:'rengasdengklok', nama:'Peristiwa Rengasdengklok', periode:'16 Agustus 1945', ringkasan:'Aksi golongan muda (Soemarsono, Chaerul Saleh, Wikana) yang menculik Soekarno dan Hatta ke Rengasdengklok agar segera memproklamasikan kemerdekaan tanpa menunggu kejelasan situasi, memaksa proses perumusan proklamasi dipercepat.',
     fakta:['Merupakan bentuk ketidaksabaran golongan muda yang menginginkan kemerdekaan segera tanpa menunggu kesempatan Jepang menyerah resmi','Aksi ini mempercepat proklamasi dari rencana semula']},
    {id:'konferensiasiaafrika', nama:'Konferensi Asia-Afrika', periode:'18–24 April 1955', lokasi:'Bandung, Jawa Barat', ringkasan:'Konferensi internasional yang menghadirkan 29 negara dari Asia dan Afrika, menjadi momen penting diplomasi Indonesia memimpin Gerakan Non-Blok di tengah perang dingin Barat-Timur.',
     fakta:['Dihadiri tokoh-tokoh seperti Soekarno (Indonesia), Jawaharlal Nehru (India), Gamal Abdel Nasser (Mesir), dan Chou En-lai (Tiongkok)','Menghasilkan Dasa Sila Bandung yang menjadi prinsip dasar hubungan antar negara berkembang']},
    {id:'deklarasibanding', nama:'Deklarasi Bandung', periode:'1955', ringkasan:'Hasil kesepakatan Konferensi Asia-Afrika yang mencetuskan Dasa Sila sebagai prinsip dasar kerjasama, menekankan kedaulatan, self-determination, dan penolakan terhadap intervensi kekuatan besar.',
     fakta:['Menjadi fondasi lahirnya Gerakan Non-Blok (NAM) pada tahun yang sama','Prinsip Dasa Sila Bandung tetap dipegang hingga kini sebagai panduan diplomasi internasional']},
    {id:'pengenalansoveren', nama:'Pengakuan Kedaulatan Indonesia', periode:'27 Desember 1949', ringkasan:'Momen formal pengakuan Belanda atas kedaulatan Indonesia melalui Konferensi Meja Bundar di Den Haag, ditandai dengan serah terima kekuasaan secara resmi, meskipun perjuangan militer telah berlangsung sejak 1945.',
     fakta:['Konferensi Meja Bundar menghasilkan Uni Indonesia-Belanda sebagai bentuk kompromi, namun Uni ini dibubarkan Indonesia pada 1956','Momen ini menutup perjuangan kemerdekaan militer dan diplomasi yang berlangsung selama 4 tahun']},
    {id:'gesril', nama:'Gerakan 30 September (G30S) 1965', periode:'30 September 1965', ringkasan:'Peristiwa bersejarah yang menjadi titik balik pemerintahan Indonesia, dimulai dengan usaha kudeta yang dipimpin Letnan Kolonel Untung terhadap Presiden Soekarno, yang kemudian digunakan Soeharto untuk mengambil alih kekuasaan dan membentuk Orde Baru.',
     fakta:['Enam jenderal TNI AD terbunuh dalam peristiwa ini, memicu operasi keamanan berskala besar','Peristiwa ini secara langsung berujung pada pergantian kekuasaan dari Soekarno ke Soeharto']},
    {id:'pertempuransurabaya', nama:'Pertempuran Surabaya (10 November 1945)', periode:'10 November 1945', ringkasan:'Pertempuran besar antara arek-arek Surabaya melawan pasukan Sekutu dan NICA, dipicu tewasnya Brigadir Jenderal A.W.S. Mallaby dan pidato heroik Bung Tomo yang membakar semangat juang rakyat, menjadi pertempuran berdarah terbesar dalam sejarah revolusi kemerdekaan Indonesia.',
     fakta:['Menewaskan ribuan pejuang dan warga sipil Surabaya dalam pertempuran selama berminggu-minggu','Tanggal 10 November diperingati setiap tahun sebagai Hari Pahlawan Nasional Indonesia']},
    {id:'bandunglautanapi', nama:'Bandung Lautan Api', periode:'23-24 Maret 1946', ringkasan:'Peristiwa pembumihangusan Kota Bandung oleh rakyat dan pejuang Indonesia sendiri agar tidak dapat dimanfaatkan pasukan Sekutu dan NICA sebagai basis militer, dilakukan sebelum mundur mengikuti ultimatum untuk mengosongkan kota.',
     fakta:['Lebih dari 200.000 penduduk Bandung mengungsi meninggalkan kota sebelum aksi pembakaran dilakukan','Peristiwa ini menginspirasi lagu perjuangan legendaris "Halo-Halo Bandung" karya Ismail Marzuki']},
    {id:'serangan1maret', nama:'Serangan Umum 1 Maret 1949', periode:'1 Maret 1949', ringkasan:'Serangan besar TNI di bawah pimpinan Letkol Soeharto untuk merebut kembali Yogyakarta dari pendudukan Belanda selama enam jam, membuktikan kepada dunia internasional bahwa Republik Indonesia dan TNI masih eksis meski Belanda mengklaim telah menumpasnya.',
     fakta:['Berhasil menduduki kembali Yogyakarta selama sekitar 6 jam sebelum mundur teratur','Menjadi bukti penting bagi diplomasi internasional bahwa TNI dan Republik Indonesia masih berdiri kuat, memengaruhi tekanan PBB terhadap Belanda']},
  ],
  pascaKemerdekaan:[
    {id:'ordelama', nama:'Orde Lama', periode:'1945–1966', ringkasan:'Periode awal Indonesia merdeka di bawah kepemimpinan Presiden Soekarno, diwarnai upaya konsolidasi negara, berbagai pemberontakan daerah, sistem Demokrasi Terpimpin, hingga berakhir dengan peralihan kekuasaan pasca peristiwa G30S 1965.',
     fakta:['Indonesia sempat menerapkan sistem parlementer sebelum kembali ke UUD 1945 lewat Dekret Presiden 1959','Konferensi Asia-Afrika 1955 di Bandung menjadi momen penting diplomasi Indonesia di kancah internasional']},
    {id:'ris_periode', nama:'Republik Indonesia Serikat (RIS)', periode:'27 Desember 1949 – 17 Agustus 1950', ringkasan:'Bentuk negara federal Indonesia hasil kesepakatan Konferensi Meja Bundar, terdiri dari beberapa negara bagian, berumur pendek karena besarnya tuntutan rakyat untuk kembali ke bentuk negara kesatuan.',
     fakta:['Terdiri dari 16 negara bagian, sebagian besar bentukan Belanda untuk memecah kekuatan Republik Indonesia','Dibubarkan kembali menjadi Negara Kesatuan Republik Indonesia (NKRI) pada 17 Agustus 1950, tepat 5 tahun setelah proklamasi']},
    {id:'demokrasiliberal', nama:'Demokrasi Liberal (Parlementer)', periode:'1950–1959', ringkasan:'Periode penerapan sistem parlementer dengan Perdana Menteri sebagai kepala pemerintahan dan kabinet yang sering berganti akibat sistem multipartai yang tidak stabil, hanya bertahan sembilan tahun sebelum digantikan Demokrasi Terpimpin.',
     fakta:['Tercatat lebih dari tujuh kali pergantian kabinet dalam kurun waktu sembilan tahun akibat ketidakstabilan politik','Pemilu pertama Indonesia yang demokratis digelar pada 1955 untuk memilih anggota DPR dan Konstituante']},
    {id:'demokrasiterpimpin', nama:'Demokrasi Terpimpin', periode:'1959–1966', ringkasan:'Sistem pemerintahan yang dimulai lewat Dekret Presiden 5 Juli 1959, memusatkan kekuasaan besar di tangan Presiden Soekarno dengan konsep Nasakom (Nasionalisme-Agama-Komunisme), berakhir dengan pergolakan politik pasca G30S 1965.',
     fakta:['Presiden Soekarno diangkat menjadi presiden seumur hidup lewat Ketetapan MPRS pada 1963','Konsep Nasakom yang mempersatukan tiga kekuatan ideologi besar akhirnya memicu ketegangan politik yang berujung pada krisis 1965']},
    {id:'ordebaru', nama:'Orde Baru', periode:'1967–1998', ringkasan:'Periode pemerintahan Presiden Soeharto yang menitikberatkan stabilitas politik dan pembangunan ekonomi lewat program Repelita (Rencana Pembangunan Lima Tahun), namun juga ditandai sentralisasi kekuasaan yang berakhir lewat gerakan Reformasi 1998.',
     fakta:['Indonesia mencatat pertumbuhan ekonomi signifikan pada awal Orde Baru lewat program swasembada pangan','Krisis moneter Asia 1997–1998 menjadi pemicu utama runtuhnya kekuasaan Orde Baru']},
    {id:'krismon', nama:'Krisis Moneter 1997–1998', periode:'1997–1998', ringkasan:'Krisis ekonomi regional Asia yang berdampak parah pada Indonesia, ditandai anjloknya nilai rupiah secara drastis dan gejolak sosial-politik besar, menjadi pemicu langsung tuntutan Reformasi dan lengsernya Presiden Soeharto pada Mei 1998.',
     fakta:['Nilai tukar rupiah sempat anjlok dari sekitar Rp2.500 menjadi lebih dari Rp16.000 per dolar AS','Krisis ini memicu kerusuhan Mei 1998 di berbagai kota besar yang mempercepat tuntutan mundurnya Presiden Soeharto']},
    {id:'reformasi_sej', nama:'Reformasi', periode:'Sejak 1998', ringkasan:'Era baru demokrasi Indonesia yang dimulai setelah lengsernya Presiden Soeharto, membawa kebebasan pers, sistem multipartai, pemilu presiden langsung, serta otonomi daerah yang lebih luas.',
     fakta:['Empat kali amandemen UUD 1945 dilakukan pada era Reformasi (1999–2002)','Pemilu presiden langsung pertama kali digelar pada 2004']},
  ],

    {id:'kabinetprabowo', nama:'Kabinet Prabowo Subianto', periode:'2024–sekarang', pimpinan:'Presiden Prabowo Subianto', ringkasan:'Kabinet pemerintahan Presiden Prabowo Subianto bersama Wakil Presiden Gibran Rakabuming Raka, fokus pada program pangan, pangan, dan infrastruktur serta pertahanan.',

    {id:'kabinetampera', nama:'Kabinet Ampera', periode:'1966–1967', pimpinan:'Presiden Soekarno', ringkasan:'Kabinet Amanat Penderitaan Rakyat yang dibentuk untuk mengatasi krisis ekonomi dan politik pasca G30S, diketuai Letnan Jenderal Soemarto sebagai Wakil Perdana Menteri dengan mandat reformasi ekonomi radikal.',
     fakta:['Menerapkan kebijakan devaluasi rupiah dan penghapusan subsidi untuk menstabilkan ekonomi yang carut marut','Menjadi awal transisi dari Orde Lama ke Orde Baru']},
    {id:'kabinetpengembangan', nama:'Kabinet Pembangunan I', periode:'1967–1970', pimpinan:'Presiden Soeharto', ringkasan:'Kabinet pertama Presiden Soeharto yang fokus pada stabilisasi ekonomi dan pembangunan infrastruktur, meluncurkan program Repelita I (Rencana Pembangunan Lima Tahun Pertama).',
     fakta:['Program Repelita I fokus pada pertanian, terutama swasembada pangan','Menerapkan kebijakan dekonsentrasi kekuasaan ke daerah melalui otonomi terbatas']},
    {id:'kabinettugas', nama:'Kabinet Tugas', periode:'1998–1999', pimpinan:'Presiden B.J. Habibie', ringkasan:'Kabinet yang menjadi jembatan transisi dari Orde Baru ke Reformasi setelah lengsernya Soeharto, mendesain pemilu demokratis pertama dan pemberian otonomi daerah yang lebih luas.',
     fakta:['Menjadi kabinet pertama yang melibatkan tokoh-tokoh non-Militer dalam komposisi yang signifikan','Merancang pelaksanaan pemilu demokratis pertama pada 1999']},
    {id:'kabinetabdurahman', nama:'Kabinet Persatuan Nasional', periode:'1999–2001', pimpinan:'Presiden Abdurrahman Wahid', ringkasan:'Kabinet pertama era Reformasi dengan presiden yang dipilih melalui proses demokratis, menekankan pluralisme dan penegakan hukum, namun berakhir singkat akibat konflik internal parlemen.',
     fakta:['Presiden Abdurrahman Wahid menekankan pencegahan korupsi dan penegakan hukum','Kabinet ini berlangsung kurang lebih 2 tahun sebelum presiden diberhentikan melalui siding istimewa']},
    {id:'kabinetmegawati', nama:'Kabinet Gotong Royong', periode:'2001–2004', pimpinan:'Presiden Megawati Soekarnoputri', ringkasan:'Kabinet pemerintahan Presiden Megawati yang menekankan stabilisasi keamanan, pemberantasan terorisme, dan rekonsiliasi nasional di era pasca Bom Bali dan reformasi konstitusi UUD 1945.',
     fakta:['Menangani era pasca Bom Bali dan konflik separatisme di berbagai daerah','Mengimplementasikan amandemen keempat UUD 1945']},
    {id:'kabinetsusy', nama:'Kabinet Indonesia Bersatu I', periode:'2004–2009', pimpinan:'Presiden Susilo Bambang Yudhoyono', ringkasan:'Kabinet pertama pemerintahan SBY yang menekankan pemberantasan korupsi dan konsolidasi demokrasi, merupakan awal era dimana presiden dipilih melalui pemilihan langsung oleh rakyat.',
     fakta:['Program Revitalisasi Industri Manufaktur dan peningkatan daya saing menjadi fokus utama','Menangani periode pasca Tsunami Aceh 2004 dengan program rekonstruksi nasional']},
    {id:'kabinetsusy2', nama:'Kabinet Indonesia Bersatu II', periode:'2009–2014', pimpinan:'Presiden Susilo Bambang Yudhoyono', ringkasan:'Kabinet periode kedua pemerintahan SBY bersama Wakil Presiden Boediono, fokus pada stabilitas ekonomi pasca krisis global 2008 dan pembangunan infrastruktur lanjutan.',
     fakta:['Menghadapi tantangan pemulihan ekonomi global pasca krisis finansial 2008','Melanjutkan agenda reformasi birokrasi dan pemberantasan korupsi dari periode pertama']},
    {id:'kabinetdwikora', nama:'Kabinet Dwikora', periode:'1964–1966', pimpinan:'Presiden Soekarno', ringkasan:'Kabinet era akhir Demokrasi Terpimpin yang dibentuk dalam suasana konfrontasi dengan Malaysia (Dwi Komando Rakyat/Dwikora), mengalami beberapa kali perombakan di tengah gejolak politik menjelang peristiwa G30S 1965.',
     fakta:['Dibentuk dalam suasana politik "Ganyang Malaysia" akibat konfrontasi Indonesia-Malaysia','Mengalami perombakan (reshuffle) besar menjadi Kabinet Dwikora yang Disempurnakan pasca peristiwa G30S 1965']},

  wakilPresiden:[
    {id:'hatta_wapres', nama:'Mohammad Hatta', periode:'Wakil Presiden ke-1, 1945–1956', ringkasan:'Wakil presiden pertama Indonesia, mendampingi Soekarno sejak proklamasi, dikenal sebagai Bapak Koperasi Indonesia dan tokoh penting perumusan dasar ekonomi kerakyatan, meninggalkan jabatan karena perbedaan visi dengan Soekarno.',
     fakta:['Bersama Soekarno mengumumkan Proklamasi Kemerdekaan pada 17 Agustus 1945','Merupakan arsitek sistem ekonomi kerakyatan yang berbasis koperasi Indonesia']},
    {id:'sunarso_wapres', nama:'Sunarso', periode:'Wakil Presiden ke-2, 1956–1966', ringkasan:'Wakil presiden yang mendampingi Presiden Soekarno di era Demokrasi Terpimpin, menjadi tokoh kebijakan internal yang berperan dalam konsolidasi Orde Lama meskipun kurang menonjol di kancah publik.',
     fakta:['Menjadi wakil presiden selama 10 tahun, periode paling lama dalam sejarah Indonesia','Jarang muncul di depan publik, sehingga kurang dikenal dibanding rekan-rekan politiknya']},
    {id:'hamengkubuwono_wapres', nama:'Hamengkubuwono IX', periode:'Wakil Presiden ke-3, 1973–1978', ringkasan:'Wakil presiden dari kalangan bangsawan Yogyakarta, mendampingi Soeharto pada awal Orde Baru, merupakan tokoh yang dihormati berkat posisinya sebagai Sultan Yogyakarta sekaligus pemimpin nasional.',
     fakta:['Merupakan Sultan Yogyakarta sekaligus Wakil Presiden, simbol persatuan tradisional dan modernitas','Juga berperan sebagai tokoh diplomasi internasional yang dihormati']},
    {id:'umar_wapres', nama:'Umar Wirahadikusumah', periode:'Wakil Presiden ke-4, 1978–1983', ringkasan:'Wakil presiden dari Jawa Barat yang mendampingi Soeharto pada era pembangunan intensif Orde Baru, fokus pada isu pembangunan daerah dan partisipasi masyarakat dalam pembangunan.',

    {id:'legenda_tangkubanperahu', nama:'Situ Bagendit', asal:'Jawa Barat', ringkasan:'Kisah seorang wanita kaya raya yang tamak dan kikir, dikutuk menjadi danau setelah menolak membantu seorang kakek tua yang ternyata jelmaan sosok gaib, mengajarkan pesan tentang bahaya keserakahan.',
     fakta:['Situ Bagendit merupakan danau nyata di Garut, Jawa Barat, yang menjadi latar legenda ini','Legenda ini mengajarkan bahwa kekayaan tanpa kedermawanan akan mendatangkan bencana']},
    {id:'legenda_lutungkasarung', nama:'Lutung Kasarung', asal:'Jawa Barat', ringkasan:'Kisah seekor lutung (kera) yang sebenarnya adalah titisan dewa, membantu seorang putri yang difitnah saudarinya sendiri hingga akhirnya kebenaran terungkap dan sang putri kembali mendapatkan haknya.',
     fakta:['Lutung dalam cerita ini dipercaya sebagai titisan Sang Hyang Guruminda, dewa dari kayangan','Cerita ini menekankan pesan tentang keadilan yang pada akhirnya akan terungkap']},
    {id:'legenda_bawangmerah', nama:'Bawang Merah Bawang Putih', asal:'Jawa/Sumatra', ringkasan:'Cerita rakyat tentang dua saudara tiri dengan sifat berlawanan, Bawang Putih yang baik hati akhirnya mendapat balasan setimpal sementara Bawang Merah yang licik mendapat akibat perbuatannya sendiri.',
     fakta:['Terdapat variasi cerita ini di berbagai daerah Indonesia dengan detail yang sedikit berbeda','Mirip dengan cerita Cinderella dari Eropa, menunjukkan pola cerita rakyat universal tentang kebaikan versus kejahatan']},
    {id:'legenda_calonarang', nama:'Calon Arang', asal:'Bali', ringkasan:'Kisah seorang janda sakti yang menggunakan ilmu hitam untuk membalas dendam karena putrinya sulit mendapat jodoh, akhirnya dikalahkan oleh seorang pendeta sakti bernama Mpu Bharadah.',
     fakta:['Cerita ini menjadi dasar dari pertunjukan tari Barong dan Rangda di Bali','Dipercaya berdasarkan kisah nyata dari zaman Kerajaan Kediri di Jawa Timur']},
    {id:'legenda_jakatarub', nama:'Jaka Tarub dan Tujuh Bidadari', asal:'Jawa Tengah', ringkasan:'Kisah seorang pemuda yang mencuri selendang seorang bidadari saat mandi di telaga, memaksanya menjadi istri manusia hingga akhirnya menemukan kembali selendangnya dan kembali ke kahyangan.',
     fakta:['Cerita ini merupakan salah satu legenda paling populer tentang pertemuan manusia dan makhluk kahyangan','Mengajarkan pesan tentang konsekuensi dari tindakan yang dilakukan tanpa persetujuan orang lain']},
    {id:'legenda_ciungwanara', nama:'Ciung Wanara', asal:'Jawa Barat', ringkasan:'Kisah seorang pangeran yang dibuang saat bayi karena fitnah, dibesarkan alam liar bersama seekor ayam sakti, kemudian kembali untuk merebut haknya sebagai pewaris tahta kerajaan.',
     fakta:['Ayam sakti dalam cerita ini menjadi simbol kesetiaan dan keberuntungan bagi sang pangeran','Cerita ini populer di kawasan Ciamis, Jawa Barat, sebagai bagian dari sejarah lokal']},
    {id:'legenda_lakisang', nama:'Batu Menangis', asal:'Kalimantan Barat', ringkasan:'Kisah seorang gadis yang durhaka dan malu mengakui ibunya sendiri karena kemiskinan, dikutuk menjadi batu yang selalu "menangis" karena air hujan yang mengalir di permukaannya.',
     fakta:['Cerita ini mengajarkan pentingnya menghargai dan menghormati orang tua meski dalam keterbatasan','Populer di kalangan masyarakat Kalimantan Barat sebagai cerita moral untuk anak-anak']},
