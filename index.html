<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMNESFUBBIA FILM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background-color: #050505; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .nav-fixed { position: fixed; top: 0; left: 0; right: 0; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 50; padding: 10px 0; }
        .search-container { position: relative; width: 100%; }
        .search-input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 10px 40px 10px 15px; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; padding-top: 140px; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; padding: 20px; padding-top: 150px; } }
        .card { position: relative; aspect-ratio: 2/3; background: #111; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 6px; left: 6px; padding: 3px 6px; border-radius: 4px; font-size: 8px; font-weight: 900; text-transform: uppercase; z-index: 10; }
        .badge-movie { background: #e11d48; color: white; }
        .badge-tv { background: #2563eb; color: white; }
        .badge-short { background: #f59e0b; color: black; }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-box { min-height: 100vh; background: #0a0a0a; padding: 20px; }
        @media (min-width: 768px) { .modal-box { max-width: 900px; margin: 50px auto; border-radius: 20px; border: 1px solid #333; } }
        .btn-red { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 16px; margin-bottom: 8px; background: #e11d48; color: white; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; text-decoration: none; }
        .menu-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; }
        
        /* FONT MENU DIKECILKAN BIAR TERPOPULER KELIHATAN */
        select { background: #1a1a1a; color: white; border: 1px solid #333; padding: 8px 4px; border-radius: 6px; font-size: 8.5px; font-weight: bold; text-transform: uppercase; outline: none; }
    </style>
</head>
<body>

    <nav class="nav-fixed">
        <div class="container mx-auto px-4">
            <div class="flex items-center gap-3 mb-3">
                <div onclick="location.reload()" class="cursor-pointer shrink-0"><span class="text-lg font-black italic">AMNESFUBBIA<span class="text-red-600">FILM</span></span></div>
                <div class="search-container">
                    <input type="text" id="inputCari" class="search-input" placeholder="Cari Film..." onkeypress="if(event.key==='Enter') cariFilm()">
                </div>
            </div>
            <div class="menu-scroll">
                <select id="pilihTipe" onchange="resetLoad()">
                    <option value="multi">SEMUA</option>
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                    <option value="short">FILM PENDEK</option>
                </select>
                <select id="pilihGenre" onchange="resetLoad()">
                    <option value="">GENRE</option>
                    <option value="28">AKSI</option><option value="27">HOROR</option><option value="35">KOMEDI</option><option value="18">DRAMA</option><option value="10749">ROMANTIS</option>
                </select>
                <select id="pilihTahun" onchange="resetLoad()">
                    <option value="">TAHUN</option>
                    <script>for(let t = new Date().getFullYear(); t >= 1970; t--) { document.write(`<option value="${t}">${t}</option>`); }</script>
                </select>
                <select id="pilihSort" onchange="resetLoad()" class="flex-grow">
                    <option value="popularity.desc">TERPOPULER</option>
                    <option value="primary_release_date.desc">TERBARU</option>
                </select>
            </div>
        </div>
    </nav>

    <div id="gridFilm" class="movie-grid"></div>

    <div id="modalFilm" class="modal">
        <div class="modal-box relative">
            <button onclick="tutupModal()" class="absolute top-4 right-4 bg-black/50 text-white w-8 h-8 rounded-full border border-white/20 z-50">✕</button>
            <div class="flex flex-col md:flex-row gap-6">
                <div class="md:w-2/3">
                    <h1 id="jdl" class="text-xl font-bold mb-2">JUDUL</h1>
                    <p id="inf" class="text-xs text-gray-500 font-bold mb-4 uppercase"></p>
                    <div class="aspect-video bg-black rounded-xl overflow-hidden mb-5 border border-white/10">
                        <iframe id="layar" class="w-full h-full" allowfullscreen></iframe>
                    </div>
                    <p class="text-[10px] text-red-600 font-black tracking-widest mb-1 uppercase">Sinopsis</p>
                    <p id="sinop" class="text-sm text-gray-300 italic font-light leading-relaxed"></p>
                </div>
                <div class="md:w-1/3">
                    <p class="text-[10px] text-gray-500 font-bold mb-2 uppercase">Streaming</p>
                    <div id="btnStream"></div>
                    <hr class="border-white/10 my-4">
                    <p class="text-[10px] text-gray-500 font-bold mb-2 uppercase">Download</p>
                    <div id="btnDown"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'bfa7df5310c9974f62f26c6789a8c00d';
        let hal = 1; let sedangMemuat = false;

        window.onload = memuatFilm;
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) { if (!sedangMemuat) loadLagi(); } };

        async function memuatFilm() {
            if (sedangMemuat) return; sedangMemuat = true;
            const tipe = document.getElementById('pilihTipe').value;
            const genre = document.getElementById('pilihGenre').value;
            const tahun = document.getElementById('pilihTahun').value;
            const sort = document.getElementById('pilihSort').value;

            let url = "";
            if(tipe === "multi") {
                url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API}&language=id-ID&page=${hal}`;
            } else if(tipe === "short") {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API}&with_origin_country=ID&with_runtime.lte=45&language=id-ID&page=${hal}&sort_by=${sort}`;
            } else {
                url = `https://api.themoviedb.org/3/discover/${tipe}?api_key=${API}&with_origin_country=ID&language=id-ID&page=${hal}&sort_by=${sort}`;
            }
            if(genre && tipe !== "multi") url += `&with_genres=${genre}`;
            if(tahun && tipe !== "multi") url += (tipe === 'tv' ? `&first_air_date_year=${tahun}` : `&primary_release_year=${tahun}`);

            try {
                const res = await fetch(url);
                const data = await res.json();
                tampilkan(data.results, tipe);
            } catch (e) { console.error(e); }
            finally { sedangMemuat = false; }
        }

        function tampilkan(data, filterTipe) {
            const grid = document.getElementById('gridFilm');
            if(hal === 1) grid.innerHTML = '';
            data.forEach(m => {
                if(!m.poster_path) return;
                if(m.original_language !== 'id' && !m.origin_country?.includes('ID')) return;
                const kartu = document.createElement('div');
                kartu.className = 'card';
                const tipeItem = m.media_type || (filterTipe === 'tv' ? 'tv' : 'movie');
                let badge = `<div class="badge ${tipeItem==='movie'?'badge-movie':'badge-tv'}">${tipeItem==='movie'?'FILM':'SERIES'}</div>`;
                if(filterTipe === 'short') badge = `<div class="badge badge-short">SHORT</div>`;
                kartu.onclick = () => bukaModal(m.id, tipeItem);
                kartu.innerHTML = `${badge}<img src="https://image.tmdb.org/p/w500${m.poster_path}" loading="lazy">`;
                grid.appendChild(kartu);
            });
        }

        async function bukaModal(id, tipe) {
            document.getElementById('modalFilm').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const res = await fetch(`https://api.themoviedb.org/3/${tipe}/${id}?api_key=${API}&language=id-ID&append_to_response=videos`);
            const d = await res.json();
            document.getElementById('jdl').innerText = d.title || d.name;
            document.getElementById('inf').innerText = `${d.release_date || d.first_air_date || ''} • ⭐ ${d.vote_average.toFixed(1)}`;
            document.getElementById('sinop').innerText = d.overview || "Sinopsis tidak tersedia.";
            const v = d.videos?.results.find(x => x.type === 'Trailer') || d.videos?.results[0];
            document.getElementById('layar').src = v ? `https://www.youtube.com/embed/${v.key}?autoplay=1` : `https://vidsrc.xyz/embed/${tipe}/${id}`;
            const bH = (n, l) => `<button onclick="document.getElementById('layar').src='${l}'" class="btn-red"><span>${n}</span> <i class="fa-solid fa-play"></i></button>`;
            document.getElementById('btnStream').innerHTML = bH('Server Utama', `https://vidsrc.xyz/embed/${tipe}/${id}`) + bH('Server Cadangan', `https://vidsrc.to/embed/${tipe}/${id}`);
            document.getElementById('btnDown').innerHTML = `<a href="https://dl.vidsrc.vip/${tipe}/${id}" target="_blank" class="btn-red"><span>Download VIP</span> <i class="fa-solid fa-download"></i></a>`;
        }

        function tutupModal() { document.getElementById('modalFilm').style.display = 'none'; document.getElementById('layar').src = ''; document.body.style.overflow = 'auto'; }
        function loadLagi() { hal++; memuatFilm(); }
        function resetLoad() { hal = 1; window.scrollTo(0,0); memuatFilm(); }
        async function cariFilm() { const q = document.getElementById('inputCari').value; if(!q) return; const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API}&query=${q}&language=id-ID`); const data = await res.json(); hal = 1; tampilkan(data.results, 'multi'); }
    </script>
</body>
</html>
