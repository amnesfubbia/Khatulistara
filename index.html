<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Mirip YouTube</title>
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- CSS DIMULAI DI SINI --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #0f0f0f;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            height: 56px;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .logo i {
            color: red;
        }

        .search-bar {
            display: flex;
            flex: 0 1 600px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 20px 0 0 20px;
            outline: none;
        }

        .search-bar button {
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-left: none;
            background-color: #f8f8f8;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
        }

        .search-bar button:hover {
            background-color: #f0f0f0;
        }

        .user-actions {
            display: flex;
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
            align-items: center;
        }

        /* Main Content */
        .main-content {
            display: flex;
            min-height: calc(100vh - 56px);
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: white;
            padding: 10px 0;
            overflow-y: auto;
            display: none; /* Sembunyikan di mobile */
        }

        @media (min-width: 768px) {
            .sidebar {
                display: block;
            }
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .sidebar li:hover {
            background-color: #f0f0f0;
        }

        .sidebar li.active {
            background-color: #e5e5e5;
            font-weight: bold;
        }

        /* Movie Grid */
        .movie-grid {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Ukuran kartu lebih kecil agar mirip YT */
            gap: 20px;
            overflow-y: auto;
        }

        .movie-card {
            background-color: transparent;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.02);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Rasio aspek 16:9 seperti video YouTube */
            background-color: #ddd;
            border-radius: 12px;
            overflow: hidden;
        }

        .movie-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .movie-info {
            padding: 10px 0;
            display: flex;
            gap: 10px;
        }

        .channel-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #ccc;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #555;
        }

        .text-info {
            display: flex;
            flex-direction: column;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            line-height: 1.4;
            max-height: 2.8em; /* Batasi 2 baris */
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .movie-meta {
            font-size: 12px;
            color: #606060;
        }

        .movie-meta span {
            margin-right: 5px;
        }

        /* Loading & Error States */
        .loading, .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #606060;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo" onclick="fetchPopularMovies()">
            <i class="fab fa-youtube"></i> StreamFlix
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Telusuri">
            <button id="searchButton"><i class="fas fa-search"></i></button>
        </div>
        <div class="user-actions">
            <i class="fas fa-video" title="Buat"></i>
            <i class="fas fa-bell" title="Notifikasi"></i>
            <i class="fas fa-user-circle" title="Akun"></i>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="main-content">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul>
                <li class="active" onclick="fetchPopularMovies()"><i class="fas fa-home"></i> Beranda</li>
                <li><i class="fas fa-fire"></i> Trending</li>
                <li><i class="fas fa-film"></i> Film</li>
                <li><i class="fas fa-tv"></i> Serial TV</li>
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid #e5e5e5;">
                <li><i class="fas fa-history"></i> Histori</li>
                <li><i class="fas fa-clock"></i> Tonton Nanti</li>
            </ul>
        </aside>

        <!-- Grid Film -->
        <section class="movie-grid" id="movieGrid">
            <div class="loading">Memuat film...</div>
        </section>
    </main>

    <script>
        /* --- JAVASCRIPT DIMULAI DI SINI --- */
        
        // API Key TMDB Anda
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');

        // Fungsi untuk mengambil film populer
        async function fetchPopularMovies() {
            showLoading();
            try {
                // Mengambil film populer dengan bahasa Indonesia
                const response = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=id-ID&page=1`);
                
                if (!response.ok) {
                    throw new Error('Gagal mengambil data dari API');
                }

                const data = await response.json();
                displayMovies(data.results);
            } catch (error) {
                console.error('Error fetching popular movies:', error);
                showError('Gagal memuat film. Periksa koneksi internet atau API Key.');
            }
        }

        // Fungsi untuk mencari film
        async function searchMovies(query) {
            if (!query) {
                fetchPopularMovies(); // Jika kosong, tampilkan populer
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&language=id-ID&query=${encodeURIComponent(query)}&page=1`);
                
                if (!response.ok) {
                    throw new Error('Gagal mencari data');
                }

                const data = await response.json();
                displayMovies(data.results);
            } catch (error) {
                console.error('Error searching movies:', error);
                showError('Gagal mencari film.');
            }
        }

        // Fungsi menampilkan loading
        function showLoading() {
            movieGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>';
        }

        // Fungsi menampilkan error
        function showError(message) {
            movieGrid.innerHTML = `<div class="error">${message}</div>`;
        }

        // Fungsi untuk menampilkan film di grid
        function displayMovies(movies) {
            movieGrid.innerHTML = ''; // Kosongkan grid

            if (!movies || movies.length === 0) {
                movieGrid.innerHTML = '<div class="error">Tidak ada film ditemukan.</div>';
                return;
            }

            movies.forEach(movie => {
                // Buat elemen kartu film
                const movieCard = document.createElement('div');
                movieCard.classList.add('movie-card');

                // Tentukan URL poster
                const posterPath = movie.poster_path 
                    ? `${IMAGE_BASE_URL}${movie.poster_path}` 
                    : 'https://via.placeholder.com/500x281?text=No+Image'; // Placeholder rasio 16:9

                // Format tahun rilis
                const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                
                // Buat HTML internal kartu
                movieCard.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${posterPath}" alt="${movie.title}" class="movie-poster" loading="lazy">
                        <span class="duration-badge">⭐ ${movie.vote_average.toFixed(1)}</span>
                    </div>
                    <div class="movie-info">
                        <div class="channel-icon">
                            <i class="fas fa-film"></i>
                        </div>
                        <div class="text-info">
                            <h3 class="movie-title" title="${movie.title}">${movie.title}</h3>
                            <div class="movie-meta">
                                <span>${releaseYear}</span> • 
                                <span>Film</span>
                            </div>
                        </div>
                    </div>
                `;

                // Event listener saat kartu diklik
                movieCard.addEventListener('click', () => {
                    alert(`Anda memilih: ${movie.title}\n\nCatatan: Ini hanya demo tampilan. Untuk streaming video asli, diperlukan sumber video legal.`);
                    // Di sini Anda bisa menambahkan logika untuk membuka modal atau halaman detail
                });

                movieGrid.appendChild(movieCard);
            });
        }

        // Event Listeners
        searchButton.addEventListener('click', () => {
            searchMovies(searchInput.value);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMovies(searchInput.value);
            }
        });

        // Muat film populer saat halaman pertama kali dibuka
        window.addEventListener('DOMContentLoaded', fetchPopularMovies);

    </script>
</body>
</html>
