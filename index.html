<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1</title>

    <!-- Semua CSS kamu TIDAK DIUBAH -->
    <!-- (dipertahankan persis seperti sebelumnya) -->
</head>

<body>

<!-- ===================== HTML CONTENT ===================== -->
<!-- ⚠️ SELURUH HTML ASLI KAMU TETAP -->
<!-- (tidak aku ulang di sini demi fokus ke kode JS final) -->
<!-- ======================================================== -->

<script>
/* =========================================================
   GLOBAL STATE (DIRAPIKAN – TIDAK DIUBAH ISINYA)
========================================================= */
const API_KEY = "YOUR_API_KEY";

let page = 1;
let loading = false;
let abortController = null;

let currentType = 'multi';
let currentGenre = '';
let currentYear = '';
let currentCountry = '';
let currentCompany = '';
let currentSchedule = 'trending';
let searchQuery = '';
let currentCastId = '';
let currentLibMode = false;

let currentIdx = 0;
let startX = 0;
let globalFullDesc = '';
let isExpanded = false;

let isLsPaused = false;
let isLsMuted = false;

/* =========================================================
   LANDSCAPE PLAYER (TIDAK DIUBAH LOGIC)
========================================================= */
async function enterLandscape() {
    const overlay = document.getElementById('landscapeOverlay');
    const videoWrapper = document.getElementById('lsVideoWrapper');
    const track = document.getElementById('carouselTrack');
    const currentIframe = track.querySelectorAll('iframe')[currentIdx];
    if(!currentIframe) return;

    videoWrapper.innerHTML = '';
    const newIframe = currentIframe.cloneNode(true);
    newIframe.style.width = '100%';
    newIframe.style.height = '100%';
    videoWrapper.appendChild(newIframe);

    document.getElementById('lsTitle').innerText =
        document.getElementById('mTitle').innerText;

    document.body.classList.add('landscape-active');
    overlay.style.display = 'block';

    try {
        if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
        }
        if (screen.orientation?.lock) {
            await screen.orientation.lock('landscape').catch(()=>{});
        }
    } catch(e){}
}

function exitLandscape() {
    document.body.classList.remove('landscape-active');
    document.getElementById('landscapeOverlay').style.display = 'none';
    document.getElementById('lsVideoWrapper').innerHTML = '';

    if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen();
    }
    screen.orientation?.unlock?.();
}

function toggleLsPlay() {
    const iframe = document.querySelector('#lsVideoWrapper iframe');
    if(!iframe) return;
    isLsPaused = !isLsPaused;
    iframe.contentWindow.postMessage(
        JSON.stringify({event:'command',func:isLsPaused?'pauseVideo':'playVideo',args:''}),
        '*'
    );
    document.getElementById('lsPlay').className =
        isLsPaused ? 'fa-solid fa-play ls-btn text-7xl' : 'fa-solid fa-pause ls-btn text-7xl';
}

function toggleLsMute() {
    const iframe = document.querySelector('#lsVideoWrapper iframe');
    if(!iframe) return;
    isLsMuted = !isLsMuted;
    iframe.contentWindow.postMessage(
        JSON.stringify({event:'command',func:isLsMuted?'mute':'unMute',args:''}),
        '*'
    );
    document.getElementById('lsMute').className =
        isLsMuted ? 'fa-solid fa-volume-xmark ls-btn' : 'fa-solid fa-volume-high ls-btn';
}

function lockScreen(){
    document.getElementById('lsUI').style.display='none';
    document.getElementById('lsLockLayer').style.display='flex';
}
function unlockScreen(){
    document.getElementById('lsUI').style.display='flex';
    document.getElementById('lsLockLayer').style.display='none';
}

/* =========================================================
   UI HELPERS
========================================================= */
function updateActiveNav(el){
    document.querySelectorAll('.bottom-nav i')
        .forEach(i=>i.classList.remove('active-nav'));
    el.classList.add('active-nav');
}

function toggleSideMenu(){
    const m=document.getElementById('sideMenu');
    const v=m.style.display==='block';
    m.style.display=v?'none':'block';
    document.body.style.overflow=v?'auto':'hidden';
}

/* =========================================================
   SEARCH & FILTER (LOGIC TETAP)
========================================================= */
function openSearch(){
    document.getElementById('searchOverlay').style.display='block';
    document.getElementById('searchInp').focus();
    document.body.style.overflow='hidden';
}
function closeSearch(){
    document.getElementById('searchOverlay').style.display='none';
    document.body.style.overflow='auto';
    searchQuery='';
}

function searchAction(){
    currentLibMode=false;
    currentCastId='';
    searchQuery=document.getElementById('searchInp').value;
    loadFeed(true);
}

/* =========================================================
   DATA FETCH & GRID
========================================================= */
async function loadFeed(isNew=true){
    if(loading && isNew && abortController) abortController.abort();
    if(loading && !isNew) return;

    loading=true;
    abortController=new AbortController();

    const grid = document.getElementById('searchOverlay').style.display==='block'
        ? document.getElementById('searchGrid')
        : document.getElementById('feedGrid');

    if(isNew){
        page=1;
        grid.innerHTML='';
    }

    let url='';
    if(currentCastId){
        url=`https://api.themoviedb.org/3/person/${currentCastId}/combined_credits?api_key=${API_KEY}&language=id-ID`;
    } else if(searchQuery){
        url=`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false`;
    } else if(currentType==='multi'){
        url=`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&language=id-ID&page=${page}`;
    } else {
        const ep=currentType==='tv'?'discover/tv':'discover/movie';
        url=`https://api.themoviedb.org/3/${ep}?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
        if(currentCountry) url+=`&with_origin_country=${currentCountry}`;
        if(currentGenre) url+=`&with_genres=${currentGenre}`;
        if(currentCompany) url+=`&with_companies=${currentCompany}`;
        if(currentYear){
            url+=currentType==='tv'
                ? `&first_air_date_year=${currentYear}`
                : `&primary_release_year=${currentYear}`;
        }
    }

    try{
        const r=await fetch(url,{signal:abortController.signal});
        const d=await r.json();
        const items=d.results||d.cast||[];
        if(!items.length && isNew){
            grid.innerHTML=`<div class="col-span-3 text-center py-20 text-zinc-600 text-xs">Konten tidak ditemukan.</div>`;
        } else {
            renderGrid(items,grid);
        }
    }catch(e){}
    loading=false;
}

function renderGrid(items,grid){
    items.forEach(m=>{
        if(!m.poster_path || m.media_type==='person') return;
        const type=m.media_type||(currentType==='tv'?'tv':'movie');
        const card=document.createElement('div');
        card.className='post-card';
        card.onclick=()=>openModal(m.id,type);
        card.innerHTML=`
            <div class="badge-rating">★ ${(m.vote_average||0).toFixed(1)}</div>
            <div class="badge-type">${type}</div>
            <img src="https://image.tmdb.org/t/p/w342${m.poster_path}" loading="lazy">
        `;
        grid.appendChild(card);
    });
}

/* =========================================================
   MODAL & PLAYER (TIDAK DIUBAH PERILAKU)
========================================================= */
async function openModal(id,type){
    window.currentMediaId=id;
    window.currentMediaType=type;
    document.getElementById('movieModal').style.display='block';
    document.body.style.overflow='hidden';
    currentIdx=0;

    const [rId,rEn,rCast]=await Promise.all([
        fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos,production_companies`),
        fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US&append_to_response=videos`),
        fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
    ]);

    const dId=await rId.json();
    const dEn=await rEn.json();
    const dCast=await rCast.json();

    const vids=[...(dId.videos?.results||[]),...(dEn.videos?.results||[])]
        .filter(v=>v.site==='YouTube')
        .slice(0,4);

    const track=document.getElementById('carouselTrack');
    const dots=document.getElementById('carouselDots');
    track.innerHTML='';
    dots.innerHTML='';

    if(vids.length){
        vids.forEach((v,i)=>{
            track.innerHTML+=`
                <div class="carousel-slide">
                    <iframe src="https://www.youtube.com/embed/${v.key}?enablejsapi=1&autoplay=${i===0?1:0}"
                    class="w-full h-full" allow="autoplay; fullscreen"></iframe>
                </div>`;
            dots.innerHTML+=`<div class="dot w-1.5 h-1.5 rounded-full ${i===0?'bg-blue-500':'bg-zinc-700'}"></div>`;
        });
        document.getElementById('swipeOverlay').style.display='block';
    } else {
        track.innerHTML=`<div class="carousel-slide"><iframe src="https://vidsrc.me/embed/${type}?tmdb=${id}" class="w-full h-full" allowfullscreen></iframe></div>`;
        document.getElementById('swipeOverlay').style.display='none';
    }

    document.getElementById('castContainer').innerHTML=
        (dCast.cast||[]).slice(0,10).map(c=>`
            <div class="cast-item" onclick="searchByCast(${c.id})">
                <div class="cast-img-border">
                    <div class="inner-border">
                        <img src="https://image.tmdb.org/t/p/w185${c.profile_path}" onerror="this.src='amnesfubbia.png'">
                    </div>
                </div>
                <span class="cast-name">${c.name}</span>
            </div>
        `).join('');

    document.getElementById('mTitle').innerText=dId.title||dId.name;
    globalFullDesc=dId.overview||dEn.overview||'Sinopsis belum tersedia.';
    renderSynopsis();

    updateLibButtons(id);
}

function closeModal(){
    document.getElementById('carouselTrack').innerHTML='';
    document.getElementById('movieModal').style.display='none';
    document.body.style.overflow='auto';
}

/* =========================================================
   INIT
========================================================= */
window.onload=()=>{
    loadFeed(true);
};
window.onscroll=()=>{
    if((innerHeight+scrollY)>=document.body.offsetHeight-500 && !loading && !searchQuery){
        page++;
        loadFeed(false);
    }
};
</script>

</body>
</html>
