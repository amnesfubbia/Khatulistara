<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* NETFLIX STYLE SPLASH SCREEN */
        #splashScreen { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 9999; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            animation: fadeOutSplash 0.5s ease-in forwards;
            animation-delay: 2.3s;
        }
        .splash-content { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            animation: netflixScale 2.2s ease-out forwards;
        }
        .splash-logo { width: 65px; height: 65px; margin-bottom: 0px; border: none; }
        .splash-title { 
            color: #ffffff; font-size: 11px; font-weight: 500; 
            letter-spacing: 3px; text-transform: uppercase; 
            opacity: 0.8; margin-top: -2px; 
        }
        .splash-footer { position: absolute; bottom: 35px; text-align: center; }
        .from-text { font-size: 10px; color: #8e8e8e; letter-spacing: 1px; margin-bottom: 2px; text-transform: lowercase; }
        .brand-text { 
            font-size: 15px; font-weight: 800; letter-spacing: 1.5px; 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }

        @keyframes netflixScale {
            0% { transform: scale(0.85); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes fadeOutSplash {
            to { opacity: 0; visibility: hidden; }
        }

        /* HEADER & PROFILE */
        .profile-header { padding: 15px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ig-logo-wrapper { display: flex; align-items: center; gap: 4px; position: relative; cursor: pointer; }
        .ig-logo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
        .dot-notify { width: 7px; height: 7px; background-color: #ff3b30; border-radius: 50%; display: inline-block; margin-left: 2px; }
        
        .profile-info { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .profile-pic-container { position: relative; width: 68px; height: 68px; }
        .profile-pic-logo { 
            width: 68px; height: 68px; border-radius: 50%; border: 1px solid #333; 
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
            background: #000; padding: 8px; 
        }
        .profile-pic-logo img { width: 100%; height: 100%; object-fit: contain; }
        .add-story-btn { position: absolute; bottom: 2px; right: 2px; width: 19px; height: 19px; background: #0095f6; border: 2px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #fff; z-index: 10; }

        /* AUDIT FONT STATISTIK */
        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; color: #fff; }
        .stat-label { font-size: 13px; color: #fff; font-weight: 400; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; padding-top: 5px; }
        .bio-name-wrapper { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
        .bio-name { font-weight: 700; font-size: 14px; display: block; }

        .action-buttons { display: flex; gap: 6px; margin-bottom: 10px; }
        .btn-ig { flex: 1; background: #1c1c1c; border-radius: 8px; padding: 7px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; color: #fff; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 34px; background: #1c1c1c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #filterBar { display: none; margin-bottom: 15px; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 7px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; }
        
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #121212; border-radius: 20px 20px 0 0; z-index: 5000; max-height: 60vh; overflow-y: auto; border-top: 1px solid #333; padding-bottom: 20px; animation: slideUp 0.3s ease-out; overscroll-behavior: contain; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sticky-reset { position: sticky; top: 0; background: #1c1c1c; z-index: 10; font-weight: 800 !important; color: #0095f6 !important; border-bottom: 2px solid #333; }
        #filterOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 4000; }
        .filter-item { padding: 16px; font-size: 14px; text-align: center; border-bottom: 1px solid #262626; color: #eee; cursor: pointer; }

        .highlights-wrapper { padding: 0 15px 15px 15px; border-bottom: 1px solid #1c1c1c; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; }
        .highlight-item { flex: 0 0 62px; text-align: center; cursor: pointer; }
        .highlight-circle { width: 58px; height: 58px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; background: #000; }
        .highlight-circle .hl-logo { font-size: 10px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; color: #fff; text-align: center; line-height: 1; }
        .highlight-text { font-size: 10px; color: #fff; }

        .tab-nav { display: flex; border-top: 1px solid #1c1c1c; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 18px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .badge-type { position: absolute; top: 6px; right: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(0,0,0,0.7); color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.3); }

        /* LINGKARAN CAST STORY STYLE */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .cast-wrapper { display: flex; overflow-x: auto; gap: 15px; padding: 15px 0; scrollbar-width: none; }
        .cast-item { flex: 0 0 65px; text-align: center; cursor: pointer; }
        .cast-img-border { 
            width: 64px; height: 64px; border-radius: 50%; padding: 2.5px; 
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); 
            margin-bottom: 5px; 
        }
        .cast-img-inner { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; overflow: hidden; background: #000; }
        .cast-img-inner img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .cast-name { font-size: 9px; font-weight: 500; color: #fff; line-height: 1.2; display: block; margin-top: 4px; }
        
        /* CAPTION & TERJEMAHAN */
        .ig-post-content { padding: 0 15px; margin-top: 5px; }
        .ig-likes-count { font-weight: 700; font-size: 13px; margin-bottom: 5px; display: block; }
        .ig-username { font-weight: 700; font-size: 13px; margin-right: 5px; }
        .ig-caption { font-size: 13px; line-height: 1.4; color: #efefef; }
        .toggle-btn { display: block; color: #a8a8a8; cursor: pointer; font-size: 13px; margin-top: 4px; font-weight: 500; }
        .ig-hashtags { color: #e0f1ff; display: block; margin-top: 10px; font-size: 13px; }
        .ig-date { color: #a8a8a8; font-size: 11px; margin-top: 8px; text-transform: uppercase; }
        #mTranslateBtn { font-size: 11px; color: #a8a8a8; font-weight: 600; margin-top: 8px; cursor: pointer; } 
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-content">
            <img src="amnesfubbia.png" class="splash-logo" alt="Logo">
            <div class="splash-title">amnesfubbia</div>
        </div>
        <div class="splash-footer">
            <div class="from-text">from</div>
            <div class="brand-text">ANASTEAS</div>
        </div>
    </div>

    <div id="mainProfile" style="display: none;">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="backToHome()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-5">
                    <i class="fa-regular fa-square-plus text-2xl"></i>
                    <i class="fa-solid fa-bars text-2xl"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><img src="amnesfubbia.png" alt="Logo"></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('type', 'movie')"><span class="stat-val">25.4rb</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'tv')"><span class="stat-val">8.2rb</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'short')"><span class="stat-val">1.5rb</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <div class="bio-name-wrapper"><span class="bio-name">amnesfubbia</span><i class="fa-solid fa-circle-check text-[#0095f6] text-[13px]"></i></div>
                <span>dari indonesia untuk dunia</span><br><span>By Anasteas</span>
            </div>

            <div class="action-buttons">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-sm"></i></div>
            </div>

            <div id="filterBar">
                <div class="pill-grid grid-cols-3">
                    <button class="pill" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre <i class="fa-solid fa-caret-down"></i></button>
                    <button class="pill" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun <i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar"><div class="highlights-container no-scrollbar" id="highlightList"></div></div>

        <div class="tab-nav">
            <div class="tab-item active" id="tabGrid" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" id="tabLikes" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" id="tabBookmark" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="filterOverlay" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[14px] font-bold truncate px-8" id="mTitle"></div>
            </div>
            <div id="castContainer" class="cast-wrapper px-4 no-scrollbar"></div>
            <div class="relative bg-zinc-900 aspect-video">
                <div id="carouselTrack" class="w-full h-full flex transition-transform"></div>
            </div>
            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4"><i id="btnLikeModal" class="text-2xl cursor-pointer"></i><i class="fa-regular fa-comment text-2xl"></i><i class="fa-regular fa-paper-plane text-2xl"></i></div>
                <i id="btnBookModal" class="text-2xl cursor-pointer"></i>
            </div>
            <div class="ig-post-content">
                <span id="mLikeDisplay" class="ig-likes-count"></span>
                <div class="mb-1">
                    <span class="ig-username">amnesfubbia</span>
                    <span id="mDesc" class="ig-caption"></span>
                    <div class="mt-1"><span id="mToggleBtn" class="toggle-btn hidden" onclick="handleToggleDesc()">selengkapnya</span></div>
                </div>
                <p id="mTranslateBtn" class="hidden" onclick="handleTranslate()">Lihat terjemahan</p>
                <div id="mHashtags" class="ig-hashtags"></div>
                <div id="mDateDisplay" class="ig-date"></div>
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4"><h4 class="text-[9px] font-black text-zinc-400 uppercase">Episode</h4><select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select></div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house cursor-pointer text-xl" onclick="backToHome()"></i>
        <i class="fa-solid fa-magnifying-glass cursor-pointer text-xl"></i>
        <i class="fa-regular fa-bookmark cursor-pointer text-xl"></i>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', isExpanded = false, globalFullDesc = "", globalEnDesc = "";

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splashScreen').style.display = 'none';
                document.getElementById('mainProfile').style.display = 'block';
            }, 2800);
            initFilters(); initHighlights(); loadFeed(); 
        };

        function backToHome() { location.reload(); }

        function initHighlights() {
            const hls = [{n: 'Disney', l: 'DSNY'},{n: 'Pixar', l: 'PIXR'},{n: 'Indo', c: 'ID', l: 'INDO'}];
            const cont = document.getElementById('highlightList');
            hls.forEach(h => {
                const div = document.createElement('div');
                div.className = 'highlight-item';
                div.onclick = () => { currentCountry = h.c || ''; loadFeed(true); };
                div.innerHTML = `<div class="highlight-circle"><span class="hl-logo">${h.l}</span></div><div class="highlight-text">${h.n}</div>`;
                cont.appendChild(div);
            });
        }

        function initFilters() {
            const genres = [[28,'Action'],[12,'Adventure'],[16,'Animasi'],[35,'Komedi'],[80,'Crime'],[18,'Drama'],[27,'Horror'],[10749,'Romance']];
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = genres.map(g => `<div class="filter-item" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`).join('');
            
            const countries = [['ID','Indonesia'],['US','USA'],['KR','Korea'],['JP','Jepang']];
            const cD = document.getElementById('countryDropdown');
            cD.innerHTML = countries.map(c => `<div class="filter-item" onclick="setCountry('${c[0]}','${c[1]}')">${c[1]}</div>`).join('');

            const yD = document.getElementById('yearDropdown');
            let yearHTML = ''; for(let y=2026; y>=1990; y--) yearHTML += `<div class="filter-item" onclick="setYear(${y})">${y}</div>`;
            yD.innerHTML = yearHTML;
        }

        function toggleFilter(e, id) { e.stopPropagation(); document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display='none'); document.getElementById(id).style.display='block'; document.getElementById('filterOverlay').style.display='block'; }
        function closeD() { document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display='none'); document.getElementById('filterOverlay').style.display='none'; }
        function setGenre(id, name) { currentGenre = id; document.getElementById('btnGenre').innerText = name; closeD(); loadFeed(true); }
        function setCountry(id, name) { currentCountry = id; document.getElementById('btnCountry').innerText = name; closeD(); loadFeed(true); }
        function setYear(y) { currentYear = y; document.getElementById('yearBtn').innerText = y; closeD(); loadFeed(true); }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const grid = document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            let url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;
            if(currentYear) url += (currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`);
            try {
                const res = await fetch(url);
                const data = await res.json();
                data.results.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.onclick = () => openModal(m.id, currentType);
                    card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                    grid.appendChild(card);
                });
            } catch(e) {}
            loading = false;
        }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            const [rId, rEn, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=en-US`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dEn = await rEn.json(), dCast = await rCast.json();
            
            document.getElementById('castContainer').innerHTML = dCast.cast.slice(0,10).map(c => `
                <div class="cast-item">
                    <div class="cast-img-border"><div class="cast-img-inner"><img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185' + c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}"></div></div>
                    <span class="cast-name">${c.name}</span>
                </div>
            `).join('');

            document.getElementById('mTitle').innerText = dId.title || dId.name;
            document.getElementById('mLikeDisplay').innerText = `${Math.floor(dId.vote_average * 1000).toLocaleString()} suka`;
            globalFullDesc = dId.overview || dEn.overview;
            globalEnDesc = dEn.overview;
            if(!dId.overview && dEn.overview) document.getElementById('mTranslateBtn').classList.remove('hidden');
            else document.getElementById('mTranslateBtn').classList.add('hidden');
            isExpanded = false; renderSynopsis();
            
            document.getElementById('carouselTrack').innerHTML = `<div class="min-w-full h-full"><iframe src="https://vidrock.net/embed/${type}/${id}" class="w-full h-full" allowfullscreen></iframe></div>`;
            document.getElementById('mDateDisplay').innerText = dId.release_date || dId.first_air_date;
            document.getElementById('serverList').innerHTML = `<button class="btn-ig" onclick="playVid('https://vidrock.net/embed/${type}/${id}')">Server 1</button><button class="btn-ig" onclick="playVid('https://vidsrc.me/embed/${type}?tmdb=${id}')">Server 2</button>`;
        }

        async function handleTranslate() {
            const btn = document.getElementById('mTranslateBtn');
            btn.innerText = "Menerjemahkan...";
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=id&dt=t&q=${encodeURIComponent(globalEnDesc)}`);
            const data = await res.json();
            globalFullDesc = data[0].map(x => x[0]).join('');
            renderSynopsis();
            btn.classList.add('hidden');
        }

        function playVid(url) { document.getElementById('carouselTrack').innerHTML = `<div class="min-w-full h-full"><iframe src="${url}" class="w-full h-full" allowfullscreen></iframe></div>`; }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function renderSynopsis() { const d = document.getElementById('mDesc'); d.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90); document.getElementById('mToggleBtn').style.display = globalFullDesc.length > 90 && !isExpanded ? 'inline' : 'none'; }
        function handleToggleDesc() { isExpanded = true; renderSynopsis(); }
        function toggleFilterBar() { const b = document.getElementById('filterBar'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
        function setFilter(k, v) { currentType = v; loadFeed(true); }
        function setSchedule(v, el) { currentSchedule = v; loadFeed(true); }
        async function switchTab(mode, el) { loadFeed(true); }
        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
