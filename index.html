<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', -apple-system, sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* SPLASH SCREEN */
        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeOutSplash 0.5s ease-in forwards; animation-delay: 2.3s; }
        .splash-content { display: flex; flex-direction: column; align-items: center; animation: netflixScale 2.2s ease-out forwards; }
        .splash-logo { width: 65px; height: 65px; border: none; }
        .splash-title { color: #ffffff; font-size: 11px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; opacity: 0.8; margin-top: -2px; }
        .splash-footer { position: absolute; bottom: 35px; text-align: center; }
        .from-text { font-size: 10px; color: #8e8e8e; letter-spacing: 1px; margin-bottom: 2px; text-transform: lowercase; }
        .brand-text { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes netflixScale { 0% { transform: scale(0.85); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.1); opacity: 1; } }
        @keyframes fadeOutSplash { to { opacity: 0; visibility: hidden; } }

        /* PROFILE HEADER */
        .profile-header { padding: 12px 15px 0 15px; background: #000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .ig-logo { font-weight: 700; font-size: 22px; letter-spacing: -1px; }
        .dot-notify { width: 8px; height: 8px; background-color: #ff3b30; border-radius: 50%; border: 1.5px solid #000; display: inline-block; margin-left: -5px; margin-top: -10px; }
        
        .profile-info { display: flex; align-items: center; gap: 28px; margin-bottom: 12px; }
        .profile-pic-container { position: relative; width: 78px; height: 78px; }
        .profile-pic-logo { width: 78px; height: 78px; border-radius: 50%; border: 1px solid #262626; padding: 4px; background: #000; }
        .profile-pic-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .add-story-btn { position: absolute; bottom: 2px; right: 2px; width: 22px; height: 22px; background: #0095f6; border: 2.5px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }

        .stats { display: flex; flex-grow: 1; justify-content: space-around; text-align: center; padding-right: 10px; }
        .stat-val { font-weight: 700; font-size: 16px; display: block; color: #fff; }
        .stat-label { font-size: 13px; color: #fff; font-weight: 400; }
        
        .bio { font-size: 13px; line-height: 1.4; margin-bottom: 15px; }
        .bio-name { font-weight: 600; font-size: 13px; display: block; margin-bottom: 1px; }

        .btn-ig { flex: 1; background: #262626; border-radius: 8px; padding: 6px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; }
        .btn-ig.active { background: #363636; }
        .btn-icon-sq { width: 32px; background: #262626; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        .pill { background: transparent; border: 1px solid #262626; color: #fff; padding: 6px 0; border-radius: 8px; font-size: 11px; font-weight: 600; text-align: center; }
        .filter-dropdown { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #262626; border-radius: 15px 15px 0 0; z-index: 5000; max-height: 50vh; overflow-y: auto; padding-bottom: 20px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* HIGHLIGHTS & TABS */
        .highlights-wrapper { padding: 0 15px 15px 15px; }
        .highlight-item { flex: 0 0 64px; text-align: center; }
        .highlight-circle { width: 60px; height: 60px; border-radius: 50%; border: 1px solid #262626; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; background: #121212; }
        .highlight-text { font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #a8a8a8; cursor: pointer; font-size: 22px; }
        .tab-item.active { color: #fff; border-bottom: 1px solid #fff; }

        /* GRID */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-bottom: 80px; }
        .post-card { position: relative; aspect-ratio: 1/1; background: #121212; overflow: hidden; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }

        /* MODAL & CAST (STORY STYLE) */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 3000; background: #000; overflow-y: auto; }
        .cast-wrapper { display: flex; overflow-x: auto; gap: 12px; padding: 15px; border-bottom: 0.5px solid #262626; }
        .cast-item { flex: 0 0 70px; text-align: center; }
        .cast-img-border { 
            width: 66px; height: 66px; border-radius: 50%; padding: 2.5px; 
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); 
            margin-bottom: 4px; 
        }
        .cast-img-inner { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; overflow: hidden; background: #000; }
        .cast-img-inner img { width: 100%; height: 100%; object-fit: cover; }
        .cast-name { font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

        /* CAPTION STYLE */
        .ig-post-content { padding: 0 15px; margin-top: 10px; }
        .ig-username { font-weight: 600; font-size: 13px; margin-right: 5px; }
        .ig-caption { font-size: 13px; line-height: 1.5; color: #fff; }
        .ig-date { color: #a8a8a8; font-size: 11px; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.2px; }
        #mTranslateBtn { font-size: 11px; color: #a8a8a8; font-weight: 600; margin-top: 8px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 0.5px solid #262626; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-content">
            <img src="amnesfubbia.png" class="splash-logo" alt="Logo">
            <div class="splash-title">amnesfubbia</div>
        </div>
        <div class="splash-footer">
            <div class="from-text">from</div>
            <div class="brand-text">ANASTEAS</div>
        </div>
    </div>

    <div id="mainProfile" style="display: none;">
        <div class="profile-header">
            <div class="top-bar">
                <div class="ig-logo-wrapper" onclick="backToHome()">
                    <h1 class="ig-logo">amnesfubbia</h1>
                    <span class="dot-notify"></span>
                </div>
                <div class="flex gap-6 items-center">
                    <i class="fa-regular fa-square-plus text-[24px]"></i>
                    <i class="fa-solid fa-bars text-[22px]"></i>
                </div>
            </div>

            <div class="profile-info">
                <div class="profile-pic-container">
                    <div class="profile-pic-logo"><img src="amnesfubbia.png" alt="Logo"></div>
                    <div class="add-story-btn"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="stats">
                    <div class="stat-item" onclick="setFilter('type', 'movie')"><span class="stat-val">25.4k</span><span class="stat-label">film</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'tv')"><span class="stat-val">8.2k</span><span class="stat-label">series</span></div>
                    <div class="stat-item" onclick="setFilter('type', 'short')"><span class="stat-val">1.5k</span><span class="stat-label">short</span></div>
                </div>
            </div>

            <div class="bio">
                <span class="bio-name">amnesfubbia</span>
                <span class="text-zinc-400">hiburan • dari indonesia untuk dunia</span><br>
                <span>By Anasteas</span>
            </div>

            <div class="flex gap-2 mb-6">
                <div class="btn-ig" id="btnNowPlaying" onclick="setSchedule('now_playing', this)">Sedang Tayang</div>
                <div class="btn-ig" id="btnUpcoming" onclick="setSchedule('upcoming', this)">Segera Tayang</div>
                <div class="btn-icon-sq" onclick="toggleFilterBar()"><i class="fa-solid fa-user-plus text-[12px]"></i></div>
            </div>

            <div id="filterBar" class="hidden mb-4">
                <div class="grid grid-cols-3 gap-2">
                    <button class="pill" id="btnCountry" onclick="toggleFilter(event, 'countryDropdown')">Negara</button>
                    <button class="pill" id="btnGenre" onclick="toggleFilter(event, 'genreDropdown')">Genre</button>
                    <button class="pill" id="yearBtn" onclick="toggleFilter(event, 'yearDropdown')">Tahun</button>
                </div>
            </div>
        </div>

        <div class="highlights-wrapper no-scrollbar">
            <div class="flex gap-4 overflow-x-auto no-scrollbar" id="highlightList"></div>
        </div>

        <div class="tab-nav flex border-t border-zinc-900">
            <div class="tab-item active" id="tabGrid" onclick="switchTab('grid', this)"><i class="fa-solid fa-table-cells"></i></div>
            <div class="tab-item" id="tabLikes" onclick="switchTab('likes', this)"><i class="fa-regular fa-heart"></i></div>
            <div class="tab-item" id="tabBookmark" onclick="switchTab('bookmarks', this)"><i class="fa-regular fa-bookmark"></i></div>
        </div>

        <main id="feedGrid" class="movie-grid"></main>
    </div>

    <div id="filterOverlay" class="fixed inset-0 bg-black/50 z-[4000] hidden" onclick="closeD()"></div>
    <div id="countryDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="genreDropdown" class="filter-dropdown no-scrollbar"></div>
    <div id="yearDropdown" class="filter-dropdown no-scrollbar"></div>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-32">
            <div class="px-4 h-[50px] flex items-center sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl" onclick="closeModal()"></i>
                <div class="flex-grow text-center text-[15px] font-semibold truncate px-10" id="mTitle"></div>
            </div>
            
            <div id="castContainer" class="cast-wrapper no-scrollbar"></div>

            <div class="relative bg-zinc-900 aspect-video">
                <div class="carousel-track h-full flex transition-transform duration-300" id="carouselTrack"></div>
                <div id="carouselDots" class="absolute bottom-[-25px] left-0 right-0 flex justify-center gap-1.5"></div>
            </div>

            <div class="px-4 pt-8 pb-3 flex justify-between">
                <div class="flex gap-5 text-[24px]">
                    <i id="btnLikeModal" class="cursor-pointer"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <i id="btnBookModal" class="text-[24px] cursor-pointer"></i>
            </div>

            <div class="ig-post-content">
                <span id="mLikeDisplay" class="font-semibold text-[13px] block mb-1"></span>
                <div class="mb-1">
                    <span class="ig-username">amnesfubbia</span>
                    <span id="mDesc" class="ig-caption"></span>
                    <span id="mToggleBtn" class="text-zinc-400 hidden cursor-pointer" onclick="handleToggleDesc()">... selengkapnya</span>
                </div>
                <p id="mTranslateBtn" class="hidden" onclick="handleTranslate()">Lihat terjemahan</p>
                <div id="mDateDisplay" class="ig-date"></div>
                
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-900/50 rounded-xl">
                    <div class="flex justify-between items-center mb-4 text-[11px] font-bold uppercase text-zinc-500">
                        <span>Episode</span>
                        <select id="seasonSel" class="bg-black border border-zinc-800 rounded px-1" onchange="loadEpisodes()"></select>
                    </div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>

                <div id="serverList" class="grid grid-cols-3 gap-2 mt-6"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <i class="fa-solid fa-house text-[22px]" onclick="backToHome()"></i>
        <i class="fa-solid fa-magnifying-glass text-[22px]"></i>
        <i class="fa-regular fa-heart text-[22px]"></i>
        <div class="w-6 h-6 rounded-full border border-white overflow-hidden" onclick="backToHome()">
            <img src="amnesfubbia.png" class="w-full h-full">
        </div>
    </nav>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'movie', currentGenre = '', currentYear = '', currentCountry = '', currentSchedule = 'trending', currentLibMode = false;
        let isExpanded = false, globalFullDesc = "", globalEnDesc = "", currentIdx = 0;

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splashScreen').style.display = 'none';
                document.getElementById('mainProfile').style.display = 'block';
            }, 2800);
            initFilters(); initHighlights(); loadFeed(); 
        };

        function backToHome() {
            closeModal();
            currentLibMode = false; currentType = 'movie'; currentGenre = ''; currentYear = ''; currentCountry = ''; currentSchedule = 'trending';
            document.getElementById('btnCountry').innerText = 'Negara';
            document.getElementById('btnGenre').innerText = 'Genre';
            document.getElementById('yearBtn').innerText = 'Tahun';
            document.querySelectorAll('.btn-ig').forEach(b => b.classList.remove('active'));
            switchTab('grid', document.getElementById('tabGrid'));
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function initHighlights() {
            const hls = [{n:'Disney',com:'2|6125',l:'DSNY'},{n:'Pixar',com:'3',l:'PIXR'},{n:'Anime',g:16,l:'ANIM',c:'JP'},{n:'Indo',c:'ID',l:'INDO'},{n:'Korea',c:'KR',l:'KOR'}];
            const cont = document.getElementById('highlightList');
            hls.forEach(h => {
                const div = document.createElement('div');
                div.className = 'highlight-item';
                div.onclick = () => { currentCountry=h.c||''; currentGenre=h.g||''; loadFeed(true); };
                div.innerHTML = `<div class="highlight-circle"><span class="text-[10px] font-black">${h.l}</span></div><div class="highlight-text">${h.n}</div>`;
                cont.appendChild(div);
            });
        }

        function initFilters() {
            const genres = [[28,'Action'],[12,'Adventure'],[16,'Animasi'],[35,'Komedi'],[80,'Crime'],[18,'Drama'],[14,'Fantasy'],[27,'Horror'],[10749,'Romance'],[878,'Sci-Fi']];
            const gD = document.getElementById('genreDropdown');
            gD.innerHTML = '<div class="p-4 border-b border-zinc-800 text-center font-bold">Pilih Genre</div>' + 
                genres.map(g => `<div class="p-4 text-center border-b border-zinc-800 active:bg-zinc-800" onclick="setGenre('${g[0]}','${g[1]}')">${g[1]}</div>`).join('');
            
            const yD = document.getElementById('yearDropdown');
            let yrs = ''; for(let y=2026; y>=1990; y--) yrs += `<div class="p-4 text-center border-b border-zinc-800" onclick="setYear('${y}')">${y}</div>`;
            yD.innerHTML = yrs;
        }

        function toggleFilter(e, id) {
            e.stopPropagation();
            document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.getElementById('filterOverlay').style.display = 'block';
        }

        function closeD() {
            document.querySelectorAll('.filter-dropdown').forEach(d => d.style.display = 'none');
            document.getElementById('filterOverlay').style.display = 'none';
        }

        function setGenre(id, name) { currentGenre = id; document.getElementById('btnGenre').innerText = name; closeD(); loadFeed(true); }
        function setYear(y) { currentYear = y; document.getElementById('yearBtn').innerText = y; closeD(); loadFeed(true); }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            const grid = document.getElementById('feedGrid');
            if(isNew) { page = 1; grid.innerHTML = ''; }
            
            let endpoint = currentType === 'tv' ? 'discover/tv' : 'discover/movie';
            let url = `https://api.themoviedb.org/3/${endpoint}?api_key=${API_KEY}&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if(currentGenre) url += `&with_genres=${currentGenre}`;
            if(currentYear) url += currentType === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`;
            if(currentCountry) url += `&with_origin_country=${currentCountry}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                data.results.forEach(m => {
                    if(!m.poster_path) return;
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.onclick = () => openModal(m.id, currentType === 'short' ? 'movie' : currentType);
                    card.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                    grid.appendChild(card);
                });
            } catch(e) {}
            loading = false;
        }

        async function openModal(id, type) {
            window.currentMediaId = id; window.currentMediaType = type;
            document.getElementById('movieModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            const [rId, rCast] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=videos`),
                fetch(`https://api.themoviedb.org/3/${type}/${id}/credits?api_key=${API_KEY}`)
            ]);
            const dId = await rId.json(), dCast = await rCast.json();
            
            // Cast Story View
            document.getElementById('castContainer').innerHTML = dCast.cast.slice(0,10).map(c => `
                <div class="cast-item">
                    <div class="cast-img-border">
                        <div class="cast-img-inner">
                            <img src="${c.profile_path ? 'https://image.tmdb.org/t/p/w185'+c.profile_path : 'https://www.themoviedb.org/assets/2/v4/glyphicons/basic/glyphicons-basic-4-user-3245c3f3347706a035c9744ffaa5d174e48be3b860667e406723f3bc8160f47e.svg'}">
                        </div>
                    </div>
                    <span class="cast-name">${c.name}</span>
                </div>
            `).join('');

            document.getElementById('mTitle').innerText = dId.title || dId.name;
            document.getElementById('mLikeDisplay').innerText = `${Math.floor(dId.vote_average * 1000).toLocaleString()} suka`;
            globalFullDesc = dId.overview || "Sinopsis tidak tersedia dalam Bahasa Indonesia.";
            renderSynopsis();
            
            // Vid & Server
            const track = document.getElementById('carouselTrack');
            track.innerHTML = `<div class="min-w-full h-full"><iframe src="https://vidrock.net/embed/${type}/${id}${type==='tv'?'/1/1':''}" class="w-full h-full" allowfullscreen></iframe></div>`;
            document.getElementById('serverList').innerHTML = `<button class="btn-ig" onclick="playS('https://vidrock.net/embed/${type}/${id}')">Server 1</button><button class="btn-ig" onclick="playS('https://vidsrc.me/embed/${type}?tmdb=${id}')">Server 2</button>`;
            
            updateLibButtons(id);
        }

        function playS(url) { document.getElementById('carouselTrack').innerHTML = `<div class="min-w-full h-full"><iframe src="${url}" class="w-full h-full" allowfullscreen></iframe></div>`; }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function renderSynopsis() { const d = document.getElementById('mDesc'); d.innerText = isExpanded ? globalFullDesc : globalFullDesc.substring(0, 90); document.getElementById('mToggleBtn').style.display = globalFullDesc.length > 90 && !isExpanded ? 'inline' : 'none'; }
        function handleToggleDesc() { isExpanded = true; renderSynopsis(); }
        function toggleFilterBar() { document.getElementById('filterBar').classList.toggle('hidden'); }
        
        async function switchTab(mode, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if(mode !== 'grid') { document.getElementById('feedGrid').innerHTML = '<div class="col-span-3 text-center py-20 text-zinc-500 text-xs">Belum ada konten disimpan</div>'; }
            else { loadFeed(true); }
        }

        function updateLibButtons(id) {
            const isL = JSON.parse(localStorage.getItem('likes')||'[]').some(x=>x.id==id);
            document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart';
            document.getElementById('btnBookModal').className = 'fa-regular fa-bookmark';
        }

        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
