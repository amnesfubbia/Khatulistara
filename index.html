<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHATULISTARA — Ensiklopedia Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep: #0f3d2c;
    --green-dark: #0a2e21;
    --green-mid: #14523c;
    --gold: #c9a24b;
    --gold-soft: #ddbd77;
    --clay: #b5502f;
    --cream: #f7f1e3;
    --cream-2: #efe6d2;
    --card: #ffffff;
    --ink: #1c2420;
    --ink-soft: #4a5650;
    --muted: #8a9089;
    --line: #e8dfc9;
    --font-display: "Fraunces", serif;
    --font-body: "Work Sans", sans-serif;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ===== App shell / header ===== */
  .appheader{
    position:sticky; top:0; z-index:60;
    background:linear-gradient(160deg, var(--green-mid), var(--green-deep) 55%, var(--green-dark));
    border-radius:0 0 26px 26px;
    padding:18px 20px 26px;
    color:#fff;
    box-shadow:0 8px 24px rgba(10,46,33,0.25);
  }
  .appheader-row{display:flex; align-items:center; gap:12px;}
  .appheader-back{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.12); cursor:pointer; flex-shrink:0;
    font-size:16px; color:#fff; user-select:none;
  }
  .appheader-back:hover{background:rgba(255,255,255,0.2);}
  .brand{
    display:flex; align-items:center; gap:12px; cursor:pointer; flex:1; min-width:0;
  }
  .brand .logo-badge{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 70%);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 3px 10px rgba(0,0,0,0.25);
  }
  .brand .brand-text{min-width:0;}
  .brand .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:17px;
    letter-spacing:0.06em; color:#fff; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand .brand-sub{
    font-size:10.5px; color:var(--gold-soft); letter-spacing:0.03em; margin-top:1px;
  }
  .header-title{
    font-family:var(--font-body); font-weight:600; font-size:17px; color:#fff;
    flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-icon{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#fff; cursor:pointer;
  }
  .header-icon:hover{background:rgba(255,255,255,0.2);}
  .header-icon.active{background:var(--gold); color:var(--green-dark);}

  .searchwrap{
    position:relative; margin-top:16px;
  }
  .searchwrap input{
    width:100%;
    background:#fff;
    border:none;
    color:var(--ink);
    padding:13px 16px 13px 42px;
    border-radius:14px;
    font-family:var(--font-body);
    font-size:14px;
    outline:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
  }
  .searchwrap input::placeholder{color:var(--muted);}
  .searchwrap-icon{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    font-size:15px; color:var(--muted); pointer-events:none;
  }
  .searchresults{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    max-height:420px; overflow-y:auto;
    box-shadow:0 20px 40px rgba(0,0,0,0.18);
    display:none;
    z-index:70;
  }
  .searchresults.show{display:block;}
  .sr-item{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
  }
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:var(--cream);}
  .sr-item .sr-name{font-weight:600; font-size:14px; color:var(--ink);}
  .sr-item .sr-meta{font-size:12px; color:var(--muted);}

  /* ===== Page container ===== */
  .page{padding:18px 18px 24px; max-width:640px; margin:0 auto;}

  /* ===== Info card (home "Info Nusantara Hari Ini") ===== */
  .infocard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:0 4px 14px rgba(20,40,30,0.06);
  }
  .infocard .infocard-text{flex:1; min-width:0;}
  .infocard .infocard-date{font-size:11.5px; color:var(--clay); font-weight:600; margin-bottom:4px;}
  .infocard .infocard-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:0 0 6px; color:var(--ink);}
  .infocard .infocard-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 6px;}
  .infocard .infocard-link{font-size:12px; color:var(--green-deep); font-weight:600; cursor:pointer;}
  .infocard .infocard-icon{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(160deg, var(--cream-2), var(--gold-soft));
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }

  /* ===== Section headers ===== */
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin:26px 0 12px;
  }
  .section-head h3{
    font-family:var(--font-display); font-size:16.5px; font-weight:700; margin:0; color:var(--ink);
  }
  .section-head .see-all{font-size:12px; color:var(--green-deep); font-weight:600; cursor:pointer;}

  /* ===== Icon grid (home main menu) ===== */
  .icongrid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px 10px;
  }
  .icongrid-item{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    cursor:pointer; text-align:center;
  }
  .icongrid-item .icb{
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(160deg, var(--cream-2), var(--gold-soft));
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    box-shadow:0 4px 10px rgba(20,40,30,0.08);
    transition:transform .15s;
  }
  .icongrid-item:hover .icb{transform:translateY(-2px);}
  .icongrid-item .icb-label{font-size:11px; color:var(--ink-soft); font-weight:600; line-height:1.2;}

  /* ===== Bottom promo card ===== */
  .promocard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px 18px; display:flex; align-items:center; gap:14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(20,40,30,0.06);
  }
  .promocard .promocard-text{flex:1; min-width:0;}
  .promocard .promocard-title{font-family:var(--font-display); font-weight:700; font-size:14.5px; margin:0 0 4px; color:var(--ink);}
  .promocard .promocard-desc{font-size:12px; color:var(--ink-soft); line-height:1.45; margin:0;}
  .promocard .promocard-img{
    width:64px; height:56px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(160deg, var(--green-mid), var(--green-deep));
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }

  /* ===== Bottom nav bar ===== */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:80;
    background:#fff; border-top:1px solid var(--line);
    display:flex; padding:8px 6px 12px;
    box-shadow:0 -6px 18px rgba(0,0,0,0.06);
  }
  .bottomnav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; padding:4px 0; color:var(--muted);
  }
  .bottomnav-item .bn-icon{font-size:19px; line-height:1;}
  .bottomnav-item .bn-label{font-size:10.5px; font-weight:600;}
  .bottomnav-item.active{color:var(--green-deep);}

  /* ===== List view (Daftar Provinsi, Menu Utama, entry lists) ===== */
  .listwrap{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    overflow:hidden;
  }
  .listrow{
    display:flex; align-items:center; gap:13px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .listrow:last-child{border-bottom:none;}
  .listrow:hover{background:var(--cream);}
  .listrow .lr-icon{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    background:var(--cream-2);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .listrow .lr-text{flex:1; min-width:0;}
  .listrow .lr-title{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .listrow .lr-sub{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.3;}
  .listrow .lr-chev{color:var(--muted); font-size:16px; flex-shrink:0;}

  .searchbar-standalone{position:relative; margin-bottom:14px; display:flex; gap:10px;}
  .searchbar-standalone input{
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--ink);
    padding:12px 16px 12px 40px; border-radius:14px; font-family:var(--font-body); font-size:14px; outline:none;
  }
  .searchbar-standalone input:focus{border-color:var(--gold);}
  .searchbar-standalone .sbs-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted);}
  .filterbtn{
    width:44px; height:44px; border-radius:14px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-soft); cursor:pointer; flex-shrink:0;
  }

  .filterbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .pill{
    padding:7px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:500;
  }
  .pill.active{border-color:var(--green-deep); color:#fff; background:var(--green-deep);}

  .empty{color:var(--muted); font-size:13px; padding:30px 0; text-align:center;}

  /* ===== Detail hero (province / entry) ===== */
  .detailhero{
    position:relative; height:190px; border-radius:var(--radius-md); overflow:hidden;
    background:linear-gradient(150deg, #7c9c8a, var(--green-mid) 60%, var(--green-dark));
    display:flex; align-items:flex-end; padding:16px;
    margin-bottom:0;
  }
  .detailhero .dh-loc{
    color:#fff; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; font-weight:600;
    position:absolute; top:14px; left:18px;
  }
  .detailhero .dh-icon{font-size:70px; opacity:.9; margin:0 auto;}

  .detailcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
    margin-top:-30px; position:relative; z-index:5; padding:18px 18px 6px;
    box-shadow:0 8px 24px rgba(20,40,30,0.1);
  }
  .detailcard-top{display:flex; align-items:flex-start; gap:14px; margin-bottom:14px;}
  .detailcard-badge{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(160deg, var(--cream-2), var(--gold-soft));
    display:flex; align-items:center; justify-content:center; font-size:26px;
    box-shadow:0 4px 10px rgba(20,40,30,0.1);
  }
  .detailcard-name{font-family:var(--font-display); font-size:21px; font-weight:700; margin:0 0 4px; color:var(--ink);}
  .detailcard-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

  .tabbar{display:flex; gap:8px; margin:14px 0 16px; flex-wrap:wrap;}
  .tabbtn{
    padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer;
    background:var(--cream); color:var(--ink-soft); border:1px solid var(--line);
  }
  .tabbtn.active{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}

  .statrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0;}
  .statcell{
    background:var(--cream); border-radius:var(--radius-sm); padding:12px 8px; text-align:center;
  }
  .statcell .sc-val{font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--ink);}
  .statcell .sc-lbl{font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.3;}

  .fieldrow{
    border-top:1px solid var(--line);
    padding:14px 0;
  }
  .fieldrow:first-child{border-top:none;}
  .fieldrow .flabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:5px;}
  .fieldrow .fval{font-size:14px; line-height:1.65; color:var(--ink);}
  .fieldrow .fval ul{margin:0; padding-left:18px;}

  .related{margin:18px 0 20px;}
  .related .flabel{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:8px;}
  .tag{
    display:inline-block; background:var(--cream); border:1px solid var(--line);
    color:var(--ink-soft); font-size:12px; padding:6px 12px; border-radius:16px; margin:0 6px 6px 0; cursor:pointer;
  }
  .tag:hover{border-color:var(--gold); color:var(--clay);}

  .iconlabel-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 18px;}
  .iconlabel-card{background:var(--cream); border-radius:var(--radius-sm); overflow:hidden; cursor:pointer;}
  .iconlabel-card .ilc-img{
    height:64px; background:linear-gradient(150deg, var(--green-mid), var(--gold-soft));
    display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff;
  }
  .iconlabel-card .ilc-cap{padding:7px 8px; font-size:10.5px; font-weight:600; color:var(--ink); line-height:1.3;}

  /* ===== Views (screen switching, kept from original architecture) ===== */
  .view{display:none;}
  .view.active{display:block;}
  .crumb{display:none;} /* replaced by header back-button pattern */

  footer{
    text-align:center; padding:20px 18px 10px; color:var(--muted); font-size:11.5px;
  }
  footer .motto{font-family:var(--font-display); font-style:italic; color:var(--clay); font-size:13px; margin-bottom:5px;}
  /* ===== SVG icon sizing/coloring ===== */
  svg{display:block;}
  .logo-badge{color:var(--green-deep);} .logo-badge svg{width:22px; height:22px;}
  .header-icon{color:#fff;} .header-icon svg{width:17px; height:17px;}
  .appheader-back svg{width:19px; height:19px;}
  .searchwrap-icon svg{width:16px; height:16px;}
  .sbs-icon svg{width:15px; height:15px;}
  .infocard-icon{color:var(--green-deep);} .infocard-icon svg{width:26px; height:26px;}
  .icb{color:var(--green-deep);} .icb svg{width:25px; height:25px;}
  .promocard-img{color:#fff;} .promocard-img svg{width:26px; height:26px;}
  .bn-icon svg{width:20px; height:20px; margin:0 auto;}
  .lr-icon{color:var(--green-deep);} .lr-icon svg{width:20px; height:20px;}
  .lr-chev{color:var(--muted); display:flex; align-items:center;} .lr-chev svg{width:16px; height:16px;}
  .detailcard-badge{color:var(--green-deep);} .detailcard-badge svg{width:27px; height:27px;}
  .dh-icon{color:rgba(255,255,255,0.92);} .dh-icon svg{width:60px; height:60px;}
  .ilc-img{color:#fff;} .ilc-img svg{width:22px; height:22px;}
</style>
</head>
<body>

<!-- ===================== HEADER (dynamic: home vs sub-page) ===================== -->
<div class="appheader" id="appHeader">
  <div class="appheader-row" id="appHeaderRow">
    <div class="brand" onclick="goHome()" id="brandBlock">
      <div class="logo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6M12 4v3"/></svg></div>
      <div class="brand-text">
        <div class="brand-title">KHATULISTARA</div>
        <div class="brand-sub">Ensiklopedia Nusantara</div>
      </div>
    </div>
    <div class="header-icon" title="Notifikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
  </div>
  <div class="searchwrap" id="headerSearchWrap">
    <span class="searchwrap-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
    <input id="searchInput" type="text" placeholder="Cari di Khatulistara..." autocomplete="off">
    <div class="searchresults" id="searchResults"></div>
  </div>
</div>

<!-- ===================== HOME ===================== -->
<div id="view-home" class="view active">
  <div class="page">
    <div class="infocard">
      <div class="infocard-text">
        <div class="infocard-date" id="todayDate">Info Nusantara Hari Ini</div>
        <div class="infocard-title" id="todayTitle"></div>
        <p class="infocard-desc" id="todayDesc"></p>
        <div class="infocard-link">Selengkapnya</div>
      </div>
      <div class="infocard-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11.5A7 7 0 0 1 19 9.5C19 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg></div>
    </div>

    <div class="section-head"><h3>Menu Utama</h3><span class="see-all" onclick="openAllMenus()">Lihat Semua</span></div>
    <div class="icongrid" id="menuGrid"></div>

    <div class="section-head"><h3>Pilihan Untukmu</h3></div>
    <div class="promocard" id="provQuick"></div>
  </div>
</div>

<!-- ===================== ALL MENUS LIST ===================== -->
<div id="view-allmenus" class="view">
  <div class="page">
    <div class="listwrap" id="allMenusList"></div>
  </div>
</div>

<!-- ===================== MENU VIEWS (entry lists) ===================== -->
<div id="view-menu" class="view">
  <div class="page">
    <div class="searchbar-standalone">
      <span class="sbs-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input type="text" placeholder="Cari..." disabled>
      <div class="filterbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.5a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H4.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1-1.55V4.5a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10c.14.42.44.77.83 1"/></svg></div>
    </div>
    <div class="filterbar" id="menuFilters"></div>
    <div class="listwrap" id="menuEntries"></div>
  </div>
</div>

<!-- ===================== ENTRY DETAIL ===================== -->
<div id="view-entry" class="view">
  <div class="page">
    <div class="detailhero"><div class="dh-icon" id="entryHeroIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17z"/><path d="M20 19H6.5A2.5 2.5 0 0 0 4 21.5"/></svg></div></div>
    <div class="detailcard" id="entryDetail"></div>
  </div>
</div>

<!-- ===================== PROVINCE PAGE ===================== -->
<div id="view-province" class="view">
  <div class="page">
    <div id="provinceBody"></div>
  </div>

/* =========================================================================
   HELPERS — build a flat searchable index & simple render engine
   ========================================================================= */

function buildIndex(){
  const idx = [];
  PROVINSI.forEach(p=>idx.push({type:'Provinsi', menu:'peta', name:p.nama, meta:p.ibukota, ref:{kind:'province', id:p.id}}));
  GEOGRAFI.gunung.forEach(e=>idx.push({type:'Gunung', menu:'peta', name:e.nama, meta:e.ketinggian, ref:{kind:'entry', group:'gunung', id:e.id}}));
  GEOGRAFI.danau.forEach(e=>idx.push({type:'Danau', menu:'peta', name:e.nama, meta:e.lokasi, ref:{kind:'entry', group:'danau', id:e.id}}));
  GEOGRAFI.tamanNasional.forEach(e=>idx.push({type:'Taman Nasional', menu:'peta', name:e.nama, meta:e.lokasi, ref:{kind:'entry', group:'tamanNasional', id:e.id}}));
  GEOGRAFI.pantai.forEach(e=>idx.push({type:'Pantai & Pesisir', menu:'peta', name:e.nama, meta:e.lokasi, ref:{kind:'entry', group:'pantai', id:e.id}}));
  GEOGRAFI.situsSejarah.forEach(e=>idx.push({type:'Situs Sejarah & Bangunan', menu:'peta', name:e.nama, meta:e.lokasi, ref:{kind:'entry', group:'situsSejarah', id:e.id}}));
  GEOGRAFI.tempatIbadah.forEach(e=>idx.push({type:'Tempat Ibadah & Warisan Religi', menu:'peta', name:e.nama, meta:e.jenisIbadah, ref:{kind:'entry', group:'tempatIbadah', id:e.id}}));
  GEOGRAFI.floraFauna.forEach(e=>idx.push({type:'Flora & Fauna Identitas', menu:'peta', name:e.nama, meta:e.jenisFF, ref:{kind:'entry', group:'floraFauna', id:e.id}}));
  GEOGRAFI.jalurRempah.forEach(e=>idx.push({type:'Jalur Rempah Nusantara', menu:'peta', name:e.nama, meta:e.kategori, ref:{kind:'entry', group:'jalurRempah', id:e.id}}));
  KULINER.makananBerat.forEach(e=>idx.push({type:'Makanan Berat', menu:'peta', name:e.nama, meta:e.daerah||provName(e.provinsi), ref:{kind:'entry', group:'makananBerat', id:e.id}}));
  KULINER.jajanan.forEach(e=>idx.push({type:'Jajanan', menu:'peta', name:e.nama, meta:e.daerah||provName(e.provinsi), ref:{kind:'entry', group:'jajanan', id:e.id}}));
  KULINER.minuman.forEach(e=>idx.push({type:'Minuman', menu:'peta', name:e.nama, meta:e.daerah||provName(e.provinsi), ref:{kind:'entry', group:'minuman', id:e.id}}));
  SEJARAH.kerajaan.forEach(e=>idx.push({type:'Kerajaan', menu:'lorong', name:e.nama, meta:e.periode, ref:{kind:'entry', group:'kerajaan', id:e.id}}));
  SEJARAH.tokoh.forEach(e=>idx.push({type:'Tokoh', menu:'lorong', name:e.nama, meta:e.kategori, ref:{kind:'entry', group:'tokoh', id:e.id}}));

let currentMenu = null, currentFilter = 'Semua';

function openMenu(menuId){
  currentMenu = menuId; currentFilter = 'Semua';
  showView('view-menu');
  const m = MENUS.find(x=>x.id===menuId);
  setHeader({mode:'sub', title:m.name});
  renderMenuEntries();
  pushNavState({view:'menu', menuId});
}


function renderMenuEntries(){
  const items = MENU_GROUPS[currentMenu].getItems();
  const cats = ['Semua', ...new Set(items.map(i=>i.cat))];
  document.getElementById('menuFilters').innerHTML = cats.map(c=>`
    <div class="pill ${c===currentFilter?'active':''}" onclick="setFilter('${c}')">${c}</div>`).join('');

  const filtered = currentFilter==='Semua' ? items : items.filter(i=>i.cat===currentFilter);
  const list = document.getElementById('menuEntries');
  if(filtered.length===0){
    list.innerHTML = '<div class="empty">Belum ada entri pada kategori ini.</div>';
    return;
  }
  list.innerHTML = filtered.map(i=>{
    const onclick = i.kind==='province' ? `openProvince('${i.id}')` : `openEntry('${i.group}','${i.id}')`;
    return `<div class="listrow" onclick="${onclick}">
      <div class="lr-icon">${ic('book')}</div>
      <div class="lr-text"><div class="lr-title">${i.nama}</div><div class="lr-sub">${i.cat}${i.meta ? ' · '+i.meta : ''}</div></div>
      <div class="lr-chev">${ic('chevron')}</div>
    </div>`;
  }).join('');
}
function setFilter(c){ currentFilter = c; renderMenuEntries(); }

  const e = findEntry(group,id);
  if(!e) return;
  showView('view-entry');
  const menuId = Object.keys(MENU_GROUPS).find(k => MENU_GROUPS[k].getItems().some(i=>i.group===group));
  const menuName = menuId ? MENUS.find(m=>m.id===menuId).name : '';
  const entryTitle = e.nama || e.kata || e.bentuk || e.singkatan || e.teks;
  setHeader({mode:'sub', title:entryTitle});

  const fields = [];
  const catLabel = {
    kerajaan:'Kerajaan', tokoh:'Tokoh', presiden:'Presiden', prasasti:'Prasasti & Manuskrip', agama:'Sejarah Agama',
    prasejarah:'Prasejarah', kolonialisme:'Kolonialisme', perlawanan:'Perlawanan Daerah', pergerakan:'Pergerakan Nasional',
    kemerdekaan:'Kemerdekaan', pascaKemerdekaan:'Indonesia Pasca Kemerdekaan', kabinet:'Kabinet Indonesia', wakilPresiden:'Wakil Presiden',
    tari:'Tari Tradisional', alatMusik:'Alat Musik', wastra:'Wastra', wayang:'Wayang & Seni Pertunjukan', permainan:'Permainan Tradisional',
    suku:'Suku & Masyarakat Adat', legenda:'Legenda', upacara:'Upacara Adat', kepercayaan:'Kepercayaan Lokal',
    kamus:'Kamus', peribahasa:'Peribahasa', bahasaDaerah:'Bahasa Daerah', sastra:'Sastra Nusantara', aksara:'Aksara Nusantara',
    pancasila:'Pancasila', nomorPenting:'Nomor Penting', mataUang:'Mata Uang', kalender:'Kalender',
    gunung:'Gunung', danau:'Danau & Sungai', tamanNasional:'Taman Nasional & Kawasan Konservasi',
    pantai:'Pantai & Pesisir', situsSejarah:'Situs Sejarah & Bangunan Bersejarah', tempatIbadah:'Tempat Ibadah & Warisan Religi',
    floraFauna:'Flora & Fauna Identitas', jalurRempah:'Jalur Rempah Nusantara',
    makananBerat:'Makanan Berat', jajanan:'Jajanan Tradisional', minuman:'Minuman Tradisional',
    konstitusi:'Konstitusi', simbol:'Simbol Negara', pramukaMateri:'Pramuka', sandiPramuka:'Sandi Pramuka', taliTemali:'Tali-Temali',
    bandara:'Bandara', singkatan:'Singkatan & Istilah'
  }[group];

  const title = e.nama || e.kata || e.bentuk || e.singkatan || e.teks;
  const loc = e.lokasi || e.wilayah || e.asal || e.daerah || provName(e.provinsi) || '';

  if(e.ringkasan || e.arti || e.makna || e.penjelasan){
    fields.push(['Ringkasan', e.ringkasan || e.arti || e.makna || e.penjelasan]);
  }
  if(e.fakta && Array.isArray(e.fakta)){
    fields.push(['Fakta Penting', '<ul>'+e.fakta.map(f=>`<li>${f}</li>`).join('')+'</ul>']);
  }
  if(e.pimpinan) fields.push(['Pimpinan', e.pimpinan]);
  if(e.teks && group==='sastra') fields.push(['Teks', e.teks]);
  if(e.periode) fields.push(['Periode', e.periode]);
  if(e.tipe) fields.push(['Jenis', e.tipe]);
  if(e.tokoh) fields.push(['Tokoh Utama', e.tokoh]);
  if(e.peninggalan) fields.push(['Peninggalan', e.peninggalan]);
  if(e.kategori) fields.push(['Kategori', e.kategori]);
  if(e.jabatan) fields.push(['Jabatan', e.jabatan]);
  if(e.bahan) fields.push(['Bahan', e.bahan]);
  if(e.caraMain) fields.push(['Cara Memainkan', e.caraMain]);
  if(e.teknik) fields.push(['Teknik', e.teknik]);
  if(e.jenis) fields.push(['Jenis Upacara', e.jenis]);
  if(e.kelas) fields.push(['Kelas Kata', e.kelas]);

  if(e.penutur) fields.push(['Wilayah Penutur', e.penutur]);
  if(e.keunikan) fields.push(['Keunikan', e.keunikan]);
  if(e.lambang) fields.push(['Lambang', e.lambang]);
  if(e.nomor) fields.push(['Nomor', e.nomor]);
  if(e.kode) fields.push(['Kode', e.kode]);
  if(e.fungsi) fields.push(['Fungsi', e.fungsi]);
  if(e.sistem) fields.push(['Sistem', e.sistem]);
  if(e.ketinggian) fields.push(['Ketinggian', e.ketinggian]);
  if(e.status) fields.push(['Status', e.status]);
  if(e.ekosistem) fields.push(['Ekosistem', e.ekosistem]);
  if(e.luas) fields.push(['Luas', e.luas]);
  if(e.bahanUtama) fields.push(['Bahan Utama', e.bahanUtama]);
  if(e.daerah) fields.push(['Daerah', e.daerah]);
  if(e.aksara) fields.push(['Aksara/Bahasa', e.aksara]);

        <span class="tag" onclick="openProvince('${e.provinsi}')">Provinsi ${provName(e.provinsi)}</span>

  pushNavState({view:'entry', group, id});
}

/* =========================================================================
   RENDER — province page
   ========================================================================= */
function openProvince(id){
  const p = PROVINSI.find(x=>x.id===id);
  if(!p) return;
  showView('view-province');
  setHeader({mode:'sub', title:p.nama, star:true});

  const relatedTari = SENI.tari.filter(t=>t.provinsi===id);
  const relatedSuku = PUSTAKA.suku.filter(s=>s.provinsi===id);
  const relatedTokoh = SEJARAH.tokoh.filter(t=>t.provinsi===id);
  const relatedKerajaan = SEJARAH.kerajaan.filter(k=>k.provinsi===id);
  const relatedUpacara = PUSTAKA.upacara.filter(u=>u.provinsi===id);
  const relatedGunung = GEOGRAFI.gunung.filter(g=>g.provinsi===id);
  const relatedDanau = GEOGRAFI.danau.filter(d=>d.provinsi===id);
  const relatedTN = GEOGRAFI.tamanNasional.filter(t=>t.provinsi===id);
  const relatedPantai = GEOGRAFI.pantai.filter(p=>p.provinsi===id);
  const relatedSitus = GEOGRAFI.situsSejarah.filter(s=>s.provinsi===id);
  const relatedIbadah = GEOGRAFI.tempatIbadah.filter(t=>t.provinsi===id);
  const relatedFF = GEOGRAFI.floraFauna.filter(f=>f.provinsi===id);
  const relatedMakanan = [...KULINER.makananBerat, ...KULINER.jajanan, ...KULINER.minuman].filter(k=>k.provinsi===id);
  const relatedWayang = SENI.wayang.filter(w=>w.provinsi===id);
  const relatedKepercayaan = PUSTAKA.kepercayaan.filter(k=>k.provinsi===id);

  const blocks = [
    ['Rumah Adat', p.rumahAdat], ['Pakaian Adat', p.pakaianAdat], ['Senjata Tradisional', p.senjata],
    ['Tari', p.tari], ['Makanan Khas', p.makanan], ['Suku', p.suku],
  ].filter(b=>b[1]);

  const tags = [
    ...relatedTari.map(t=>({label:'Tari '+t.nama, fn:`openEntry('tari','${t.id}')`})),
    ...relatedSuku.map(s=>({label:'Suku '+s.nama, fn:`openEntry('suku','${s.id}')`})),
    ...relatedTokoh.map(t=>({label:'Tokoh '+t.nama, fn:`openEntry('tokoh','${t.id}')`})),
    ...relatedKerajaan.map(k=>({label:'Kerajaan '+k.nama, fn:`openEntry('kerajaan','${k.id}')`})),
    ...relatedUpacara.map(u=>({label:'Upacara '+u.nama, fn:`openEntry('upacara','${u.id}')`})),
    ...relatedGunung.map(g=>({label:'Gunung '+g.nama, fn:`openEntry('gunung','${g.id}')`})),
    ...relatedDanau.map(d=>({label:'Danau '+d.nama, fn:`openEntry('danau','${d.id}')`})),
    ...relatedTN.map(t=>({label:t.nama, fn:`openEntry('tamanNasional','${t.id}')`})),
    ...relatedPantai.map(p=>({label:p.nama, fn:`openEntry('pantai','${p.id}')`})),
    ...relatedSitus.map(s=>({label:s.nama, fn:`openEntry('situsSejarah','${s.id}')`})),
    ...relatedIbadah.map(t=>({label:t.nama, fn:`openEntry('tempatIbadah','${t.id}')`})),
    ...relatedFF.map(f=>({label:f.nama, fn:`openEntry('floraFauna','${f.id}')`})),
    ...relatedMakanan.map(k=>({label:k.nama, fn:`openEntry('${KULINER.makananBerat.includes(k)?'makananBerat':(KULINER.jajanan.includes(k)?'jajanan':'minuman')}','${k.id}')`})),
    ...relatedWayang.map(w=>({label:w.nama, fn:`openEntry('wayang','${w.id}')`})),
    ...relatedKepercayaan.map(k=>({label:k.nama, fn:`openEntry('kepercayaan','${k.id}')`})),
  ];

  const sukuCount = (p.suku||'').split(',').length;
  const wisataCount = (p.wisata||[]).length;
  const faktaCount = (p.fakta||[]).length;

  const panelProfil = `
    <p style="font-family:var(--font-display); font-style:italic; color:var(--clay); font-size:13.5px; margin:0 0 10px;">"${p.semboyan||''}"</p>
    <p style="font-size:13.5px; line-height:1.65; color:var(--ink-soft); margin:0 0 4px;">
      ${p.nama} adalah salah satu provinsi Indonesia di Pulau ${p.pulau}. Provinsi ini beribu kota di ${p.ibukota} dengan luas wilayah ${p.luas} dan berada di zona waktu ${p.zonaWaktu}.
    </p>
    <div class="statrow">
      <div class="statcell"><div class="sc-val">${sukuCount}</div><div class="sc-lbl">Suku/Etnis</div></div>
      <div class="statcell"><div class="sc-val">${faktaCount}</div><div class="sc-lbl">Fakta Unik</div></div>
      <div class="statcell"><div class="sc-val">${wisataCount}</div><div class="sc-lbl">Destinasi Wisata</div></div>
    </div>
    <div class="fieldrow" style="border-top:none; padding-top:0;">
      <div class="flabel">Fakta Unik</div>
      <div class="fval"><ul>${(p.fakta||[]).map(f=>`<li>${f}</li>`).join('')}</ul></div>
    </div>`;

  const panelBudaya = blocks.map(([l,v])=>`
      <div class="fieldrow"><div class="flabel">${l}</div><div class="fval">${v}</div></div>`).join('');

  const sejarahItems = [...relatedKerajaan.map(k=>({nama:k.nama, sub:k.periode||'', fn:`openEntry('kerajaan','${k.id}')`})),
                         ...relatedTokoh.map(t=>({nama:t.nama, sub:t.periode||t.kategori||'', fn:`openEntry('tokoh','${t.id}')`}))];
  const panelSejarah = sejarahItems.length ? `
    <div class="listwrap" style="margin-top:2px;">
      ${sejarahItems.map(s=>`<div class="listrow" onclick="${s.fn}">
        <div class="lr-icon">${ic('clock')}</div>
        <div class="lr-text"><div class="lr-title">${s.nama}</div><div class="lr-sub">${s.sub}</div></div>
        <div class="lr-chev">${ic('chevron')}</div>
      </div>`).join('')}
    </div>` : `<div class="empty">Belum ada data sejarah spesifik tercatat untuk provinsi ini.</div>`;

  const panelPariwisata = `
    <div class="fieldrow" style="border-top:none; padding-top:0;">
      <div class="flabel">Destinasi Wisata</div>
      <div class="fval"><ul>${(p.wisata||[]).map(f=>`<li>${f}</li>`).join('')}</ul></div>
    </div>
    ${(p.wisata||[]).length ? `<div class="section-head" style="margin:10px 0 8px;"><h3 style="font-size:14px;">Ikon Daerah</h3></div>
    <div class="iconlabel-row">
      ${p.wisata.map(w=>`<div class="iconlabel-card"><div class="ilc-img">${ic('pin')}</div><div class="ilc-cap">${w}</div></div>`).join('')}
    </div>` : ''}`;

  document.getElementById('provinceBody').innerHTML = `
    <div class="detailhero"><div class="dh-loc">PULAU ${(p.pulau||'').toUpperCase()}</div><div class="dh-icon">${ic('mountain')}</div></div>
    <div class="detailcard">
      <div class="detailcard-top">
        <div class="detailcard-badge">${ic('shield')}</div>
        <div>
          <div class="detailcard-name">${p.nama}</div>
          <div class="detailcard-meta">Ibu Kota: ${p.ibukota}<br>Luas: ${p.luas}<br>Zona Waktu: ${p.zonaWaktu}</div>
        </div>
      </div>
      <div class="tabbar" id="provTabbar">
        <div class="tabbtn active" onclick="provTab('profil')">Profil</div>
        <div class="tabbtn" onclick="provTab('sejarah')">Sejarah</div>
        <div class="tabbtn" onclick="provTab('budaya')">Budaya</div>
        <div class="tabbtn" onclick="provTab('pariwisata')">Pariwisata</div>
      </div>
      <div id="provPanel-profil" class="provpanel">${panelProfil}</div>
      <div id="provPanel-sejarah" class="provpanel" style="display:none;">${panelSejarah}</div>
      <div id="provPanel-budaya" class="provpanel" style="display:none;">${panelBudaya}</div>
      <div id="provPanel-pariwisata" class="provpanel" style="display:none;">${panelPariwisata}</div>
      ${tags.length ? `<div class="related">
        <div class="flabel">Data Terkait</div>
        ${tags.map(t=>`<span class="tag" onclick="${t.fn}">${t.label}</span>`).join('')}
      </div>` : ''}
    </div>
  `;
  pushNavState({view:'province', id});
}

function provTab(name){
  ['profil','sejarah','budaya','pariwisata'].forEach(t=>{
    document.getElementById('provPanel-'+t).style.display = t===name ? 'block' : 'none';
  });
  document.querySelectorAll('#provTabbar .tabbtn').forEach(btn=>btn.classList.remove('active'));
  const idx = {profil:0,sejarah:1,budaya:2,pariwisata:3}[name];
  document.querySelectorAll('#provTabbar .tabbtn')[idx].classList.add('active');
}

/* =========================================================================
   VIEW SWITCH + SEARCH
   ========================================================================= */
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('searchResults').classList.remove('show');
}

function setHeader(opts){
  const row = document.getElementById('appHeaderRow');
  const searchWrap = document.getElementById('headerSearchWrap');
  document.querySelectorAll('.bottomnav-item').forEach(x=>x.classList.remove('active'));
  if(opts.mode === 'home'){
    row.innerHTML = `
      <div class="brand" onclick="goHome()">
        <div class="logo-badge">${ic('logo')}</div>
        <div class="brand-text">
          <div class="brand-title">KHATULISTARA</div>
          <div class="brand-sub">Ensiklopedia Nusantara</div>
        </div>
      </div>
      <div class="header-icon" title="Notifikasi">${ic('bell')}</div>`;
    searchWrap.style.display = '';
    document.getElementById('navBeranda').classList.add('active');
  } else {
    row.innerHTML = `
      <div class="appheader-back" onclick="if(history.length>1){history.back();}else{goHome();}">${ic('back')}</div>
      <div class="header-title">${opts.title||''}</div>
      ${opts.star ? '<div class="header-icon">'+ic('star')+'</div>' : '<div style="width:36px;flex-shrink:0;"></div>'}`;
    searchWrap.style.display = 'none';
    document.getElementById('navKoleksi').classList.add('active');
  }
}

function focusSearch(){
  goHome();
  setTimeout(()=>document.getElementById('searchInput').focus(), 250);
}

/* ---- History / back-button handling ----
   Every navigation (home, menu, entry, province) pushes a history state.
   The phone's back button and any in-app back link both resolve through
   the same popstate handler, so navigation always steps back one level
   instead of jumping out of the app or skipping levels. */
let __isPopping = false;

function pushNavState(state){
  if(__isPopping) return;
  const hash = state.view==='home' ? '#home'
    : state.view==='menu' ? '#menu/'+state.menuId
    : state.view==='entry' ? '#entry/'+state.group+'/'+state.id
    : state.view==='province' ? '#province/'+state.id
    : state.view==='allmenus' ? '#allmenus'
    : state.view==='provinsilist' ? '#provinsilist'
    : '#home';
  try{
    history.pushState(state, '', hash);
  }catch(err){
    /* Some sandboxed preview environments (e.g. srcdoc iframes) block
       History API URL changes. Fail silently — in-app navigation still
       works via showView(); only the browser back-button integration
       is unavailable in that specific environment. */
  }
}

window.addEventListener('popstate', (e)=>{
  __isPopping = true;
  const state = e.state || {view:'home'};
  if(state.view==='menu') openMenu(state.menuId);
  else if(state.view==='entry') openEntry(state.group, state.id);
  else if(state.view==='province') openProvince(state.id);
  else if(state.view==='allmenus') openAllMenus();
  else if(state.view==='provinsilist') openProvinsiList();
  else goHome();
  __isPopping = false;
});

function goHome(){ showView('view-home'); setHeader({mode:'home'}); document.getElementById('searchInput').value=''; pushNavState({view:'home'}); }

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(q.length < 1){ searchResults.classList.remove('show'); return; }
  const results = SEARCH_INDEX.filter(i => i.name.toLowerCase().includes(q) || (i.meta||'').toLowerCase().includes(q)).slice(0,12);
  if(results.length===0){
    searchResults.innerHTML = '<div class="sr-item"><span class="sr-meta">Tidak ada hasil untuk "'+q+'"</span></div>';
  } else {
    searchResults.innerHTML = results.map(r=>`
      <div class="sr-item" onclick='selectResult(${JSON.stringify(r.ref)})'>
        <span class="sr-name">${r.name}</span>
        <span class="sr-meta">${r.type}${r.meta ? ' · '+r.meta : ''}</span>
      </div>`).join('');
  }
  searchResults.classList.add('show');
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.searchwrap')) searchResults.classList.remove('show');
});

function selectResult(ref){
  if(ref.kind==='province') openProvince(ref.id);
  else openEntry(ref.group, ref.id);
}

renderHome();
try{ history.replaceState({view:'home'}, '', '#home'); }catch(err){ /* see pushNavState note */ }
</script>
