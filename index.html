  upacara:[
    {id:'ngaben', nama:'Ngaben', provinsi:'bali', jenis:'Kematian', ringkasan:'Upacara kremasi khas Bali yang dipercaya membebaskan roh dari ikatan duniawi menuju alam berikutnya; biaya upacara ini bisa sangat besar sehingga sebagian keluarga menggelar Ngaben massal untuk berbagi biaya.',
     fakta:['Biaya upacara Ngaben bisa sangat besar sehingga sebagian keluarga menggelar Ngaben massal untuk berbagi biaya','Jenazah kadang dikuburkan sementara sebelum upacara Ngaben resmi digelar bertahun-tahun kemudian']},
    {id:'rambusolo', nama:'Rambu Solo', provinsi:'sulsel', jenis:'Kematian', ringkasan:'Upacara pemakaman adat Toraja yang megah dan berbiaya besar, melibatkan penyembelihan kerbau sebagai bekal roh menuju alam baka; semakin tinggi status sosial keluarga, semakin banyak kerbau yang dikorbankan.',
     fakta:['Semakin tinggi status sosial keluarga, semakin banyak kerbau yang harus dikorbankan dalam upacara ini','Upacara ini bisa berlangsung hingga berhari-hari dan mengundang seluruh kerabat dari berbagai daerah']},
    {id:'serentaun', nama:'Seren Taun', provinsi:'jabar', jenis:'Panen', ringkasan:'Upacara adat Sunda sebagai ungkapan syukur atas hasil panen padi sepanjang tahun, biasa digelar sebagai wujud syukur kepada Dewi Sri dengan arak-arakan hasil bumi dan pertunjukan kesenian tradisional.',
     fakta:['Digelar setelah musim panen padi selesai sebagai wujud syukur kepada Dewi Sri','Melibatkan arak-arakan hasil bumi dan pertunjukan kesenian tradisional Sunda']},
    {id:'kasada', nama:'Kasada', provinsi:'jatim', jenis:'Keagamaan/adat', ringkasan:'Upacara masyarakat Tengger di Gunung Bromo, melarungkan hasil bumi ke kawah sebagai persembahan kepada leluhur, digelar setiap bulan Kasada menurut penanggalan tradisional suku Tengger.',
     fakta:['Sesaji yang dilarungkan ke kawah Bromo biasanya berupa hasil bumi, ternak, hingga uang','Digelar setiap bulan Kasada menurut penanggalan tradisional suku Tengger']},
    {id:'tabotswara', nama:'Tabot', provinsi:'bengkulu', jenis:'Keagamaan', ringkasan:'Upacara peringatan wafatnya cucu Nabi Muhammad, Husein bin Ali, di Karbala, dirayakan masyarakat keturunan India-Bengkulu dengan arak-arakan tabot (replika makam) yang meriah setiap bulan Muharram.',
     fakta:['Berasal dari tradisi Syiah yang dibawa oleh imigran India ke Bengkulu pada abad ke-19','Puncak perayaannya adalah pembuangan tabot ke laut sebagai simbol pelepasan dan pemakaman simbolis']},
    {id:'tiwah', nama:'Tiwah', provinsi:'kalteng', jenis:'Kematian', ringkasan:'Upacara kematian besar suku Dayak Ngaju penganut Kaharingan, bertujuan mengantarkan roh orang yang telah meninggal menuju alam baka (Lewu Tatau), melibatkan penggalian kembali tulang jenazah untuk dipindahkan ke sandung.',
     fakta:['Melibatkan penggalian kembali tulang jenazah yang telah lama dikuburkan untuk dipindahkan ke tempat khusus (sandung)','Bisa memakan biaya besar sehingga sering digelar secara massal untuk beberapa keluarga sekaligus']},
    {id:'sekaten', nama:'Sekaten', provinsi:'yogyakarta', jenis:'Keagamaan/adat', ringkasan:'Upacara adat Keraton Yogyakarta dan Surakarta memperingati Maulid Nabi Muhammad, ditandai dengan dikeluarkannya gamelan pusaka keraton (Kanjeng Kyai Sekati) yang hanya dimainkan setahun sekali.',
     fakta:['Gamelan pusaka keraton hanya dikeluarkan dan dimainkan setahun sekali khusus untuk upacara ini','Puncak acara ditandai dengan Grebeg Maulud, arak-arakan gunungan hasil bumi dari keraton']},
    {id:'nyepi', nama:'Nyepi', provinsi:'bali', jenis:'Keagamaan', ringkasan:'Hari raya umat Hindu Bali menyambut tahun baru Saka, dirayakan dengan keheningan total selama 24 jam (catur brata penyepian) — tanpa aktivitas, tanpa cahaya, dan tanpa keramaian di seluruh Pulau Bali.',
     fakta:['Seluruh aktivitas termasuk penerbangan di Bandara Ngurah Rai dihentikan total selama 24 jam','Sehari sebelum Nyepi digelar pawai ogoh-ogoh, patung raksasa simbol kejahatan yang diarak lalu dibakar']},
    {id:'grebekmaulud', nama:'Grebeg Maulud', provinsi:'yogyakarta', jenis:'Keagamaan/adat', ringkasan:'Puncak perayaan Sekaten di Keraton Yogyakarta, ditandai dengan arak-arakan gunungan hasil bumi yang diperebutkan masyarakat karena dipercaya membawa berkah dan kemakmuran.',
     fakta:['Gunungan hasil bumi yang diperebutkan dipercaya membawa berkah bagi siapa saja yang mendapatkannya','Digelar tiga kali setahun untuk memperingati hari besar Islam yang berbeda']},
    {id:'pasola', nama:'Pasola', provinsi:'ntt', jenis:'Adat/perang', ringkasan:'Ritual perang-perangan berkuda dengan tombak kayu antar kelompok masyarakat Sumba, digelar sebagai ungkapan syukur atas panen dan kesuburan, dipercaya darah yang tertumpah menyuburkan tanah untuk musim tanam berikutnya.',
     fakta:['Dipercaya bahwa darah yang tertumpah selama ritual akan menyuburkan tanah untuk musim tanam berikutnya','Waktu pelaksanaannya ditentukan berdasarkan kemunculan cacing laut (nyale) di pantai Sumba']},
  ],
  kepercayaan:[
    {id:'kejawen', nama:'Kejawen', wilayah:'Jawa', ringkasan:'Sistem kepercayaan dan filosofi hidup masyarakat Jawa yang memadukan unsur mistik lokal, Hindu-Buddha, dan Islam, menekankan keselarasan batin dan alam semesta; tidak memiliki kitab suci tunggal, diwariskan lewat tradisi lisan.',
     fakta:['Tidak memiliki kitab suci tunggal, melainkan diwariskan lewat tradisi lisan dan laku spiritual','Konsep penting dalam Kejawen termasuk "manunggaling kawula gusti", penyatuan diri dengan Sang Pencipta']},
    {id:'sundawiwitan', nama:'Sunda Wiwitan', wilayah:'Jawa Barat, terutama masyarakat Baduy', ringkasan:'Kepercayaan asli masyarakat Sunda yang menekankan penghormatan terhadap alam dan leluhur, masih dipraktikkan komunitas Baduy hingga kini, dan diperjuangkan sebagai salah satu agama leluhur yang diakui negara.',
     fakta:['Penganutnya percaya pada konsep keseimbangan antara manusia, alam, dan Sang Pencipta','Diperjuangkan sebagai salah satu kepercayaan leluhur yang diakui negara dalam kolom kepercayaan KTP']},
    {id:'kaharingan', nama:'Kaharingan', wilayah:'Kalimantan Tengah', ringkasan:'Kepercayaan asli suku Dayak yang berpusat pada penghormatan roh leluhur dan alam, kini diakui sebagai bagian dari agama Hindu di Indonesia; upacara kematiannya dikenal dengan nama Tiwah.',
     fakta:['Upacara kematian dalam Kaharingan dikenal dengan nama Tiwah, ritual pengantaran roh ke alam baka','Kini secara administratif digolongkan sebagai bagian dari Hindu Kaharingan di Indonesia']},
    {id:'marapu', wilayah:'Sumba, NTT', nama:'Marapu', ringkasan:'Kepercayaan asli masyarakat Sumba yang berpusat pada penghormatan roh leluhur (marapu) yang dipercaya menjadi perantara antara manusia dan Sang Pencipta, masih dipraktikkan bersamaan dengan ritual pasola dan pemakaman megalitik.',
     fakta:['Pemakaman megalitik dengan batu-batu besar menjadi ciri khas praktik kepercayaan Marapu','Ritual Pasola menjadi salah satu perwujudan penting dari kepercayaan ini']},
    {id:'parmalim', wilayah:'Sumatera Utara, masyarakat Batak Toba', nama:'Ugamo Malim (Parmalim)', ringkasan:'Kepercayaan asli masyarakat Batak Toba yang menekankan penghormatan kepada Debata Mulajadi Nabolon (Sang Pencipta) dan leluhur, tetap eksis meski mayoritas masyarakat Batak kini menganut Kristen.',
     fakta:['Penganutnya masih melangsungkan berbagai ritual adat leluhur meski jumlahnya kini semakin sedikit','Menekankan konsep keharmonisan hidup antara manusia dengan alam dan leluhur']},
    {id:'towani', wilayah:'Sulawesi Selatan, masyarakat Bugis-Makassar', nama:'Towani Tolotang', ringkasan:'Kepercayaan asli masyarakat Bugis di Sulawesi Selatan yang menekankan penghormatan leluhur dan tradisi lokal, memadukan unsur-unsur kepercayaan pra-Islam dengan praktik modern.',
     fakta:['Masih dipraktikkan oleh sebagian kecil masyarakat Bugis di Kabupaten Sidrap, Sulawesi Selatan','Menekankan keseimbangan antara dunia manusia dan dunia roh leluhur']},
    {id:'aluk_todolo', wilayah:'Toraja, Sulawesi Selatan', nama:'Aluk Todolo', ringkasan:'Kepercayaan asli masyarakat Toraja yang berarti "jalan leluhur", menjadi dasar filosofi upacara Rambu Solo dan Rambu Tuka, kini diakui sebagai bagian dari Hindu Aluk Todolo secara administratif.',
     fakta:['Menjadi dasar filosofi di balik upacara pemakaman megah Rambu Solo yang terkenal','Secara administratif kini digolongkan sebagai bagian dari agama Hindu Aluk Todolo']},
    {id:'wetutelu', wilayah:'Lombok, Nusa Tenggara Barat', nama:'Wetu Telu', ringkasan:'Kepercayaan sinkretis khas suku Sasak di Lombok yang memadukan ajaran Islam dengan kepercayaan animisme dan Hindu-Buddha lokal, tercermin dari sistem ritual dan kalender adatnya yang khas.',
     fakta:['Nama "Wetu Telu" merujuk pada tiga unsur pokok dalam pandangan hidupnya, meski penafsirannya bervariasi antar pemuka adat','Kini penganutnya semakin sedikit seiring semakin banyak masyarakat Sasak yang menganut Islam Waktu Lima (ortodoks)']},
  ],
  folklore:[
    {id:'kancildanbuaya', judul:'Kancil dan Buaya', jenis:'Fabel', asal:'Jawa/Sumatera (Melayu Nusantara)', ringkasan:'Fabel populer tentang kecerdikan kancil yang berhasil menyeberangi sungai penuh buaya dengan tipu daya, menghitung buaya seolah untuk keperluan raja, menjadi simbol kecerdikan mengalahkan kekuatan fisik dalam folklore Nusantara.',
     fakta:['Kancil menjadi tokoh fabel paling ikonik dalam folklore Melayu-Nusantara, melambangkan kecerdikan','Cerita ini diajarkan turun-temurun sebagai dongeng pengantar tidur anak-anak di seluruh Nusantara']},
    {id:'kancilmencuritimun', judul:'Kancil Mencuri Timun', jenis:'Fabel', asal:'Jawa/Sumatera (Melayu Nusantara)', ringkasan:'Fabel yang menceritakan kancil yang tertangkap petani menggunakan jebakan orang-orangan dari getah, mengajarkan pesan moral bahwa kecerdikan berlebihan tanpa kehati-hatian bisa berujung petaka.',
     fakta:['Sering dijadikan pelajaran moral tentang akibat dari sifat serakah dan ceroboh','Merupakan salah satu kisah kancil yang paling sering diceritakan ulang dalam buku cerita anak Indonesia']},
    {id:'sikabayan', judul:'Si Kabayan', jenis:'Cerita Jenaka', asal:'Jawa Barat (Sunda)', ringkasan:'Kumpulan cerita rakyat Sunda tentang tokoh Kabayan yang polos namun sering kali justru menunjukkan kearifan tersembunyi di balik kekonyolannya, populer sebagai hiburan sekaligus sindiran sosial halus.',
     fakta:['Tokoh Si Kabayan digambarkan pemalas namun memiliki cara pandang hidup yang unik dan mengena','Ceritanya sering diadaptasi ke dalam film dan sinetron Indonesia karena kepopulerannya yang bertahan lama']},
    {id:'asalusulsurabaya', judul:'Asal Usul Kota Surabaya (Sura dan Baya)', jenis:'Cerita Asal-usul Daerah', asal:'Jawa Timur', ringkasan:'Cerita rakyat tentang pertarungan ikan hiu (sura) dan buaya (baya) yang memperebutkan wilayah kekuasaan, dipercaya menjadi asal-usul nama Kota Surabaya dan diabadikan dalam simbol kota berupa patung Sura dan Baya.',
     fakta:['Patung ikan hiu dan buaya menjadi ikon resmi Kota Surabaya hingga kini','Nama "Surabaya" dipercaya berasal dari gabungan kata "sura" (hiu) dan "baya" (buaya)']},
    {id:'asalusulselatbali', judul:'Asal Usul Selat Bali', jenis:'Cerita Asal-usul Daerah', asal:'Jawa Timur/Bali', ringkasan:'Cerita rakyat tentang Sidi Mantra dan putranya Manik Angkeran yang menciptakan pemisah antara Pulau Jawa dan Bali menggunakan kesaktian, dipercaya menjadi asal-usul terbentuknya Selat Bali.',
     fakta:['Tokoh Sidi Mantra dipercaya sebagai leluhur spiritual yang berkaitan dengan berdirinya Pura Besakih','Cerita ini menjelaskan secara mitologis mengapa Jawa dan Bali terpisah oleh selat']},
    {id:'sipitung', judul:'Si Pitung', jenis:'Cerita Kepahlawanan', asal:'DKI Jakarta (Betawi)', ringkasan:'Cerita rakyat Betawi tentang jawara yang merampok orang kaya dan pejabat kolonial untuk dibagikan kepada rakyat miskin, dianggap sebagai pahlawan rakyat jelata dalam folklore Betawi meski riwayat historisnya diperdebatkan.',
     fakta:['Kisahnya sering dibandingkan dengan legenda Robin Hood dari Eropa karena pola cerita yang serupa','Menjadi simbol perlawanan rakyat kecil Betawi terhadap ketidakadilan kolonial dalam folklore lokal']},
    {id:'jokotingkir', judul:'Joko Tingkir', jenis:'Cerita Kepahlawanan', asal:'Jawa Tengah', ringkasan:'Cerita rakyat tentang pemuda dari Pengging yang menaklukkan buaya-buaya di Sungai Bengawan Solo dan kemudian menjadi Sultan Pajang, mengisahkan perjalanan dari rakyat biasa menjadi pemimpin besar.',
     fakta:['Dipercaya sebagai cikal bakal pendiri Kesultanan Pajang, kerajaan Islam penerus Demak di Jawa Tengah','Kisah penaklukan buaya-buaya Bengawan Solo menjadi bagian paling populer dari legenda ini']},
    {id:'batubelah', judul:'Batu Belah Batu Bertangkup', jenis:'Dongeng', asal:'Melayu (Sumatra)', ringkasan:'Dongeng Melayu tentang seorang anak yang durhaka dan tidak menghargai ibunya, sang ibu yang putus asa akhirnya ditelan batu ajaib sebagai bentuk hukuman atas kedurhakaan anaknya, menjadi kisah moral tentang pentingnya berbakti kepada orang tua.',
     fakta:['Menjadi salah satu dongeng moral paling populer di kalangan masyarakat Melayu Sumatra','Mengajarkan pesan kuat tentang akibat mengabaikan dan tidak menghormati orang tua']},
    {id:'pakbelalang', judul:'Pak Belalang', jenis:'Cerita Jenaka', asal:'Melayu (Sumatra/Semenanjung Melayu)', ringkasan:'Cerita rakyat Melayu tentang seorang tukang tenung palsu yang selalu beruntung menebak sesuatu secara kebetulan, dikenal dengan kecerdikannya menutupi kebohongannya, menjadi kisah jenaka penuh sindiran terhadap kepercayaan buta pada dukun.',
     fakta:['Menjadi salah satu tokoh cerita jenaka Melayu paling terkenal bersama Pak Kaduk dan Lebai Malang','Mengandung sindiran halus terhadap masyarakat yang mudah percaya pada ramalan tanpa dasar yang jelas']},
  ],
  mitologi:[
    {id:'garuda_mitologi', nama:'Garuda dalam Tradisi Nusantara', kategori:'Makhluk Mitologi', ringkasan:'Burung mitologi raksasa yang berasal dari kepercayaan Hindu-Buddha sebagai kendaraan Dewa Wisnu, diadaptasi menjadi simbol nasional Indonesia lewat lambang negara Garuda Pancasila yang melambangkan kekuatan dan kedaulatan.',
     fakta:['Dalam mitologi Hindu, Garuda adalah kendaraan (wahana) Dewa Wisnu yang melambangkan kekuatan dan kesetiaan','Relief Garuda banyak ditemukan pada candi-candi kuno seperti Candi Kidal dan Prambanan']},
    {id:'lembuswana', nama:'Lembuswana', kategori:'Makhluk Mitologi', ringkasan:'Makhluk mitologi berwujud gabungan gajah, singa, dan naga yang menjadi lambang kebesaran Kesultanan Kutai Kartanegara, dipercaya sebagai kendaraan para dewa dan raja dalam kosmologi Kutai.',
     fakta:['Menjadi lambang resmi Kabupaten Kutai Kartanegara, Kalimantan Timur, hingga kini','Patung Lembuswana dapat ditemukan di berbagai tempat penting di Tenggarong sebagai simbol kebesaran Kutai']},
    {id:'nyiroro_mitologi', nama:'Nyi Roro Kidul', kategori:'Tokoh Mitologis', ringkasan:'Sosok mitologis Ratu Pantai Selatan yang dipercaya menguasai Samudra Hindia di selatan Jawa, erat kaitannya dengan tradisi keraton Mataram dan berbagai pantangan masyarakat pesisir selatan Jawa.',
     fakta:['Dipercaya memiliki hubungan spiritual dengan raja-raja Mataram sejak era Panembahan Senopati','Warna hijau sering dipantangkan dikenakan pengunjung pantai selatan Jawa karena kepercayaan terkait sosok ini']},
    {id:'naga_mitologi', nama:'Naga dalam Budaya Nusantara', kategori:'Makhluk Mitologi', ringkasan:'Makhluk mitologi berwujud ular raksasa yang muncul dalam berbagai kepercayaan lokal Nusantara, dari Naga Banjar di Kalimantan hingga simbol pada motif ukiran Dayak dan Toraja sebagai lambang kekuatan bawah tanah dan air.',
     fakta:['Motif naga banyak ditemukan pada ukiran tradisional Dayak dan Toraja sebagai simbol dunia bawah','Berbeda dari naga Tiongkok, naga Nusantara sering dikaitkan dengan penguasa sungai dan lautan']},
    {id:'batarakala', nama:'Batara Kala', kategori:'Tokoh Mitologis', ringkasan:'Dewa waktu dan bencana dalam mitologi Jawa yang dipercaya gemar memangsa manusia dengan weton tertentu (disebut "mangsa Kala"), menjadi dasar berbagai ritual ruwatan tolak bala dalam budaya Jawa.',
     fakta:['Ritual ruwatan digelar untuk melindungi anak-anak dengan weton tertentu dari "mangsa Kala"','Kisah Batara Kala sering dipentaskan dalam pertunjukan wayang kulit sebagai lakon ruwatan']},
    {id:'wewegombel', nama:'Wewe Gombel', kategori:'Makhluk Mitologi', ringkasan:'Sosok mitologis perempuan dalam folklore Jawa yang dipercaya melindungi (menculik sementara) anak-anak yang terlantar atau kurang kasih sayang, kerap dijadikan pengingat moral bagi orang tua untuk menjaga anak dengan baik.',
     fakta:['Berbeda dari sosok hantu jahat lainnya, Wewe Gombel dalam folklore justru dipercaya melindungi anak terlantar','Ceritanya sering dijadikan pengingat moral bagi orang tua akan pentingnya kasih sayang kepada anak']},

  tataBahasa:[
    {id:'katabaku', nama:'Kata Baku dan Tidak Baku', ringkasan:'Kata baku adalah kata yang penulisan dan pengucapannya sesuai kaidah bahasa Indonesia yang telah dibakukan (mengacu KBBI dan PUEBI), sementara kata tidak baku adalah variasi yang biasa dipakai dalam percakapan sehari-hari namun menyimpang dari kaidah resmi.',

    {id:'imbuhan', nama:'Imbuhan (Afiksasi)', ringkasan:'Proses pembentukan kata baru dengan menambahkan imbuhan (awalan, sisipan, akhiran, atau gabungan) pada kata dasar, mengubah makna atau kelas kata asalnya, seperti me-, di-, ber-, ke-an, pe-an.',

    {id:'kalimatefektif', nama:'Kalimat Efektif', ringkasan:'Kalimat yang mampu menyampaikan gagasan secara tepat, jelas, dan mudah dipahami pembaca atau pendengar tanpa menimbulkan kesalahpahaman, dengan struktur yang logis dan tidak bertele-tele.',

    {id:'jeniskata', nama:'Jenis Kata (Kelas Kata)', ringkasan:'Pengelompokan kata dalam bahasa Indonesia berdasarkan fungsi dan perannya dalam kalimat, meliputi nomina (kata benda), verba (kata kerja), adjektiva (kata sifat), adverbia (kata keterangan), dan beberapa kelas kata lainnya.',

    {id:'ejaanpueb', nama:'Ejaan (PUEBI)', ringkasan:'Pedoman Umum Ejaan Bahasa Indonesia yang mengatur tata cara penulisan huruf, kata, tanda baca, dan unsur serapan, menjadi acuan resmi penulisan bahasa Indonesia yang baik dan benar sejak 2015 menggantikan EYD.',

    {id:'semaphore', nama:'Sandi Semaphore', ringkasan:'Sistem isyarat menggunakan sepasang bendera yang digerakkan membentuk posisi berbeda untuk tiap huruf, dipakai untuk komunikasi jarak pandang antar penerima yang saling melihat.',
     fakta:['Posisi bendera untuk tiap huruf mengacu pada arah jarum jam di sekeliling tubuh pengirim isyarat','Karena bergantung sepenuhnya pada posisi visual, sandi ini paling baik dipelajari langsung dari bagan/carta resmi Pramuka dengan bimbingan pembina, bukan hanya dari teks']},
    {id:'sandikotak', nama:'Sandi Kotak', ringkasan:'Sandi Pramuka yang menyusun huruf dalam kisi-kisi kotak dan silang, dibaca dari bentuk garis kotak yang mengelilingi tiap huruf.'},
    {id:'sandirumput', nama:'Sandi Rumput', ringkasan:'Sandi Pramuka yang menggunakan kombinasi garis pendek dan panjang menyerupai rumput, mirip prinsip Sandi Morse namun ditulis dalam bentuk visual garis-garis.'},
    {id:'sandiangka', nama:'Sandi Angka', ringkasan:'Sandi Pramuka yang mengganti setiap huruf alfabet dengan urutan angka sesuai posisinya (A=1, B=2, dst), sederhana namun efektif untuk latihan dasar sandi.'},
    {id:'sandiand', nama:'Sandi AND (AN)', ringkasan:'Sandi Pramuka yang menyisipkan huruf tambahan "AND" di antara suku kata asli, sehingga pesan terdengar seperti kata acak bagi yang tidak mengetahui kuncinya.'},
    {id:'sandikurangsatu', nama:'Sandi Kurang Satu / Lebih Satu', ringkasan:'Sandi dasar Pramuka yang menggeser setiap huruf pesan mundur atau maju satu posisi dalam urutan alfabet (misal huruf B ditulis sebagai A untuk sandi kurang satu), termasuk sandi paling sederhana untuk latihan pemula.',
     fakta:['Contoh sandi kurang satu: kata "BUKU" ditulis menjadi "ATJT" karena tiap huruf digeser mundur satu abjad','Menjadi materi dasar pengenalan sandi bagi anggota Pramuka Siaga dan Penggalang pemula sebelum belajar sandi yang lebih rumit']},
    {id:'sandikoordinat', nama:'Sandi Koordinat', ringkasan:'Sandi yang menyusun huruf dalam kotak berkoordinat baris dan kolom (mirip permainan kapal selam), setiap huruf diwakili oleh pasangan angka atau simbol koordinatnya dalam kotak tersebut.',
     fakta:['Mengasah kemampuan logika dan ketelitian karena pesan harus dipetakan sesuai posisi baris-kolom yang tepat','Sering digunakan dalam permainan pos-pos penjelajahan (wide game) kegiatan perkemahan Pramuka']},
  ],
  taliTemali:[
    {id:'simpulmati', nama:'Simpul Mati', ringkasan:'Simpul dasar untuk menyambung dua tali sama besar secara permanen, sulit dilepas kembali setelah dikencangkan.'},
    {id:'simpulhidup', nama:'Simpul Hidup', ringkasan:'Simpul yang mudah dilepas kembali meski telah dikencangkan, umum dipakai untuk mengikat sementara.'},
    {id:'simpulanyam', nama:'Simpul Anyam', ringkasan:'Simpul untuk menyambung dua tali berbeda ukuran, sering dipakai dalam kegiatan pionering Pramuka.'},
    {id:'simpulpangkal', nama:'Simpul Pangkal', ringkasan:'Simpul dasar untuk memulai suatu ikatan pada tiang atau kayu, menjadi awalan dari banyak jenis ikatan pionering lainnya.'},
    {id:'simpuljangkar', nama:'Simpul Jangkar', ringkasan:'Simpul yang digunakan untuk mengikat tali pada sebuah cincin atau lubang, kuat dan sering dipakai dalam kegiatan panjat atau menambatkan sesuatu.'},
    {id:'simpulerat', nama:'Simpul Erat', ringkasan:'Simpul untuk memendekkan tali tanpa harus memotongnya, berguna saat tali yang tersedia terlalu panjang untuk suatu keperluan.'},
    {id:'ikatanpalang', nama:'Ikatan Palang', ringkasan:'Ikatan pionering untuk menyambung dua batang kayu secara menyilang membentuk sudut (biasanya 90 derajat), dasar dalam pembuatan struktur seperti tandu atau menara pionering.'},
    {id:'ikatansilang', nama:'Ikatan Silang', ringkasan:'Ikatan pionering untuk menyambung dua batang kayu yang bersilangan pada sudut tertentu, sering dipakai dalam pembuatan rangka bangunan pionering seperti gapura atau jembatan sederhana.'},
    {id:'simpultiang', nama:'Simpul Tiang', ringkasan:'Simpul yang menghasilkan lingkaran tetap di ujung tali yang tidak mengencang/mengunci meski ditarik, sering digunakan untuk mengikat sesuatu pada tiang tanpa mencekik atau melukai objek yang diikat.'},
    {id:'simpulkembar', nama:'Simpul Kembar (Simpul Nelayan)', ringkasan:'Simpul kuat untuk menyambung dua tali licin atau berbeda ukuran secara aman, populer digunakan nelayan untuk menyambung tali pancing atau jaring karena tidak mudah lepas meski basah.'},
    {id:'ikatancanggah', nama:'Ikatan Canggah', ringkasan:'Ikatan pionering untuk menyambung tiga batang kayu membentuk cabang/canggah, dasar penting dalam pembuatan tandu, menara pandang, dan berbagai struktur pionering kompleks lainnya.'},
    {id:'tandu_pionering', nama:'Tandu Pionering', ringkasan:'Struktur pionering hasil rangkaian ikatan dan simpul tali-temali yang dibuat dari tongkat/bambu untuk mengangkut korban dalam kondisi darurat, menjadi salah satu keterampilan wajib SKU Pramuka Penggalang.'},
  ],
  sejarahKebangsaan:[
    {id:'sk_sumpahpemuda', nama:'Sumpah Pemuda sebagai Simbol Persatuan', ringkasan:'Ikrar Sumpah Pemuda 28 Oktober 1928 menjadi fondasi kesadaran berbangsa satu, bertanah air satu, dan berbahasa satu, mengajarkan generasi muda bahwa persatuan mengatasi perbedaan suku, agama, dan daerah asal.',
     fakta:['Diikrarkan oleh perwakilan pemuda dari berbagai organisasi kedaerahan di seluruh Nusantara','Menjadi dasar filosofis bagi pentingnya bahasa Indonesia sebagai bahasa pemersatu bangsa hingga kini']},
    {id:'sk_proklamasi', nama:'Proklamasi sebagai Titik Awal Kedaulatan', ringkasan:'Proklamasi Kemerdekaan 17 Agustus 1945 bukan hanya peristiwa sejarah, tetapi juga fondasi hukum dan moral kedaulatan bangsa Indonesia yang menjadi dasar hak dan kewajiban setiap warga negara hingga saat ini.',
     fakta:['Menjadi dasar konstitusional lahirnya Negara Kesatuan Republik Indonesia yang berdaulat penuh','Nilai-nilai perjuangan dalam proklamasi terus diwariskan lewat pendidikan kewarganegaraan di sekolah']},
    {id:'sk_pergerakannasional', nama:'Pergerakan Nasional dan Nilai Kebangsaan', ringkasan:'Rangkaian pergerakan nasional dari Budi Utomo hingga Sumpah Pemuda mengajarkan nilai penting kesadaran kolektif, organisasi modern, dan perjuangan tanpa kekerasan sebagai jalan mencapai kemerdekaan dan cita-cita bersama.',
     fakta:['Menunjukkan transisi perjuangan dari bersifat kedaerahan menjadi perjuangan berskala nasional','Mengajarkan pentingnya pendidikan dan organisasi modern sebagai alat perjuangan bangsa']},
    {id:'sk_simbolpersatuan', nama:'Simbol-Simbol Persatuan Bangsa', ringkasan:'Berbagai simbol seperti Garuda Pancasila, bendera Merah Putih, dan bahasa Indonesia berfungsi sebagai perekat identitas nasional yang mengikat keberagaman suku, agama, dan budaya menjadi satu bangsa Indonesia.',
     fakta:['Simbol-simbol negara diatur secara resmi dalam UU No. 24 Tahun 2009 tentang Bendera, Bahasa, Lambang Negara, dan Lagu Kebangsaan','Penghormatan terhadap simbol negara menjadi bagian penting pendidikan kewarganegaraan sejak dini']},
    {id:'sk_wawasankebangsaan', nama:'Wawasan Kebangsaan', ringkasan:'Cara pandang dan sikap bangsa Indonesia terhadap diri dan lingkungannya yang mengutamakan persatuan, kesatuan wilayah, serta kepentingan nasional di atas kepentingan pribadi atau golongan dalam kehidupan bermasyarakat, berbangsa, dan bernegara.',
     fakta:['Menjadi landasan sikap toleransi dan gotong royong dalam kehidupan bermasyarakat yang majemuk','Diajarkan secara formal melalui mata pelajaran Pendidikan Pancasila dan Kewarganegaraan (PPKn) di sekolah']},
    {id:'sk_bhinnekatunggal', nama:'Bhinneka Tunggal Ika sebagai Perekat Bangsa', ringkasan:'Semboyan yang menjadi landasan hidup berdampingan lebih dari 1.300 suku bangsa dan ratusan bahasa daerah di Indonesia, mengajarkan bahwa keberagaman bukan ancaman melainkan kekuatan bangsa jika dikelola dengan toleransi.',
     fakta:['Diambil dari Kitab Sutasoma karya Mpu Tantular era Majapahit, jauh sebelum konsep negara-bangsa modern ada','Menjadi dasar sikap saling menghormati antarsuku, agama, ras, dan golongan (SARA) dalam kehidupan bernegara']},
    {id:'sk_nkri', nama:'Negara Kesatuan Republik Indonesia (NKRI)', ringkasan:'Bentuk final negara Indonesia yang menyatukan ribuan pulau dan beragam suku bangsa dalam satu kedaulatan, ditegaskan sebagai harga mati yang tidak dapat ditawar dalam kehidupan berbangsa dan bernegara.',
     fakta:['Bentuk NKRI ditegaskan kembali setelah sempat berbentuk negara federal (RIS) pada 1949-1950','Semboyan "NKRI Harga Mati" sering digaungkan untuk menegaskan keutuhan wilayah dari ancaman disintegrasi']},
    {id:'sk_belanegara', nama:'Bela Negara', ringkasan:'Kewajiban dan hak setiap warga negara untuk turut serta dalam upaya pembelaan negara, tidak selalu berarti angkat senjata, tetapi dapat diwujudkan lewat prestasi, kepatuhan hukum, dan kontribusi positif bagi bangsa.',
     fakta:['Diatur dalam UUD 1945 Pasal 27 Ayat 3, menegaskan hak dan kewajiban warga negara dalam pembelaan negara','Dapat diwujudkan lewat berbagai cara, dari menjaga persatuan, berprestasi, hingga menaati hukum yang berlaku']},
    {id:'sk_identitasnasional', nama:'Identitas Nasional Indonesia', ringkasan:'Ciri khas yang membedakan bangsa Indonesia dari bangsa lain, terbentuk dari perpaduan sejarah panjang, keberagaman budaya, bahasa persatuan, dan nilai-nilai Pancasila yang disepakati bersama sebagai jati diri bangsa.',
     fakta:['Terbentuk dari proses sejarah panjang mulai era kerajaan kuno hingga perjuangan kemerdekaan modern','Bahasa Indonesia, Pancasila, dan semboyan Bhinneka Tunggal Ika menjadi tiga pilar utama identitas nasional']},
  ],
  tandaKecakapan:[
    {id:'tk_tku', nama:'Tanda Kecakapan Umum (TKU)', ringkasan:'Tanda pengenal tingkatan yang menunjukkan pencapaian syarat kecakapan umum (SKU) seorang anggota Pramuka sesuai golongannya, dikenakan di lengan seragam sebagai identitas jenjang keanggotaan.',
     fakta:['Bentuk dan warna TKU berbeda-beda tiap golongan, dari Siaga (bentuk lingkaran) hingga Pandega (bentuk trapesium)','Kenaikan tingkat TKU dicapai lewat ujian SKU yang diuji langsung oleh pembina di setiap gugus depan']},
    {id:'tk_tkk', nama:'Tanda Kecakapan Khusus (TKK)', ringkasan:'Tanda yang diberikan kepada anggota Pramuka yang telah menguasai suatu keterampilan atau kecakapan khusus tertentu, seperti berkemah, memasak, pertolongan pertama, atau juru musik.',
     fakta:['Terdapat ratusan jenis TKK yang dikelompokkan dalam lima bidang: agama, patriotisme, kepribadian, ketangkasan, dan keterampilan','Anggota yang meraih lima TKK dari bidang berbeda berhak menyandang gelar Pramuka Garuda']},
    {id:'tk_siaga', nama:'Tingkatan Golongan Siaga (Mula, Bantu, Tata)', ringkasan:'Tingkatan kecakapan umum untuk anggota Pramuka usia 7-10 tahun, terdiri dari tiga jenjang berurutan: Mula (dasar), Bantu (menengah), dan Tata (tertinggi) sebelum naik ke golongan Penggalang.',
     fakta:['Golongan Siaga menekankan pembentukan karakter dasar lewat permainan dan kegiatan menyenangkan','Satuan Siaga disebut "Barung", dipimpin oleh seorang "Sulung" (pemimpin barung)']},
    {id:'tk_penggalang', nama:'Tingkatan Golongan Penggalang (Ramu, Rakit, Terap)', ringkasan:'Tingkatan kecakapan umum untuk anggota Pramuka usia 11-15 tahun, terdiri dari jenjang Ramu, Rakit, dan Terap, menekankan pembentukan keterampilan kepramukaan dan kemandirian yang lebih matang.',
     fakta:['Satuan Penggalang disebut "Regu", dipimpin oleh seorang "Pratama" (pemimpin regu)','Golongan ini biasanya paling aktif dalam kegiatan perkemahan dan lomba tingkat kepramukaan (LT)']},
    {id:'tk_penegak', nama:'Tingkatan Golongan Penegak (Bantara, Laksana)', ringkasan:'Tingkatan kecakapan umum untuk anggota Pramuka usia 16-20 tahun, terdiri dari jenjang Bantara dan Laksana, menekankan kepemimpinan, kemandirian, dan pengabdian kepada masyarakat.',
     fakta:['Satuan Penegak disebut "Ambalan", dipimpin oleh seorang "Pradana"','Penegak Laksana merupakan tingkatan tertinggi sebelum seseorang dapat menjadi Pembina Pramuka']},
    {id:'tk_pandega', nama:'Tingkatan Golongan Pandega', ringkasan:'Tingkatan kecakapan umum untuk anggota Pramuka usia 21-25 tahun, menjadi jenjang tertinggi dalam kepramukaan sebelum seseorang beralih peran menjadi pembina atau andalan gerakan Pramuka.',
     fakta:['Satuan Pandega disebut "Racana", dipimpin oleh seorang "Pradana Racana"','Anggota Pandega sering dilibatkan sebagai pendamping kegiatan golongan Pramuka yang lebih muda']},
    {id:'tkk_bidang', nama:'Lima Bidang Tanda Kecakapan Khusus', ringkasan:'TKK dikelompokkan dalam lima bidang yang ditandai warna dasar berbeda: bidang agama (kuning), patriotisme dan seni budaya (merah putih), ketangkasan dan kesehatan (putih), keterampilan dan teknik pembangunan (hijau), serta sosial, perikemanusiaan, gotong royong, dan ketertiban masyarakat (biru).',
     fakta:['Warna dasar bidang TKK membantu mengidentifikasi kategori kecakapan hanya dari tampilan lencananya','Anggota bisa mengumpulkan TKK dari bidang yang paling sesuai minat dan bakatnya masing-masing']},
    {id:'tkk_contoh', nama:'Contoh-Contoh TKK Populer', ringkasan:'Beberapa TKK yang paling umum diikuti anggota Pramuka meliputi TKK Berkemah, TKK Juru Masak, TKK Pertolongan Pertama (PPPK), TKK Renang, TKK Juru Kebun, TKK Pengamat, dan TKK Menabung, masing-masing menguji keterampilan praktis tertentu lewat ujian langsung oleh penguji.',
     fakta:['TKK Berkemah menguji keterampilan mendirikan tenda, memasak di alam terbuka, dan bertahan hidup dasar','TKK Pertolongan Pertama menguji kemampuan menangani cedera ringan dan situasi darurat sederhana']},
    {id:'pramukagaruda', nama:'Pramuka Garuda', ringkasan:'Gelar tertinggi yang bisa diraih anggota Pramuka di tiap golongan, diberikan kepada mereka yang telah menyelesaikan SKU tingkat tertinggi golongannya dan meraih sejumlah TKK dari kelima bidang berbeda, menunjukkan kecakapan menyeluruh sebagai teladan bagi anggota lain.',
     fakta:['Untuk meraih gelar ini, anggota harus memiliki TKK dari kelima bidang berbeda sekaligus telah mencapai tingkat SKU tertinggi golongannya','Pramuka Garuda dianggap sebagai teladan yang mencerminkan penerapan penuh kode kehormatan Pramuka dalam kehidupan sehari-hari']},
  ]
};
WARGA.pramukaMateri = [
  {id:'trisatya', nama:'Tri Satya', ringkasan: WARGA.pramuka.triSatya},
  {id:'dasadarma', nama:'Dasa Darma', ringkasan: 'Sepuluh butir janji moral Pramuka: ' + WARGA.pramuka.dasaDarma.join('; ') + '.'},
  {id:'golonganpramuka', nama:'Golongan Pramuka', ringkasan: 'Jenjang keanggotaan Pramuka berdasarkan usia: ' + WARGA.pramuka.golongan.join(', ') + '.'},
  {id:'dwisatya', nama:'Dwi Satya', ringkasan:'Versi sederhana Tri Satya khusus untuk anggota Pramuka Siaga (usia 7-10 tahun), berisi dua janji: menjalankan kewajiban terhadap Tuhan, Negara Kesatuan Republik Indonesia, dan mengikuti tata krama keluarga; serta setiap hari berbuat kebajikan.',
   fakta:['Digunakan khusus untuk golongan Siaga sebagai versi lebih sederhana dari Tri Satya','Diucapkan saat pelantikan resmi anggota Siaga ke dalam Gerakan Pramuka']},
  {id:'dwidarma', nama:'Dwi Darma', ringkasan:'Versi sederhana Dasa Darma khusus untuk anggota Pramuka Siaga, berisi dua butir: Siaga berbakti kepada ayah dan bundanya; Siaga berani dan tidak putus asa.',
   fakta:['Merupakan versi ringkas Dasa Darma yang disesuaikan dengan usia dan pemahaman anggota Siaga','Menjadi pedoman perilaku dasar sebelum anggota naik ke golongan Penggalang dan mulai memakai Dasa Darma penuh']},
  {id:'sejarahpramukadunia', nama:'Sejarah Pramuka Dunia', ringkasan:'Gerakan kepanduan dunia dirintis oleh Robert Baden-Powell, perwira militer Inggris, yang mendirikan perkemahan percobaan pertama di Pulau Brownsea pada 1907 dan menerbitkan buku "Scouting for Boys" pada 1908 yang menjadi cikal bakal gerakan pramuka di seluruh dunia.',
   fakta:['Perkemahan percobaan pertama digelar di Pulau Brownsea, Inggris, pada 1907 dengan 20 anak laki-laki','Gerakan kepanduan kini berkembang di lebih dari 200 negara dengan jutaan anggota di seluruh dunia']},
  {id:'sejarahpramukaindonesia', nama:'Sejarah Pramuka Indonesia', ringkasan:'Gerakan kepanduan di Indonesia dimulai sejak masa kolonial dengan berbagai organisasi kepanduan, disatukan menjadi Gerakan Pramuka lewat Keputusan Presiden No. 238 Tahun 1961, dengan Sri Sultan Hamengkubuwono IX sebagai Bapak Pramuka Indonesia dan Ketua Kwartir Nasional pertama.',
   fakta:['Sebelum 1961, terdapat lebih dari 60 organisasi kepanduan berbeda di Indonesia yang kemudian disatukan','Tanggal 14 Agustus 1961 diperingati sebagai Hari Pramuka setelah pawai perkenalan Pramuka di Istana Negara']},
  {id:'lambangpramuka', nama:'Lambang Gerakan Pramuka (Tunas Kelapa)', ringkasan:'Lambang resmi Gerakan Pramuka berbentuk siluet tunas kelapa, diciptakan oleh Sunardjo Atmodipuro, mengandung 14 makna filosofis yang menggambarkan cita-cita dan sifat luhur setiap anggota Pramuka.',
   fakta:['Diciptakan oleh Sunardjo Atmodipuro, seorang pembina pramuka sekaligus pegawai Departemen Pertanian','Buah kelapa dipilih karena bisa tumbuh di mana saja dan bertahan lama, melambangkan pramuka yang bisa beradaptasi dan berguna di segala kondisi']},
  {id:'strukturorganisasipramuka', nama:'Struktur Organisasi Gerakan Pramuka', ringkasan:'Gerakan Pramuka disusun berjenjang dari tingkat nasional hingga satuan terkecil: Kwartir Nasional (Kwarnas), Kwartir Daerah (Kwarda) tingkat provinsi, Kwartir Cabang (Kwarcab) tingkat kabupaten/kota, Kwartir Ranting (Kwaran) tingkat kecamatan, hingga Gugus Depan (Gudep) di sekolah atau kelurahan.',
   fakta:['Gugus Depan (Gudep) adalah satuan pendidikan terkecil yang biasanya berpangkalan di sekolah','Kwartir Nasional dipimpin oleh seorang Ketua Kwarnas yang dipilih melalui Musyawarah Nasional (Munas)']},
  {id:'seragampramuka', nama:'Seragam Pramuka & Atribut', ringkasan:'Seragam Pramuka berwarna cokelat muda (atas) dan cokelat tua (bawah) dilengkapi berbagai atribut resmi seperti tanda pelantikan, tanda kecakapan, tanda jabatan, dan hasduk (setangan leher) dengan warna khas tiap Kwartir Daerah.',
   fakta:['Warna hasduk biasanya menunjukkan identitas Kwartir Daerah atau Gugus Depan masing-masing','Setiap atribut pada seragam memiliki aturan penempatan yang baku sesuai Petunjuk Penyelenggaraan resmi Kwarnas']},
  {id:'salampramuka', nama:'Salam Pramuka', ringkasan:'Bentuk penghormatan khas anggota Pramuka menggunakan gerakan tangan tertentu, terdiri dari tiga jenis: salam biasa (untuk sesama anggota), salam hormat (untuk pejabat/tamu penting atau bendera), dan salam janji (saat pengucapan Tri Satya).',
   fakta:['Salam Pramuka dilakukan dengan mengangkat tangan kanan dengan lima jari rapat menghadap ke pelipis','Ketiga jenis salam memiliki aturan dan konteks penggunaan yang berbeda dalam kegiatan resmi kepramukaan']},
  {id:'mottopramuka', nama:'Motto Gerakan Pramuka', ringkasan:'Motto resmi Gerakan Pramuka Indonesia berbunyi "Satyaku Kudarmakan, Darmaku Kubaktikan", mengandung makna kesungguhan menjalankan janji (satya) dan mengamalkan kode kehormatan (darma) sebagai bakti nyata bagi bangsa dan negara.',
   fakta:['Motto ini menjadi pengingat bahwa janji (Tri Satya) dan kode kehormatan (Dasa Darma) harus benar-benar diamalkan, bukan sekadar dihafalkan','Sering diucapkan dalam berbagai upacara dan kegiatan resmi kepramukaan']},
  {id:'upacarapramuka', nama:'Upacara Pembukaan & Penutupan Latihan', ringkasan:'Rangkaian upacara resmi yang dilakukan di awal dan akhir setiap kegiatan latihan Pramuka, meliputi pengibaran/penurunan bendera, doa, dan pembacaan sandi/janji, bertujuan menanamkan disiplin dan kekhidmatan dalam setiap kegiatan kepramukaan.',
   fakta:['Upacara pembukaan dan penutupan wajib dilakukan di setiap latihan rutin Gugus Depan','Susunan upacara berbeda sedikit tiap golongan (Siaga, Penggalang, Penegak) sesuai tingkat kematangan anggotanya']},

/* Konversi Hijriah tabular (algoritma Kuwaiti/civil) — PERKIRAAN, bukan hasil
   rukyat hilal resmi. Bisa meleset 1-2 hari dari penetapan Kemenag RI. */
function toJulianDay(y,m,d){
  const a = Math.floor((14-m)/12);
  const y2 = y + 4800 - a;
  const m2 = m + 12*a - 3;
  return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045;
}
function hijriApprox(y,m,d){
  const jd = toJulianDay(y,m,d) + 0.5;
  const epoch = 1948439.5;
  let l = jd - epoch + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = Math.floor((10985-l)/5316)*Math.floor((50*l)/17719) + Math.floor(l/5670)*Math.floor((43*l)/15238);
  l = l - Math.floor((30-j)/15)*Math.floor((17719*j)/50) - Math.floor(j/16)*Math.floor((15238*j)/43) + 29;
  const bulan = Math.floor((24*l)/709);
  const hari = l - Math.floor((709*bulan)/24);
  const tahun = 30*n + j - 30;
  return {tahun, bulan, hari};
}

function renderHome(){
  document.getElementById('todayDate').textContent = 'Info Nusantara Hari Ini';
  document.getElementById('todayTitle').textContent = '17.000+ Pulau Nusantara';
  document.getElementById('todayDesc').textContent = 'Indonesia adalah negara kepulauan terbesar di dunia, membentang dari Sabang hingga Merauke.';

  const menuIcons = {peta:ic('map'), lorong:ic('clock'), panggung:ic('masks'), pustaka:ic('scroll'), bilik:ic('chat'), balai:ic('badge'), pusat:ic('grid')};
  const grid = document.getElementById('menuGrid');
  let items = [{id:'__provinsi', name:'Provinsi', icon:ic('shield'), action:"openProvinsiList()"}]
    .concat(MENUS.map(m=>({id:m.id, name:m.name.split(' ')[0], icon:menuIcons[m.id]||ic('book'), action:`openMenu('${m.id}')`})));
  grid.innerHTML = items.map(it=>`
    <div class="icongrid-item" onclick="${it.action}">
      <div class="icb">${it.icon}</div>
      <div class="icb-label">${it.name}</div>
    </div>`).join('');

  const featured = PROVINSI[Math.floor(Math.random()*PROVINSI.length)];
  const pq = document.getElementById('provQuick');
  pq.onclick = ()=>openProvince(featured.id);
  pq.innerHTML = `
    <div class="promocard-text">
      <div class="promocard-title">${featured.nama}</div>
      <p class="promocard-desc">${featured.rumahAdat ? featured.rumahAdat.split('—')[0].trim()+' · '+featured.ibukota : featured.ibukota}</p>
    </div>
    <div class="promocard-img">${ic('building')}</div>`;
}

  currentMenu = menuId; currentFilter = 'Semua';
  showView('view-menu');
  const m = MENUS.find(x=>x.id===menuId);
  setHeader({mode:'sub', title:m.name});
  renderMenuEntries();
  pushNavState({view:'menu', menuId});
}


function renderMenuEntries(){
  const items = MENU_GROUPS[currentMenu].getItems();
  const cats = ['Semua', ...new Set(items.map(i=>i.cat))];
  document.getElementById('menuFilters').innerHTML = cats.map(c=>`
    <div class="pill ${c===currentFilter?'active':''}" onclick="setFilter('${c}')">${c}</div>`).join('');

  const filtered = currentFilter==='Semua' ? items : items.filter(i=>i.cat===currentFilter);
  const list = document.getElementById('menuEntries');
  const kalenderBtn = (currentMenu==='pusat' && (currentFilter==='Semua' || currentFilter==='Kalender'))
    ? `<div class="listrow" onclick="openKalenderInteraktif()">
        <div class="lr-icon">${ic('calendar')}</div>
        <div class="lr-text"><div class="lr-title">Buka Kalender Interaktif</div><div class="lr-sub">Lihat tanggal Masehi & Hijriah, cari hari penting</div></div>
        <div class="lr-chev">${ic('chevron')}</div>
      </div>` : '';
  if(filtered.length===0 && !kalenderBtn){
    list.innerHTML = '<div class="empty">Belum ada entri pada kategori ini.</div>';
    return;
  }
  list.innerHTML = kalenderBtn + filtered.map(i=>{
    const onclick = i.kind==='province' ? `openProvince('${i.id}')` : `openEntry('${i.group}','${i.id}')`;
    return `<div class="listrow" onclick="${onclick}">
      <div class="lr-icon">${ic('book')}</div>
      <div class="lr-text"><div class="lr-title">${i.nama}</div><div class="lr-sub">${i.cat}${i.meta ? ' · '+i.meta : ''}</div></div>
      <div class="lr-chev">${ic('chevron')}</div>
    </div>`;
  }).join('');
}
function setFilter(c){ currentFilter = c; renderMenuEntries(); }

function openProvince(id){
  const p = PROVINSI.find(x=>x.id===id);
  if(!p) return;
  showView('view-province');
  setHeader({mode:'sub', title:p.nama, star:true});

  const relatedTari = SENI.tari.filter(t=>t.provinsi===id);
  const relatedSuku = PUSTAKA.suku.filter(s=>s.provinsi===id);
  const relatedTokoh = SEJARAH.tokoh.filter(t=>t.provinsi===id);
  const relatedKerajaan = SEJARAH.kerajaan.filter(k=>k.provinsi===id);
  const relatedUpacara = PUSTAKA.upacara.filter(u=>u.provinsi===id);
  const relatedGunung = GEOGRAFI.gunung.filter(g=>g.provinsi===id);
  const relatedDanau = GEOGRAFI.danau.filter(d=>d.provinsi===id);
  const relatedTN = GEOGRAFI.tamanNasional.filter(t=>t.provinsi===id);
  const relatedPantai = GEOGRAFI.pantai.filter(p=>p.provinsi===id);
  const relatedSitus = GEOGRAFI.situsSejarah.filter(s=>s.provinsi===id);
  const relatedIbadah = GEOGRAFI.tempatIbadah.filter(t=>t.provinsi===id);
  const relatedFF = GEOGRAFI.floraFauna.filter(f=>f.provinsi===id);
  const relatedMakanan = [...KULINER.makananBerat, ...KULINER.jajanan, ...KULINER.minuman].filter(k=>k.provinsi===id);
  const relatedWayang = SENI.wayang.filter(w=>w.provinsi===id);
  const relatedKepercayaan = PUSTAKA.kepercayaan.filter(k=>k.provinsi===id);

  const blocks = [
    ['Rumah Adat', p.rumahAdat], ['Pakaian Adat', p.pakaianAdat], ['Senjata Tradisional', p.senjata],
    ['Tari', p.tari], ['Makanan Khas', p.makanan], ['Suku', p.suku],
  ].filter(b=>b[1]);

  const tags = [
    ...relatedTari.map(t=>({label:'Tari '+t.nama, fn:`openEntry('tari','${t.id}')`})),
    ...relatedSuku.map(s=>({label:'Suku '+s.nama, fn:`openEntry('suku','${s.id}')`})),
    ...relatedTokoh.map(t=>({label:'Tokoh '+t.nama, fn:`openEntry('tokoh','${t.id}')`})),
    ...relatedKerajaan.map(k=>({label:'Kerajaan '+k.nama, fn:`openEntry('kerajaan','${k.id}')`})),
    ...relatedUpacara.map(u=>({label:'Upacara '+u.nama, fn:`openEntry('upacara','${u.id}')`})),
    ...relatedGunung.map(g=>({label:'Gunung '+g.nama, fn:`openEntry('gunung','${g.id}')`})),
    ...relatedDanau.map(d=>({label:'Danau '+d.nama, fn:`openEntry('danau','${d.id}')`})),
    ...relatedTN.map(t=>({label:t.nama, fn:`openEntry('tamanNasional','${t.id}')`})),
    ...relatedPantai.map(p=>({label:p.nama, fn:`openEntry('pantai','${p.id}')`})),
    ...relatedSitus.map(s=>({label:s.nama, fn:`openEntry('situsSejarah','${s.id}')`})),
    ...relatedIbadah.map(t=>({label:t.nama, fn:`openEntry('tempatIbadah','${t.id}')`})),
    ...relatedFF.map(f=>({label:f.nama, fn:`openEntry('floraFauna','${f.id}')`})),
    ...relatedMakanan.map(k=>({label:k.nama, fn:`openEntry('${KULINER.makananBerat.includes(k)?'makananBerat':(KULINER.jajanan.includes(k)?'jajanan':'minuman')}','${k.id}')`})),
    ...relatedWayang.map(w=>({label:w.nama, fn:`openEntry('wayang','${w.id}')`})),
    ...relatedKepercayaan.map(k=>({label:k.nama, fn:`openEntry('kepercayaan','${k.id}')`})),
  ];

  const sukuCount = (p.suku||'').split(',').length;
  const wisataCount = (p.wisata||[]).length;
  const faktaCount = (p.fakta||[]).length;

  const panelProfil = `
    <p style="font-family:var(--font-display); font-style:italic; color:var(--clay); font-size:13.5px; margin:0 0 10px;">"${p.semboyan||''}"</p>
    <p style="font-size:13.5px; line-height:1.65; color:var(--ink-soft); margin:0 0 4px;">
      ${p.nama} adalah salah satu provinsi Indonesia di Pulau ${p.pulau}. Provinsi ini beribu kota di ${p.ibukota} dengan luas wilayah ${p.luas} dan berada di zona waktu ${p.zonaWaktu}.
    </p>
    <div class="statrow">
      <div class="statcell"><div class="sc-val">${sukuCount}</div><div class="sc-lbl">Suku/Etnis</div></div>
      <div class="statcell"><div class="sc-val">${faktaCount}</div><div class="sc-lbl">Fakta Unik</div></div>
      <div class="statcell"><div class="sc-val">${wisataCount}</div><div class="sc-lbl">Destinasi Wisata</div></div>
    </div>
    <div class="fieldrow" style="border-top:none; padding-top:0;">
      <div class="flabel">Fakta Unik</div>
      <div class="fval"><ul>${(p.fakta||[]).map(f=>`<li>${f}</li>`).join('')}</ul></div>
    </div>`;

  const panelBudaya = blocks.map(([l,v])=>`
      <div class="fieldrow"><div class="flabel">${l}</div><div class="fval">${v}</div></div>`).join('');

  const sejarahItems = [...relatedKerajaan.map(k=>({nama:k.nama, sub:k.periode||'', fn:`openEntry('kerajaan','${k.id}')`})),
                         ...relatedTokoh.map(t=>({nama:t.nama, sub:t.periode||t.kategori||'', fn:`openEntry('tokoh','${t.id}')`}))];
  const panelSejarah = sejarahItems.length ? `
    <div class="listwrap" style="margin-top:2px;">
      ${sejarahItems.map(s=>`<div class="listrow" onclick="${s.fn}">
        <div class="lr-icon">${ic('clock')}</div>
        <div class="lr-text"><div class="lr-title">${s.nama}</div><div class="lr-sub">${s.sub}</div></div>
        <div class="lr-chev">${ic('chevron')}</div>
      </div>`).join('')}
    </div>` : `<div class="empty">Belum ada data sejarah spesifik tercatat untuk provinsi ini.</div>`;

  const panelPariwisata = `
    <div class="fieldrow" style="border-top:none; padding-top:0;">
      <div class="flabel">Destinasi Wisata</div>
      <div class="fval"><ul>${(p.wisata||[]).map(f=>`<li>${f}</li>`).join('')}</ul></div>
    </div>
    ${(p.wisata||[]).length ? `<div class="section-head" style="margin:10px 0 8px;"><h3 style="font-size:14px;">Ikon Daerah</h3></div>
    <div class="iconlabel-row">
      ${p.wisata.map(w=>`<div class="iconlabel-card"><div class="ilc-img">${ic('pin')}</div><div class="ilc-cap">${w}</div></div>`).join('')}
    </div>` : ''}`;

  document.getElementById('provinceBody').innerHTML = `
    <div class="detailhero"><div class="dh-loc">PULAU ${(p.pulau||'').toUpperCase()}</div><div class="dh-icon">${ic('mountain')}</div></div>
    <div class="detailcard">
      <div class="detailcard-top">
        <div class="detailcard-badge">${ic('shield')}</div>
        <div>
          <div class="detailcard-name">${p.nama}</div>
          <div class="detailcard-meta">Ibu Kota: ${p.ibukota}<br>Luas: ${p.luas}<br>Zona Waktu: ${p.zonaWaktu}</div>
        </div>
      </div>
      <div class="tabbar" id="provTabbar">
        <div class="tabbtn active" onclick="provTab('profil')">Profil</div>
        <div class="tabbtn" onclick="provTab('sejarah')">Sejarah</div>
        <div class="tabbtn" onclick="provTab('budaya')">Budaya</div>
        <div class="tabbtn" onclick="provTab('pariwisata')">Pariwisata</div>
      </div>
      <div id="provPanel-profil" class="provpanel">${panelProfil}</div>
      <div id="provPanel-sejarah" class="provpanel" style="display:none;">${panelSejarah}</div>
      <div id="provPanel-budaya" class="provpanel" style="display:none;">${panelBudaya}</div>
      <div id="provPanel-pariwisata" class="provpanel" style="display:none;">${panelPariwisata}</div>
      ${tags.length ? `<div class="related">
        <div class="flabel">Data Terkait</div>
        ${tags.map(t=>`<span class="tag" onclick="${t.fn}">${t.label}</span>`).join('')}
      </div>` : ''}
    </div>
  `;
  pushNavState({view:'province', id});
}

function provTab(name){
  ['profil','sejarah','budaya','pariwisata'].forEach(t=>{
    document.getElementById('provPanel-'+t).style.display = t===name ? 'block' : 'none';
  });
  document.querySelectorAll('#provTabbar .tabbtn').forEach(btn=>btn.classList.remove('active'));
  const idx = {profil:0,sejarah:1,budaya:2,pariwisata:3}[name];
  document.querySelectorAll('#provTabbar .tabbtn')[idx].classList.add('active');
}

   ========================================================================= */
let __darkMode = false, __notifOn = true;
const TEXT_SIZES = ['Kecil','Sedang','Besar'];
let __textSizeIdx = 1;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function toggleDarkMode(){
  __darkMode = !__darkMode;
  document.body.classList.toggle('dark', __darkMode);
  renderSettings();
}
function toggleNotif(){
  __notifOn = !__notifOn;
  renderSettings();
  showToast(__notifOn ? 'Notifikasi diaktifkan' : 'Notifikasi dimatikan');
}
function cycleTextSize(){
  __textSizeIdx = (__textSizeIdx + 1) % TEXT_SIZES.length;
  document.documentElement.style.fontSize = ['14px','16px','18px'][__textSizeIdx];
  renderSettings();
}
function clearCache(){
  showToast('Cache berhasil dibersihkan');
  renderSettings();
}

/* =========================================================================
   KALENDER INTERAKTIF
   ========================================================================= */
let calSystem = 'masehi';
let calYear, calMonth; // calMonth: 0-11
let calSelectedDate = null;

function openKalenderInteraktif(){
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  calSelectedDate = now.getDate();
  showView('view-kalender');
  setHeader({mode:'sub', title:'Kalender Interaktif'});
  document.getElementById('calPrevBtn').innerHTML = ic('chevleft');
  document.getElementById('calNextBtn').innerHTML = ic('chevright');
  document.getElementById('calTabs').innerHTML = ['masehi','hijriah','bali'].map(s=>{
    const label = s==='masehi' ? 'Masehi' : s==='hijriah' ? 'Hijriah' : 'Bali (Saka)';
    return `<div class="caltab ${calSystem===s?'active':''}" onclick="calSetSystem('${s}')">${label}</div>`;
  }).join('');
  renderKalender();
  pushNavState({view:'kalender'});
}

function calSetSystem(s){ calSystem = s; renderKalender(); document.querySelectorAll('.caltab').forEach(t=>t.classList.remove('active')); const i=['masehi','hijriah','bali'].indexOf(s); document.querySelectorAll('.caltab')[i].classList.add('active'); }

function calShiftMonth(dir){
  calMonth += dir;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  calSelectedDate = null;
  renderKalender();
}

function renderKalender(){
  const disWrap = document.getElementById('calDisclaimerWrap');
  if(calSystem==='hijriah'){
    disWrap.innerHTML = `<div class="caldisclaimer"><b>Perkiraan.</b> Tanggal Hijriah di sini dihitung dengan kalender tabular (perhitungan matematis), bukan hasil rukyat hilal resmi. Bisa berbeda 1-2 hari dari penetapan Kementerian Agama RI — untuk tanggal ibadah resmi (awal Ramadan, Idulfitri, dll), selalu cek pengumuman resmi Kemenag.</div>`;
  } else if(calSystem==='bali'){
    disWrap.innerHTML = `<div class="caldisclaimer"><b>Tidak dihitung otomatis.</b> Kalender Saka Bali (sistem Pawukon 210 hari + Wuku) memerlukan tabel rujukan khusus agar akurat. Untuk menghindari tanggal yang salah, silakan lihat penjelasan sistemnya di entri <i>Kalender Saka Bali</i> pada menu Pusat Kode & Info, atau rujuk kalender Bali resmi/appl khusus.</div>`;
  } else {
    disWrap.innerHTML = '';
  }

  if(calSystem==='bali'){
    document.getElementById('calTitle').textContent = NAMA_BULAN[calMonth]+' '+calYear;
    document.getElementById('calGrid').innerHTML = '';
    document.getElementById('calInfo').innerHTML = `<div class="calinfo-empty">Pilih tab Masehi atau Hijriah untuk melihat kalender harian.</div>`;
    return;
  }

  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();

  let titleText = NAMA_BULAN[calMonth]+' '+calYear;
  if(calSystem==='hijriah'){
    const hMid = hijriApprox(calYear, calMonth+1, 15);
    titleText += '  (~ '+NAMA_BULAN_HIJRIAH[(hMid.bulan-1+12)%12]+' '+hMid.tahun+' H)';
  }
  document.getElementById('calTitle').textContent = titleText;

  let cells = NAMA_HARI_PENDEK.map(h=>`<div class="calhead">${h}</div>`).join('');
  for(let i=0;i<startWeekday;i++) cells += `<div class="calcell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
    const isSelected = calSelectedDate===d;
    const hasEvent = calSystem==='masehi' && (HARI_NASIONAL[calMonth+1]||[]).some(e=>e.tgl===d);
    let sub = '';
    if(calSystem==='hijriah'){
      const h = hijriApprox(calYear, calMonth+1, d);
      sub = h.hari;
    }
    cells += `<div class="calcell ${isToday?'today':''} ${isSelected?'selected':''} ${hasEvent?'hasevent':''}" onclick="calSelectDate(${d})">
      <div class="cal-num">${d}</div>
      ${sub ? `<div class="cal-sub">${sub}</div>` : ''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = cells;
  calRenderInfo();
}

function calSelectDate(d){ calSelectedDate = d; renderKalender(); }

function calRenderInfo(){
  const info = document.getElementById('calInfo');
  if(!calSelectedDate){ info.innerHTML=''; return; }
  const d = calSelectedDate;
  const dateObj = new Date(calYear, calMonth, d);
  const namaHari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][dateObj.getDay()];
  let head = `${namaHari}, ${d} ${NAMA_BULAN[calMonth]} ${calYear}`;
  if(calSystem==='hijriah'){
    const h = hijriApprox(calYear, calMonth+1, d);
    head += ` (~ ${h.hari} ${NAMA_BULAN_HIJRIAH[(h.bulan-1+12)%12]} ${h.tahun} H)`;
  }
  const events = (HARI_NASIONAL[calMonth+1]||[]).filter(e=>e.tgl===d);
  const monthEvents = (HARI_NASIONAL[calMonth+1]||[]);
  let html = `<div class="calinfo-date">${head}</div>`;
  if(events.length){
    html += events.map(e=>`<div class="calinfo-item">${e.nama}</div>`).join('');
  } else {
    html += `<div class="calinfo-empty">Tidak ada hari peringatan nasional pada tanggal ini.</div>`;
  }
  if(monthEvents.length > events.length){
    const others = monthEvents.filter(e=>e.tgl!==d);
    html += `<div class="calinfo-date" style="margin-top:14px; font-size:13px;">Hari penting lain bulan ${NAMA_BULAN[calMonth]}</div>`;
    html += others.map(e=>`<div class="calinfo-item">Tgl ${e.tgl} — ${e.nama}</div>`).join('');
  }
  info.innerHTML = html;
}

function openSettings(){
  showView('view-settings');
  setHeader({mode:'sub', title:'Pengaturan'});
  renderSettings();
  pushNavState({view:'settings'});
}

function renderSettings(){
  const rows = [
    {icon:'person', title:'Akun', sub:'Kelola akun Anda', type:'nav'},
    {icon:'moon', title:'Tema', sub: __darkMode ? 'Mode Gelap' : 'Mode Terang', type:'toggle', on:__darkMode, fn:'toggleDarkMode()'},
    {icon:'textsize', title:'Ukuran Teks', sub: TEXT_SIZES[__textSizeIdx], type:'cycle', fn:'cycleTextSize()'},
    {icon:'globe', title:'Bahasa', sub:'Bahasa Indonesia', type:'nav'},
    {icon:'bell', title:'Notifikasi', sub: __notifOn ? 'Aktif' : 'Nonaktif', type:'toggle', on:__notifOn, fn:'toggleNotif()'},
    {icon:'download', title:'Unduh Data', sub:'Kelola data offline', type:'nav'},
    {icon:'trash', title:'Bersihkan Cache', sub:'25,6 MB', type:'cycle', fn:'clearCache()'},
    {icon:'info', title:'Tentang Aplikasi', sub:'Khatulistara v1.0.0', type:'nav'},
  ];
  document.getElementById('settingsList').innerHTML = rows.map(r=>{
    const right = r.type==='toggle'
      ? `<div class="toggle ${r.on?'on':''}"><div class="knob"></div></div>`
      : `<div class="lr-chev">${ic('chevron')}</div>`;
    const onclick = r.fn ? ` onclick="${r.fn}"` : '';
    return `<div class="listrow"${onclick}>
      <div class="lr-icon">${ic(r.icon)}</div>
      <div class="lr-text"><div class="lr-title">${r.title}</div><div class="lr-sub">${r.sub}</div></div>
      ${right}
    </div>`;
  }).join('') + `<div class="settings-version">KHATULISTARA v1.0.0 — Prototipe</div>`;
}

/* ---- History / back-button handling ----
   Every navigation (home, menu, entry, province) pushes a history state.
   The phone's back button and any in-app back link both resolve through
   the same popstate handler, so navigation always steps back one level
   instead of jumping out of the app or skipping levels. */
let __isPopping = false;

function pushNavState(state){
  if(__isPopping) return;
  const hash = state.view==='home' ? '#home'
    : state.view==='menu' ? '#menu/'+state.menuId
    : state.view==='entry' ? '#entry/'+state.group+'/'+state.id
    : state.view==='province' ? '#province/'+state.id
    : state.view==='allmenus' ? '#allmenus'
    : state.view==='provinsilist' ? '#provinsilist'
    : state.view==='settings' ? '#settings'
    : state.view==='kalender' ? '#kalender'
    : '#home';
  try{
    history.pushState(state, '', hash);
  }catch(err){
    /* Some sandboxed preview environments (e.g. srcdoc iframes) block
       History API URL changes. Fail silently — in-app navigation still
       works via showView(); only the browser back-button integration
       is unavailable in that specific environment. */
  }
}

window.addEventListener('popstate', (e)=>{
  __isPopping = true;
  const state = e.state || {view:'home'};
  if(state.view==='menu') openMenu(state.menuId);
  else if(state.view==='entry') openEntry(state.group, state.id);
  else if(state.view==='province') openProvince(state.id);
  else if(state.view==='allmenus') openAllMenus();
  else if(state.view==='provinsilist') openProvinsiList();
  else if(state.view==='settings') openSettings();
  else if(state.view==='kalender') openKalenderInteraktif();
  else goHome();
  __isPopping = false;
});

function goHome(){ showView('view-home'); setHeader({mode:'home'}); document.getElementById('searchInput').value=''; pushNavState({view:'home'}); }

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(q.length < 1){ searchResults.classList.remove('show'); return; }
  const results = SEARCH_INDEX.filter(i => i.name.toLowerCase().includes(q) || (i.meta||'').toLowerCase().includes(q)).slice(0,12);
  if(results.length===0){
    searchResults.innerHTML = '<div class="sr-item"><span class="sr-meta">Tidak ada hasil untuk "'+q+'"</span></div>';
  } else {
    searchResults.innerHTML = results.map(r=>`
      <div class="sr-item" onclick='selectResult(${JSON.stringify(r.ref)})'>
        <span class="sr-name">${r.name}</span>
        <span class="sr-meta">${r.type}${r.meta ? ' · '+r.meta : ''}</span>
      </div>`).join('');
  }
  searchResults.classList.add('show');
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.searchwrap')) searchResults.classList.remove('show');
});

function selectResult(ref){
  if(ref.kind==='province') openProvince(ref.id);
  else openEntry(ref.group, ref.id);
}

renderHome();
try{ history.replaceState({view:'home'}, '', '#home'); }catch(err){ /* see pushNavState note */ }
</script>
