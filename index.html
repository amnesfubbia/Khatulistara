<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khatulistara - Eksplorasi Nusantara</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Palet warna fresh & friendly (Muted Green/Sage) */
            --sage-green: #9CB49F;
            --olive-green: #5F7A63;
            --cream-bg: #F9F6F0;
            --terracotta: #C88164;
            --text-dark: #3A403C;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #EAEAEA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Simulasi Layar Smartphone */
        .app-container {
            width: 100%;
            max-width: 414px; /* Ukuran standar mobile */
            height: 850px;
            background-color: var(--cream-bg);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header / Top Bar */
        .header {
            background-color: var(--sage-green);
            padding: 30px 20px 20px 20px;
            color: var(--white);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 10px rgba(95, 122, 99, 0.2);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Content Area */
        .content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        .section-title {
            font-size: 18px;
            color: var(--olive-green);
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Grid Menu Utama */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .menu-card {
            background-color: var(--white);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border-color: var(--sage-green);
        }

        .menu-icon {
            font-size: 32px;
            color: var(--terracotta);
            margin-bottom: 10px;
        }

        .menu-card h3 {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Aksara Showcase (Fitur Khusus) */
        .aksara-card {
            background-color: var(--olive-green);
            color: var(--white);
            padding: 20px;
            border-radius: 15px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .aksara-text h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .aksara-text p {
            font-size: 12px;
            opacity: 0.8;
        }

        .aksara-btn {
            background-color: var(--terracotta);
            color: var(--white);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }

        .nav-item {
            text-align: center;
            color: var(--text-dark);
            opacity: 0.5;
            cursor: pointer;
            font-size: 12px;
        }

        .nav-item.active {
            color: var(--olive-green);
            opacity: 1;
            font-weight: 700;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 5px;
            display: block;
        }
        
        /* Modal Popup */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 30px;
        }
        
        .modal-content {
            background: var(--cream-bg);
            width: 80%;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
        }
        
        .modal-content h2 {
            color: var(--olive-green);
            margin-bottom: 10px;
        }
        
        .close-btn {
            margin-top: 15px;
            background: var(--sage-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fa-solid fa-leaf"></i> Khatulistara</h1>
            <p>Jelajahi Sejarah & Budaya Nusantara</p>
        </div>

        <!-- Content -->
        <div class="content">
            <h2 class="section-title">Eksplorasi Katalog</h2>
            
            <!-- Grid Menu 5 Pilar -->
            <div class="menu-grid">
                <div class="menu-card" onclick="openModal('Peta Nusantara')">
                    <i class="fa-solid fa-map-location-dot menu-icon"></i>
                    <h3>Peta Nusantara</h3>
                </div>
                <div class="menu-card" onclick="openModal('Ruang Aksara')">
                    <i class="fa-solid fa-pen-nib menu-icon"></i>
                    <h3>Ruang Aksara</h3>
                </div>
                <div class="menu-card" onclick="openModal('Lorong Waktu')">
                    <i class="fa-solid fa-hourglass-half menu-icon"></i>
                    <h3>Lorong Waktu</h3>
                </div>
                <div class="menu-card" onclick="openModal('Panggung Kesenian')">
                    <i class="fa-solid fa-mask menu-icon"></i>
                    <h3>Kesenian</h3>
                </div>
                <div class="menu-card" onclick="openModal('Pustaka Cerita')">
                    <i class="fa-solid fa-book-open menu-icon"></i>
                    <h3>Pustaka Cerita</h3>
                </div>
            </div>

            <!-- Sorotan: Modul Aksara -->
            <h2 class="section-title">Lanjutkan Belajar</h2>
            <div class="aksara-card">
                <div class="aksara-text">
                    <h4>Aksara Jawa</h4>
                    <p>Mengenal Hanacaraka Dasar</p>
                </div>
                <button class="aksara-btn" onclick="openModal('Modul Aksara Jawa')">Mulai</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fa-solid fa-house"></i>
                Beranda
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-compass"></i>
                Jelajah
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-bookmark"></i>
                Tersimpan
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-user"></i>
                Profil
            </div>
        </div>
        
        <!-- Modal Popup Interaktif -->
        <div id="demoModal" class="modal">
            <div class="modal-content">
                <i class="fa-solid fa-tools" style="font-size: 40px; color: var(--terracotta); margin-bottom: 15px;"></i>
                <h2 id="modalTitle">Menu Title</h2>
                <p style="color: var(--text-dark); font-size: 14px;">Halaman ini masih dalam tahap perancangan prototipe.</p>
                <button class="close-btn" onclick="closeModal()">Tutup</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Interaktif -->
    <script>
        function openModal(title) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('demoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('demoModal').style.display = 'none';
        }
    </script>
</body>
</html>
