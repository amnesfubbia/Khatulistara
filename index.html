<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesfubbia Film</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #080808; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; }
        .glass-nav { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .movie-card { transition: 0.3s; border-radius: 8px; overflow: hidden; background: #121212; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .type-badge { position: absolute; top: 5px; left: 5px; background: #ef4444; color: white; font-size: 7px; font-weight: 900; padding: 2px 5px; border-radius: 4px; z-index: 20; }
        .fav-btn { position: absolute; bottom: 35px; right: 8px; color: rgba(255,255,255,0.5); font-size: 16px; z-index: 30; transition: 0.3s; cursor: pointer; }
        .fav-btn.active { color: #ef4444; }
        .modal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full glass-nav p-3">
        <div class="container mx-auto space-y-3">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 shrink-0" onclick="window.location.reload()" style="cursor:pointer">
                    <span class="text-lg font-black italic">AMNES</span>
                    <span class="text-lg font-black text-red-600 italic">FILM</span>
                </div>
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="Cari film Indonesia..." class="w-full bg-black p-2 rounded-xl border border-white/10 outline-none focus:border-red-600 text-white text-[11px]">
                </div>
                <button onclick="searchIndo()" class="bg-red-600 px-3 py-2 rounded-xl font-black text-[10px]">CARI</button>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <select id="genreFilter" onchange="resetAndLoad()" class="bg-[#1a1a1a] p-2 rounded-lg text-white text-[10px] outline-none">
                    <option value="">Semua Genre</option>
                    <option value="27">Horor</option>
                    <option value="35">Komedi</option>
                    <option value="18">Drama</option>
                    <option value="28">Aksi</option>
                    <option value="10749">Romantis</option>
                </select>
                <select id="typeFilter" onchange="resetAndLoad()" class="bg-[#1a1a1a] p-2 rounded-lg text-red-500 font-bold text-[10px] outline-none">
                    <option value="movie">FILM</option>
                    <option value="tv">SERIES</option>
                </select>
                <button onclick="showFavorites()" class="bg-white/10 text-white px-3 py-2 rounded-lg text-[10px] font-black whitespace-nowrap">❤ MY LIST</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-2 pt-32 pb-10">
        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
        <div id="loader" class="text-center py-10 hidden text-red-600 font-bold">Memuat...</div>
    </main>

    <div id="movieModal" class="modal flex items-center justify-center p-2" onclick="if(event.target==this) closeModal()">
        <div class="bg-[#0a0a0a] w-full max-w-4xl rounded-2xl overflow-hidden relative border border-white/10 max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-white bg-black/50 w-8 h-8 rounded-full z-50">✕</button>
            <div id="modalContent" class="flex flex-col md:flex-row"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let page = 1;
        let isSearch = false;

        // Inisialisasi Langsung
        window.addEventListener('DOMContentLoaded', () => {
            loadMovies();
            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500 && !isSearch) {
                    page++;
                    loadMovies(true);
                }
            });
        });

        async function loadMovies(append = false) {
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');
            
            const type = document.getElementById('typeFilter').value;
            const genre = document.getElementById('genreFilter').value;
            let url = `https://api.themoviedb.org/3/discover/${type}?api_key=${API_KEY}&with_origin_country=ID&language=id-ID&page=${page}&sort_by=popularity.desc`;
            if (genre) url += `&with_genres=${genre}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                render(data.results, append);
            } catch (e) { console.error(e); }
            loader.classList.add('hidden');
        }

        function render(movies, append) {
            const grid = document.getElementById('movieGrid');
            if (!append) grid.innerHTML = '';
            
            movies.forEach(m => {
                if (!m.poster_path) return;
                const isFav = (JSON.parse(localStorage.getItem('myFavs')) || []).some(f => f.id === m.id);
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.innerHTML = `
                    <div class="type-badge">${m.title ? 'FILM' : 'SERIES'}</div>
                    <i class="fas fa-heart fav-btn ${isFav?'active':''}" onclick="toggleFav(event, ${m.id}, '${m.title||m.name}', '${m.poster_path}')"></i>
                    <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover" onclick="showDetail(${m.id}, '${m.title?'movie':'tv'}')">
                    <div class="p-2 text-[8px] font-bold truncate">${m.title || m.name}</div>
                `;
                grid.appendChild(div);
            });
        }

        async function showDetail(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&append_to_response=videos&language=id-ID`);
            const m = await res.json();
            const video = m.videos.results[0] ? `https://www.youtube.com/embed/${m.videos.results[0].key}` : '';

            document.getElementById('modalContent').innerHTML = `
                <div class="md:w-1/3 p-4">
                    <img src="${IMG + m.poster_path}" class="w-full rounded-xl">
                    <a href="https://vidsrc.to/embed/${type}/${m.id}" target="_blank" class="block bg-red-600 text-center py-3 mt-4 rounded-xl text-xs font-bold">NONTON SEKARANG</a>
                </div>
                <div class="md:w-2/3 p-6">
                    <h2 class="text-2xl font-black mb-2">${m.title || m.name}</h2>
                    <p class="text-red-500 text-[10px] mb-4">⭐ ${m.vote_average.toFixed(1)} | ${m.genres.map(g=>g.name).join(', ')}</p>
                    <div class="aspect-video bg-black rounded-lg overflow-hidden mb-4">
                        <iframe class="w-full h-full" src="${video}" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <p class="text-gray-400 text-xs italic">"${m.overview || 'Sinopsis tidak tersedia.'}"</p>
                </div>
            `;
            document.getElementById('movieModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function toggleFav(e, id, title, path) {
            e.stopPropagation();
            let favs = JSON.parse(localStorage.getItem('myFavs')) || [];
            const idx = favs.findIndex(f => f.id === id);
            if (idx === -1) {
                favs.push({id, title, poster_path: path});
                e.target.classList.add('active');
            } else {
                favs.splice(idx, 1);
                e.target.classList.remove('active');
            }
            localStorage.setItem('myFavs', JSON.stringify(favs));
        }

        function showFavorites() {
            isSearch = true;
            const favs = JSON.parse(localStorage.getItem('myFavs')) || [];
            render(favs, false);
            if(favs.length === 0) document.getElementById('movieGrid').innerHTML = '<p class="col-span-3 text-center py-20 text-xs text-gray-500">LIST KOSONG</p>';
        }

        function resetAndLoad() { page = 1; isSearch = false; loadMovies(); }

        async function searchIndo() {
            const q = document.getElementById('searchInput').value;
            if (!q) return;
            isSearch = true;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}&language=id-ID`);
            const data = await res.json();
            render(data.results.filter(m => m.original_language === 'id' || (m.origin_country && m.origin_country.includes('ID'))), false);
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
