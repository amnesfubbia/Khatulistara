<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>amnesfubbia xx1 - World Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fixed-header-section { position: fixed; top: 0; width: 100%; z-index: 100; background: #000; border-bottom: 1px solid #1c1c1c; }
        .ig-header { padding: 12px 15px 5px 15px; }
        .ig-logo { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: 24px; letter-spacing: -0.8px; text-transform: lowercase; cursor: pointer; }
        .verified-icon { font-size: 13px; color: #0095f6; margin-left: 5px; }
        .search-container { background: #0a0a0a; border-radius: 8px; display: flex; align-items: center; padding: 7px 12px; flex-grow: 1; border: 1px solid #1c1c1c; }
        .search-container input { background: transparent !important; border: none !important; color: white !important; font-size: 13px; width: 100%; outline: none !important; box-shadow: none !important; margin-left: 8px; }
        .year-selector { background: #0a0a0a; border: 1px solid #1c1c1c; border-radius: 8px; padding: 8px 12px; font-size: 9px; font-weight: 800; color: #fff; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .year-dropdown { display: none; position: fixed; top: 110px; right: 15px; width: 120px; max-height: 300px; background: #121212; border: 1px solid #1c1c1c; border-radius: 12px; z-index: 101; overflow-y: auto; }
        .year-item { padding: 12px; font-size: 11px; font-weight: 600; text-align: center; border-bottom: 1px solid #1c1c1c; color: #888; cursor: pointer; }
        .category-wrapper { padding: 5px 15px 12px 15px; }
        .pill-grid { display: grid; gap: 6px; }
        .pill { background: transparent; border: 1px solid #1c1c1c; color: #fff; padding: 8px 0; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; cursor: pointer; transition: border-color 0.2s; }
        .pill.active { background: transparent; color: #fff; border-color: #fff; }
        .highlights-section { padding: 15px 0; border-bottom: 1px solid #1c1c1c; background: #000; }
        .highlights-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .highlight-item { flex: 0 0 75px; text-align: center; cursor: pointer; }
        .circle-icon { width: 62px; height: 62px; border-radius: 50%; background: #000; border: 1.5px solid #1c1c1c; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; font-size: 18px; color: #555; }
        .highlight-item.active .circle-icon { 
            border: 2px solid transparent; 
            background: linear-gradient(#000, #000) padding-box, linear-gradient(45deg, #f09433 0%, #bc1888 100%) border-box; 
            color: #fff; 
        }
        .highlight-label { font-size: 9px; color: #555; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding-top: 330px; padding-bottom: 100px; }
        .post-card { position: relative; aspect-ratio: 2/3; background: #0a0a0a; overflow: hidden; cursor: pointer; }
        .post-card img { width: 100%; height: 100%; object-fit: cover; }
        .badge-type { position: absolute; top: 8px; right: 8px; font-size: 13px; color: #fff; z-index: 5; text-shadow: 0 0 4px rgba(0,0,0,0.8); }
        .badge-rating { position: absolute; top: 6px; left: 6px; padding: 2px 5px; border-radius: 2px; font-size: 7px; font-weight: 900; z-index: 5; background: rgba(255,255,255,0.9); color: #000; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 300; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { color: #fff; font-size: 20px; cursor: pointer; }
        
        /* Modal Player Style */
        .modal-player { display: none; position: fixed; inset: 0; z-index: 400; background: #000; overflow-y: auto; }
        #mTitle { font-size: 14px; font-weight: 700; color: #fff; }
        #mDesc { font-size: 13.5px; color: #fff; line-height: 1.4; }
        .interaction-icon { font-size: 24px; cursor: pointer; color: #fff; }
        .server-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid #1c1c1c; text-align: center; cursor: pointer; }
        .story-border { padding: 2.5px; background: linear-gradient(45deg, #f09433 0%, #bc1888 100%); border-radius: 50%; display: inline-block; }
        .story-inner { background: #000; padding: 2px; border-radius: 50%; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; }
        .ep-box { background: #111; border: 1px solid #1c1c1c; color: #555; font-size: 10px; font-weight: 800; padding: 12px 0; border-radius: 8px; text-align: center; cursor: pointer; }
        .ep-box.active { border-color: #fff; color: #fff; background: #1a1a1a; }
        .dl-link-btn { display: block; width: 100%; margin-top: 15px; padding: 14px; border-radius: 12px; background: #000; color: #a1a1aa; font-size: 10px; font-weight: 800; text-transform: uppercase; text-align: center; border: 1px solid #1c1c1c; }
        .skeleton { background: linear-gradient(90deg, #0a0a0a 25%, #1a1a1a 50%, #0a0a0a 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div id="loader" style="position:fixed; top:0; left:0; height:1.5px; background:#fff; width:0%; transition:width 0.3s; z-index:1000;"></div>

    <div class="fixed-header-section">
        <header class="ig-header">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <h1 class="ig-logo" onclick="location.reload()">amnesfubbia <span class="text-white opacity-40 font-normal italic">xx1</span></h1>
                    <i class="fa-solid fa-circle-check verified-icon"></i>
                </div>
                <div class="flex gap-6 text-xl"><i class="fa-regular fa-heart cursor-pointer" onclick="showLibrary('likes')"></i></div>
            </div>
            <div class="search-area flex items-center gap-2 mt-2">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass text-zinc-600 text-[10px]"></i>
                    <input type="text" id="searchInp" placeholder="Cari film & series..." onkeydown="if(event.key==='Enter') searchAction()">
                </div>
                <div class="year-selector" onclick="toggleYearDropdown()"><span id="yearVal">TAHUN</span> <i class="fa-solid fa-chevron-down text-[7px]"></i></div>
            </div>
        </header>
        <div class="category-wrapper">
            <div class="pill-grid grid-cols-4">
                <button class="pill active" onclick="setFilter('type', 'multi', this)">Semua</button>
                <button class="pill" onclick="setFilter('type', 'movie', this)">Film</button>
                <button class="pill" onclick="setFilter('type', 'tv', this)">Series</button>
                <button class="pill" onclick="setFilter('type', 'short', this)">Short</button>
            </div>
        </div>
        <div class="highlights-section">
            <div class="highlights-container no-scrollbar" id="genreHighlights">
                <div class="highlight-item active" onclick="setFilter('genre', '', this)"><div class="circle-icon"><i class="fa-solid fa-border-all"></i></div><p class="highlight-label">Semua</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '16', this)"><div class="circle-icon"><i class="fa-solid fa-dragon"></i></div><p class="highlight-label">Animasi</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '27', this)"><div class="circle-icon"><i class="fa-solid fa-ghost"></i></div><p class="highlight-label">Horor</p></div>
                <div class="highlight-item" onclick="setFilter('genre', '35', this)"><div class="circle-icon"><i class="fa-solid fa-masks-theater"></i></div><p class="highlight-label">Komedi</p></div>
            </div>
        </div>
    </div>

    <div id="yearDropdown" class="year-dropdown no-scrollbar"></div>
    <main id="feedGrid" class="movie-grid"></main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="closeModal(); location.reload();"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="closeModal(); document.getElementById('searchInp').focus();"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item" onclick="closeModal(); showLibrary('bookmarks');"><i class="fa-regular fa-bookmark"></i></div>
    </nav>

    <div id="movieModal" class="modal-player">
        <div class="max-w-xl mx-auto pb-40">
            <div class="px-4 h-[54px] flex items-center border-b border-zinc-900 sticky top-0 bg-black z-50">
                <i class="fa-solid fa-chevron-left text-xl cursor-pointer" onclick="closeModal()"></i>
                <div class="flex-grow flex flex-col items-center justify-center px-8">
                    <span class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest leading-none mb-1">Sinema Dunia</span>
                    <h2 id="mTitle" class="truncate w-full text-center leading-none"></h2>
                </div>
            </div>
            
            <div class="py-4 bg-black">
                <div id="mCast" class="flex gap-4 overflow-x-auto no-scrollbar px-4"></div>
            </div>

            <div class="aspect-video bg-zinc-900 w-full relative">
                <iframe id="videoPlayer" class="w-full h-full" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>

            <div class="px-4 py-3 flex justify-between items-center">
                <div class="flex gap-4">
                    <i id="btnLikeModal" class="interaction-icon"></i>
                    <i class="fa-regular fa-comment interaction-icon"></i>
                </div>
                <i id="btnBookModal" class="interaction-icon"></i>
            </div>

            <div class="px-4">
                <p id="mDesc" class="mb-2"></p>
                <p id="mMeta" class="text-[11px] text-zinc-500"></p>
                
                <div id="seriesControl" class="hidden mt-6 p-4 bg-zinc-950 rounded-2xl border border-zinc-900">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-[9px] font-black text-zinc-400 uppercase">Pilih Episode</h4>
                        <select id="seasonSel" class="bg-zinc-900 text-white text-[10px] px-2 py-1 rounded" onchange="loadEpisodes()"></select>
                    </div>
                    <div id="episodeGrid" class="grid grid-cols-5 gap-2"></div>
                </div>

                <div id="serverList" class="grid grid-cols-2 gap-2 mt-6"></div>
                <button id="btnDownloadMain" class="server-btn border-zinc-800 text-zinc-400 mt-4">Download Sinema</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'bfa7df5310c9974f62f26c6789a8c00d';
        let page = 1, loading = false, currentType = 'multi', currentGenre = '', currentYear = '', searchQuery = '';

        window.onload = () => { initYear(); loadFeed(); };

        function initYear() {
            const d = document.getElementById('yearDropdown');
            let h = '<div class="year-item" onclick="setYear(\'\')">SEMUA</div>';
            for(let y=2026; y>=1950; y--) h += `<div class="year-item" onclick="setYear(${y})">${y}</div>`;
            d.innerHTML = h;
        }

        async function loadFeed(isNew = true) {
            if(loading) return; loading = true;
            if(isNew) { page = 1; document.getElementById('feedGrid').innerHTML = ''; }
            
            const params = `api_key=${API_KEY}&language=id-ID&page=${page}&include_adult=false`;
            let url = '';
            
            if(searchQuery) {
                url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(searchQuery)}&${params}`;
            } else {
                let t = (currentType === 'tv') ? 'tv' : 'movie';
                url = `https://api.themoviedb.org/3/discover/${t}?${params}`;
                if(currentGenre) url += `&with_genres=${currentGenre}`;
                if(currentYear) url += (t === 'movie' ? `&primary_release_year=${currentYear}` : `&first_air_date_year=${currentYear}`);
                if(currentType === 'short') url += `&with_runtime.lte=40`;
                url += `&sort_by=popularity.desc`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderItems(data.results);
            } catch(e) { console.error(e); }
            loading = false;
        }

        function renderItems(items) {
            const grid = document.getElementById('feedGrid');
            items.forEach(m => {
                if(!m.poster_path) return;
                const card = document.createElement('div');
                card.className = 'post-card';
                const type = m.media_type || (currentType === 'tv' ? 'tv' : 'movie');
                card.onclick = () => openModal(m.id, type);
                card.innerHTML = `<div class="badge-rating"><i class="fa-solid fa-star"></i> ${m.vote_average.toFixed(1)}</div><img src="https://image.tmdb.org/t/p/w342${m.poster_path}">`;
                grid.appendChild(card);
            });
        }

        async function openModal(id, type) {
            window.currentMediaId = id;
            window.currentMediaType = type;
            const modal = document.getElementById('movieModal');
            modal.style.display = 'block'; document.body.style.overflow = 'hidden';

            try {
                // Fetch data dalam 2 bahasa (ID & EN) agar trailer pasti ketemu
                const [resId, resEn] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=id-ID&append_to_response=credits,videos`),
                    fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${API_KEY}&language=en-US`)
                ]);
                const d = await resId.json();
                const dEn = await resEn.json();

                document.getElementById('mTitle').innerText = d.title || d.name;
                document.getElementById('mDesc').innerText = d.overview || "Sinopsis tidak tersedia.";
                document.getElementById('mMeta').innerText = `${(d.release_date || d.first_air_date || '').split('-')[0]} • ${type.toUpperCase()}`;

                // LOGIKA TRAILER
                const allVids = [...(d.videos?.results || []), ...(dEn.results || [])];
                const trailer = allVids.find(v => v.type === 'Trailer' || v.type === 'Teaser' || v.type === 'Clip');

                if (trailer) {
                    document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&rel=0`;
                } else {
                    // Fallback ke server streaming jika tidak ada trailer
                    document.getElementById('videoPlayer').src = type === 'tv' ? `https://vidrock.net/embed/tv/${id}/1/1` : `https://vidrock.net/embed/movie/${id}`;
                }

                document.getElementById('mCast').innerHTML = (d.credits?.cast || []).slice(0, 10).map(c => `
                    <div class="flex-shrink-0 text-center">
                        <div class="story-border"><div class="story-inner"><img src="https://image.tmdb.org/t/p/w185${c.profile_path}" class="story-img" onerror="this.src='https://via.placeholder.com/100'"></div></div>
                        <p class="text-[9px] text-zinc-400 mt-1">${c.name.split(' ')[0]}</p>
                    </div>`).join('');

                if(type === 'tv') {
                    document.getElementById('seriesControl').classList.remove('hidden');
                    document.getElementById('serverList').classList.add('hidden');
                    document.getElementById('seasonSel').innerHTML = d.seasons.filter(s=>s.season_number>0).map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
                    loadEpisodes();
                } else {
                    document.getElementById('seriesControl').classList.add('hidden');
                    document.getElementById('serverList').classList.remove('hidden');
                    document.getElementById('serverList').innerHTML = `
                        <button class="server-btn bg-white text-black" onclick="document.getElementById('videoPlayer').src='https://vidrock.net/embed/movie/${id}'">Server 1</button>
                        <button class="server-btn" onclick="document.getElementById('videoPlayer').src='https://vidstorm.ru/embed/movie/${id}'">Server 2</button>`;
                    document.getElementById('btnDownloadMain').onclick = () => window.open(`https://dl.vidsrc.vip/movie/${id}`, '_blank');
                }
                updateLibButtons(id);
            } catch(e) { console.error(e); }
        }

        async function loadEpisodes() {
            const s = document.getElementById('seasonSel').value;
            const res = await fetch(`https://api.themoviedb.org/3/tv/${window.currentMediaId}/season/${s}?api_key=${API_KEY}`);
            const d = await res.json();
            document.getElementById('episodeGrid').innerHTML = d.episodes.map(e => `<div class="ep-box" id="ep-${e.episode_number}" onclick="playEp(${s},${e.episode_number})">${e.episode_number}</div>`).join('');
            playEp(s, 1);
        }

        function playEp(s, e) {
            document.getElementById('videoPlayer').src = `https://vidrock.net/embed/tv/${window.currentMediaId}/${s}/${e}`;
            document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
            if(document.getElementById(`ep-${e}`)) document.getElementById(`ep-${e}`).classList.add('active');
        }

        function setFilter(t, v, el) { 
            if(t === 'type') currentType = v; else currentGenre = v; 
            document.querySelectorAll('.pill, .highlight-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active'); loadFeed(true); 
        }

        function setYear(y) { currentYear = y; document.getElementById('yearVal').innerText = y || 'TAHUN'; toggleYearDropdown(); loadFeed(true); }
        function toggleYearDropdown() { const d = document.getElementById('yearDropdown'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
        function searchAction() { searchQuery = document.getElementById('searchInp').value; loadFeed(true); }
        function closeModal() { document.getElementById('movieModal').style.display = 'none'; document.getElementById('videoPlayer').src = ''; document.body.style.overflow = 'auto'; }

        // Local Storage Lib
        function toggleLib(k) {
            let items = JSON.parse(localStorage.getItem(k) || '[]');
            const idx = items.findIndex(x => x.id == window.currentMediaId);
            if(idx > -1) items.splice(idx, 1);
            else items.push({id: window.currentMediaId, type: window.currentMediaType});
            localStorage.setItem(k, JSON.stringify(items));
            updateLibButtons(window.currentMediaId);
        }

        function updateLibButtons(id) {
            const isL = (JSON.parse(localStorage.getItem('likes') || '[]')).some(x => x.id == id);
            const isB = (JSON.parse(localStorage.getItem('bookmarks') || '[]')).some(x => x.id == id);
            document.getElementById('btnLikeModal').className = isL ? 'fa-solid fa-heart text-red-500 interaction-icon' : 'fa-regular fa-heart interaction-icon';
            document.getElementById('btnLikeModal').onclick = () => toggleLib('likes');
            document.getElementById('btnBookModal').className = isB ? 'fa-solid fa-bookmark text-white interaction-icon' : 'fa-regular fa-bookmark interaction-icon';
            document.getElementById('btnBookModal').onclick = () => toggleLib('bookmarks');
        }

        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800 && !loading) { page++; loadFeed(false); } };
    </script>
</body>
</html>
